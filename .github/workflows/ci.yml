name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Docs, Unit, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm run security:audit

      - name: Run core verification
        run: npm run verify

      - name: Test Plan display result contract
        run: npx tsx --test components/flow/personal-workspace-poc/PersonalWorkspacePocPlanResultSurface.test.tsx

      - name: Check integrated PoC types
        run: npm run typecheck:integrated-product-poc

      - name: Test integrated PoC contracts
        run: npm run test:integrated-product-poc

      - name: Install integrated PoC browser
        run: npx playwright install --with-deps chromium

      - name: Test portable integrated PoC journeys
        run: npm run test:e2e:integrated-product-poc

      - name: Upload integrated PoC verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integrated-poc-verification
          path: output/integrated-product-poc/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # All current, operating and historical owners remain in this lane. The
    # extra isolated history build and 750+ cases need a measured full-run budget.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            output/playwright/
          if-no-files-found: ignore
          retention-days: 14
