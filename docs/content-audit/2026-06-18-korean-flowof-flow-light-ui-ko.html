<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>한글 원문 기반 실행 지도</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --surface: #ffffff;
        --soft: #f8fafc;
        --soft-blue: #eaf2ff;
        --soft-green: #e9f8f1;
        --soft-amber: #fff6df;
        --line: #d7e0ec;
        --line-strong: #b7c4d5;
        --text: #101828;
        --muted: #5b687a;
        --blue: #245fce;
        --green: #0f7a4a;
        --amber: #995d00;
        --shadow: 0 14px 34px rgba(16, 24, 40, 0.08);
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        background: linear-gradient(180deg, #fbfdff 0, var(--bg) 360px);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.56;
      }

      button, input, textarea { font: inherit; }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 850;
      }

      a {
        color: var(--blue);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      h1, h2, h3, p { margin-top: 0; }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(29px, 5vw, 44px);
        line-height: 1.1;
        letter-spacing: 0;
        word-break: keep-all;
      }

      h2 {
        margin-bottom: 6px;
        font-size: clamp(24px, 3.4vw, 34px);
        line-height: 1.2;
        letter-spacing: 0;
        word-break: keep-all;
      }

      h3 {
        margin-bottom: 4px;
        font-size: 20px;
        line-height: 1.28;
        letter-spacing: 0;
        word-break: keep-all;
      }

      .page {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
        padding: 14px 0 64px;
      }

      .topbar,
      .hero,
      .flow-nav,
      .workspace,
      .panel,
      .row-button,
      .group-button,
      .note,
      .date-input {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 58px;
        padding: 12px 16px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      }

      .brand {
        color: var(--blue);
        font-size: 24px;
        font-weight: 950;
        text-decoration: none;
      }

      .small-button {
        padding: 0 12px;
        border: 1px solid var(--line);
        background: white;
        color: #344054;
      }

      .hero {
        margin-top: 12px;
        padding: 18px;
        box-shadow: var(--shadow);
      }

      .eyebrow {
        margin-bottom: 6px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 950;
      }

      .desc {
        max-width: 760px;
        margin-bottom: 0;
        color: var(--muted);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--soft);
        color: #344054;
        font-size: 13px;
        font-weight: 850;
      }

      .chip.blue { border-color: #b9cdf6; background: var(--soft-blue); color: #1d4ed8; }
      .chip.green { border-color: #b8e6ca; background: var(--soft-green); color: var(--green); }
      .chip.amber { border-color: #ebcd8a; background: var(--soft-amber); color: var(--amber); }

      .flow-nav {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 6px;
        margin-top: 12px;
        padding: 8px;
        background: #edf3f9;
      }

      .flow-tab {
        min-height: 58px;
        padding: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: #344054;
        text-align: left;
      }

      .flow-tab span,
      .flow-tab b { display: block; }

      .flow-tab span {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .flow-tab.active {
        border-color: var(--blue);
        background: white;
        color: #1d4ed8;
        box-shadow: inset 0 0 0 1px var(--blue);
      }

      .workspace {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 0;
        margin-top: 12px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .sidebar {
        padding: 16px;
        border-right: 1px solid var(--line);
        background: #f2f6fb;
      }

      .content {
        min-width: 0;
        padding: 16px;
        background: white;
      }

      .panel {
        padding: 14px;
      }

      .panel + .panel { margin-top: 12px; }

      .source-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }

      .source-line a {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: white;
        font-size: 13px;
        font-weight: 850;
        text-decoration: none;
      }

      .primary {
        width: 100%;
        margin-top: 12px;
        padding: 0 14px;
        background: var(--blue);
        color: white;
      }

      .primary.saved {
        background: var(--green);
      }

      .toast {
        display: none;
        margin-top: 10px;
        padding: 9px 10px;
        border: 1px solid #b9cdf6;
        border-radius: 8px;
        background: var(--soft-blue);
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 850;
      }

      .toast.show { display: block; }

      .label {
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 950;
      }

      .date-input {
        width: 100%;
        min-height: 46px;
        padding: 9px 10px;
        border-color: var(--line-strong);
      }

      .groups,
      .rows {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }

      .group-button,
      .row-button {
        width: 100%;
        padding: 10px;
        color: #344054;
        text-align: left;
      }

      .group-button {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        background: white;
      }

      .group-button.active {
        border-color: var(--blue);
        background: var(--soft-blue);
        color: #1d4ed8;
        box-shadow: inset 0 0 0 1px var(--blue);
      }

      .group-button b,
      .group-button span,
      .row-main,
      .row-sub { display: block; }

      .group-button span,
      .row-sub {
        margin-top: 2px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 750;
      }

      .row-button {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr);
        gap: 9px;
        align-items: start;
        background: var(--soft);
      }

      .row-button.active {
        border-color: var(--blue);
        background: var(--soft-blue);
        box-shadow: inset 0 0 0 1px var(--blue);
      }

      .row-check {
        width: 20px;
        height: 20px;
        min-height: 20px;
        margin-top: 2px;
        accent-color: var(--blue);
      }

      .row-main {
        color: var(--text);
        font-weight: 900;
        overflow-wrap: anywhere;
      }

      .progress-bar {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #e6edf5;
      }

      .progress-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: var(--blue);
        transition: width 160ms ease;
      }

      .progress-text {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
        color: #344054;
        font-size: 14px;
        font-weight: 850;
      }

      .detail-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: start;
      }

      textarea {
        width: 100%;
        min-height: 96px;
        margin-top: 8px;
        padding: 10px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: white;
        color: var(--text);
        resize: vertical;
      }

      .note {
        margin-top: 12px;
        padding: 11px;
        background: var(--soft);
        color: #344054;
        font-size: 14px;
      }

      .note.warn {
        border-color: #ebcd8a;
        background: var(--soft-amber);
        color: #7a4a00;
      }

      .empty {
        padding: 14px;
        border: 1px dashed var(--line-strong);
        border-radius: 8px;
        background: var(--soft);
        color: var(--muted);
        font-weight: 750;
      }

      @media (max-width: 1020px) {
        .flow-nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .workspace { grid-template-columns: 1fr; }
        .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      }

      @media (max-width: 640px) {
        .page {
          width: min(100% - 20px, 1180px);
          padding-top: 10px;
        }

        .topbar,
        .hero,
        .sidebar,
        .content { padding: 14px; }

        .flow-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }

        .flow-tab {
          min-height: 64px;
          padding: 8px 7px;
        }

        .detail-head { display: block; }

        .row-button {
          grid-template-columns: 25px minmax(0, 1fr);
        }
      }
    </style>
  </head>

          <section class="panel" id="progressPanel"></section>

        </section>
      </section>
    </main>

          extraSources: [

                { title: "생후 4개월 항목 확인", detail: "4개월 표준 일정 확인", range: { monthsFrom: 4, monthsTo: 4 } },
                { title: "생후 6개월 항목 확인", detail: "6개월 표준 일정 확인", range: { monthsFrom: 6, monthsTo: 6 } }

              rows: [

                { title: "생후 15~18개월 항목 확인", detail: "15~18개월 표준 일정 확인", range: { monthsFrom: 15, monthsTo: 18 } },
                { title: "생후 19~23개월 항목 확인", detail: "19~23개월 표준 일정 확인", range: { monthsFrom: 19, monthsTo: 23 } },
                { title: "생후 24~35개월 항목 확인", detail: "24~35개월 표준 일정 확인", range: { monthsFrom: 24, monthsTo: 35 } }
              ]
            },
            {
              title: "학령 전후",
              rows: [
                { title: "만 4~6세 항목 확인", detail: "4~6세 표준 일정 확인", range: { monthsFrom: 48, monthsTo: 72 } },
                { title: "만 11~12세 항목 확인", detail: "11~12세 표준 일정 확인", range: { monthsFrom: 132, monthsTo: 156 } }
              ]
            }
          ]
        }
      ];

      const state = {
        flowId: flows[0].id,
        groupIndex: 0,
        rowIndex: 0,
        saved: {},
        checked: {},
        memo: {},
        inputValues: {}
      };

      const $ = (id) => document.getElementById(id);

      function currentFlow() {
        return flows.find((flow) => flow.id === state.flowId);
      }

      function currentGroup() {
        return currentFlow().groups[state.groupIndex];
      }

      function currentRow() {
        return currentGroup().rows[state.rowIndex];
      }

      function rowKey(flow = currentFlow(), groupIndex = state.groupIndex, rowIndex = state.rowIndex) {
        return `${flow.id}:${groupIndex}:${rowIndex}`;
      }

      function allRows(flow) {
        return flow.groups.flatMap((group, groupIndex) =>
          group.rows.map((row, rowIndex) => ({ row, group, groupIndex, rowIndex }))
        );
      }

      function completedCount(flow) {
        return allRows(flow).filter((entry) => state.checked[rowKey(flow, entry.groupIndex, entry.rowIndex)]).length;
      }

      function formatDate(date) {
        if (!date || Number.isNaN(date.getTime())) return "";
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, "0");
        const dd = String(date.getDate()).padStart(2, "0");
        return `${yyyy}. ${mm}. ${dd}.`;
      }

      function addDays(date, days) {
        const next = new Date(date);
        next.setDate(next.getDate() + days);
        return next;
      }

      function addMonths(date, months) {
        const next = new Date(date);
        next.setMonth(next.getMonth() + months);
        return next;
      }

      function dateRangeText(flow, row) {
        if (!row.range || !flow.input) return "";
        const value = state.inputValues[flow.id] || flow.input.defaultValue;
        if (!value) return row.detail;
        const birth = new Date(`${value}T00:00:00`);
        if (Number.isNaN(birth.getTime())) return row.detail;
        const from = row.range.daysFrom !== undefined ? addDays(birth, row.range.daysFrom) : addMonths(birth, row.range.monthsFrom);
        const to = row.range.daysTo !== undefined ? addDays(birth, row.range.daysTo) : addMonths(birth, row.range.monthsTo);
        return `${formatDate(from)} ~ ${formatDate(to)}`;
      }

      function renderTabs() {
        $("flowTabs").innerHTML = flows.map((flow) => {
          const active = flow.id === state.flowId ? " active" : "";
          return `
            <button class="flow-tab${active}" type="button" data-flow="${flow.id}">
              <b>${flow.tab}</b>
              <span>${flow.kind}</span>
            </button>
          `;
        }).join("");

        document.querySelectorAll(".flow-tab").forEach((button) => {
          button.addEventListener("click", () => {
            state.flowId = button.dataset.flow;
            state.groupIndex = 0;
            state.rowIndex = 0;
            render();
          });
        });
      }

      function renderSource() {
        const flow = currentFlow();
        if (flow.input && !state.inputValues[flow.id]) state.inputValues[flow.id] = flow.input.defaultValue;
        $("sourcePanel").innerHTML = `
          <p class="label">${flow.kind}</p>
          <h2>${flow.title}</h2>
          <p class="desc">${flow.summary}</p>
          ${flow.input ? `
            <div style="margin-top:12px">
              <label class="label" for="flowInput">${flow.input.label}</label>
              <input class="date-input" id="flowInput" type="${flow.input.type}" value="${state.inputValues[flow.id] || ""}" />
            </div>
          ` : ""}
          <button class="primary${state.saved[flow.id] ? " saved" : ""}" type="button" id="saveButton">
            ${state.saved[flow.id] ? "내 Flow에 저장됨" : "내 Flow에 저장"}
          </button>
          <div class="toast${state.saved[flow.id] ? " show" : ""}" id="saveToast">전체 목록이 내 Flow에 들어갔습니다. 각 항목은 체크와 메모만 남깁니다.</div>
          <div class="source-line">
            <a href="${flow.sourceUrl}" target="_blank" rel="noreferrer">원문 보기</a>
            ${flow.extraSources.map((source) => `<a href="${source.url}" target="_blank" rel="noreferrer">${source.label}</a>`).join("")}
          </div>
          ${flow.caution ? `<div class="note warn">${flow.caution}</div>` : ""}
        `;

        const input = $("flowInput");
        if (input) {
          input.addEventListener("input", (event) => {
            state.inputValues[flow.id] = event.target.value;
            renderRows();
            renderDetail();
          });
        }

        $("saveButton").addEventListener("click", () => {
          state.saved[flow.id] = !state.saved[flow.id];
          renderSource();
        });
      }

      function renderGroups() {
        const flow = currentFlow();
        $("groupPanel").innerHTML = `
          <p class="label">전체 지도</p>
          <div class="groups">
            ${flow.groups.map((group, index) => {
              const done = group.rows.filter((_, rowIndex) => state.checked[rowKey(flow, index, rowIndex)]).length;
              const active = index === state.groupIndex ? " active" : "";
              return `
                <button class="group-button${active}" type="button" data-group="${index}">
                  <span>
                    <b>${group.title}</b>
                    <span>${group.rows.length}개 항목</span>
                  </span>
                  <span class="chip">${done}/${group.rows.length}</span>
                </button>
              `;
            }).join("")}
          </div>
        `;

        document.querySelectorAll(".group-button").forEach((button) => {
          button.addEventListener("click", () => {
            state.groupIndex = Number(button.dataset.group);
            state.rowIndex = 0;
            render();
          });
        });
      }

      function renderProgress() {
        const flow = currentFlow();
        const total = allRows(flow).length;
        const done = completedCount(flow);
        const percent = total ? Math.round((done / total) * 100) : 0;
        $("progressPanel").innerHTML = `
          <div class="progress-text">
            <span>전체 진행</span>
            <span>${done}/${total} 완료</span>
          </div>
          <div class="progress-bar" aria-label="전체 진행률">
            <div class="progress-fill" style="width:${percent}%"></div>
          </div>
        `;
      }

      function renderRows() {
        const flow = currentFlow();
        const group = currentGroup();
        $("rowPanel").innerHTML = `
          <p class="label">${group.title}</p>
          <div class="rows">
            ${group.rows.map((row, index) => {
              const key = rowKey(flow, state.groupIndex, index);
              const active = index === state.rowIndex ? " active" : "";
              const checked = state.checked[key] ? " checked" : "";
              const sub = dateRangeText(flow, row) || row.detail;
              return `
                <button class="row-button${active}" type="button" data-row="${index}">
                  <input class="row-check" type="checkbox" data-check="${index}"${checked} aria-label="${row.title} 완료" />
                  <span>
                    <span class="row-main">${row.title}</span>
                    <span class="row-sub">${sub}</span>
                  </span>
                </button>
              `;
            }).join("")}
          </div>
        `;

        document.querySelectorAll(".row-button").forEach((button) => {
          button.addEventListener("click", (event) => {
            if (event.target.matches("input")) return;
            state.rowIndex = Number(button.dataset.row);
            renderRows();
            renderDetail();
          });
        });

        document.querySelectorAll(".row-check").forEach((input) => {
          input.addEventListener("click", (event) => {
            event.stopPropagation();
            const index = Number(input.dataset.check);
            const key = rowKey(flow, state.groupIndex, index);
            state.checked[key] = input.checked;
            state.rowIndex = index;
            render();
          });
        });
      }

      function renderDetail() {
        const flow = currentFlow();
        const group = currentGroup();
        const row = currentRow();
        const key = rowKey();
        const checked = state.checked[key] ? " checked" : "";
        const sub = dateRangeText(flow, row) || row.detail;
        $("detailPanel").innerHTML = `
          <div class="detail-head">
            <div>
              <p class="label">선택 항목</p>
              <h3>${row.title}</h3>
              <p class="desc">${sub}</p>
            </div>
            <span class="chip blue">${group.title}</span>
          </div>
          <label class="row-button" style="margin-top:12px" for="detailDone">
            <input class="row-check" id="detailDone" type="checkbox"${checked} />
            <span>
              <span class="row-main">이 항목 완료</span>
              <span class="row-sub">나중에 다시 볼 내용은 아래 메모에 남깁니다.</span>
            </span>
          </label>
          <label class="label" for="rowMemo" style="display:block;margin-top:14px">${flow.memoLabel}</label>
          <textarea id="rowMemo" placeholder="${flow.memoPlaceholder}">${state.memo[key] || ""}</textarea>
          <div class="note">
            원문 항목은 바꾸지 않고, 완료 체크와 메모만 남깁니다.
            자세한 설명은 <a href="${flow.sourceUrl}" target="_blank" rel="noreferrer">${flow.sourceName}</a>에서 확인합니다.
          </div>
        `;

        $("detailDone").addEventListener("change", (event) => {
          state.checked[key] = event.target.checked;
          render();
        });

        $("rowMemo").addEventListener("input", (event) => {
          state.memo[key] = event.target.value;
        });
      }

      function render() {
        renderTabs();
        renderSource();
        renderGroups();
        renderProgress();
        renderRows();
        renderDetail();
      }

      $("resetButton").addEventListener("click", () => {
        state.checked = {};
        state.memo = {};
        render();
      });

      render();
    </script>
  </body>
