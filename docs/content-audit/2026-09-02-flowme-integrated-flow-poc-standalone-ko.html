<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FlowMe 개인공간</title>
  <link rel="icon" href="data:,">
  <style data-flowme-standalone-inline="style">
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-soft: #f5f7f8;
  --line: #dce3e6;
  --line-strong: #aabac4;
  --ink: #1c2931;
  --muted: #52636c;
  --blue: #087f73;
  --blue-dark: #066c63;
  --blue-soft: #e5f2ef;
  --teal: #087f73;
  --teal-soft: #e5f2ef;
  --danger: #a22d22;
  --success: #087f73;
  --shadow: 0 16px 48px rgba(35, 49, 60, .12);
  --radius: 8px;
  --focus: 0 0 0 3px rgba(18, 104, 177, .20);
  --standalone-safe-top: env(safe-area-inset-top, 0px);
  --standalone-safe-right: env(safe-area-inset-right, 0px);
  --standalone-safe-bottom: env(safe-area-inset-bottom, 0px);
  --standalone-safe-left: env(safe-area-inset-left, 0px);
  font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--bg); }
body { margin: 0; color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.55; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .48; }
:focus-visible { outline: none; box-shadow: var(--focus); }
.skip-link { position: fixed; left: 12px; top: -60px; z-index: 100; padding: 10px 14px; border-radius: 8px; background: #111827; color: #fff; }
.skip-link:focus { top: 12px; }
.visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0 0 0 0) !important; white-space: nowrap !important; border: 0 !important; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 68px;
  display: grid;
  grid-template-columns: 220px minmax(250px, 1fr) auto;
  align-items: center;
  gap: 24px;
  padding: 0 26px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(12px);
}
.brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px; font-size: 19px; font-weight: 800; letter-spacing: -.03em; }
.brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; color: #fff; background: var(--blue); font-size: 16px; box-shadow: 0 7px 18px rgba(36, 107, 253, .25); }
.product-nav { justify-self: center; display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: var(--surface-soft); }
.product-nav button { min-height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; color: var(--muted); }
.product-nav button[aria-current="page"] { color: var(--blue-dark); background: #fff; box-shadow: 0 2px 7px rgba(31, 47, 72, .10); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.save-status { max-width: 160px; color: var(--muted); font-size: 12px; text-align: right; }
.poc-boundary { min-height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 26px; border-bottom: 1px solid #bdded8; background: var(--teal-soft); color: #356b67; font-size: 12px; font-weight: 700; }
.boundary-actions { flex: none; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.boundary-undo { display: none; min-width: 44px; min-height: 44px; padding: 0 9px; border: 1px solid #8fb8b2; border-radius: 6px; color: var(--blue-dark); background: #fff; font-size: 12px; font-weight: 750; }

.button { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 15px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font-weight: 750; }
.button:hover:not(:disabled) { border-color: #aeb9c8; background: #fbfcfe; }
.button.primary { border-color: var(--blue); color: #fff; background: var(--blue); }
.button.primary:hover:not(:disabled) { border-color: var(--blue-dark); background: var(--blue-dark); }
.button.quiet { min-height: 36px; padding-inline: 11px; background: transparent; font-size: 13px; }
.button.danger { color: var(--danger); }
.icon-button { width: 38px; height: 38px; padding: 0; border: 0; border-radius: 9px; background: transparent; font-size: 22px; line-height: 1; }
.icon-button:hover { background: var(--surface-soft); }

.app-shell { min-height: calc(100vh - 132px); display: grid; grid-template-columns: 264px minmax(0, 1fr); }
.sidebar { padding: 26px 18px 34px; border-right: 1px solid var(--line); background: #fbfcfe; }
.side-section + .side-section { margin-top: 26px; }
.side-head { min-height: 30px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px 7px; }
.side-head strong { color: #7a8699; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.side-head button { border: 0; border-radius: 7px; background: transparent; color: var(--blue); font-size: 12px; font-weight: 800; }
.side-list { display: grid; gap: 3px; }
.side-link { width: 100%; min-height: 41px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 11px; border: 0; border-radius: 10px; background: transparent; color: #48566c; text-align: left; }
.side-link:hover { background: #f0f4fa; }
.side-link[aria-current="page"] { color: var(--blue-dark); background: var(--blue-soft); font-weight: 780; }
.side-link .side-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-link .count { min-width: 22px; padding: 1px 6px; border-radius: 999px; color: #66748a; background: #e7ecf3; font-size: 11px; text-align: center; }
.side-link.child { padding-left: 30px; }

.main { min-width: 0; }
.content { width: min(100%, 1120px); margin: 0 auto; padding: 38px 44px 64px; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.page-head h1 { margin: 0; font-size: clamp(27px, 3vw, 38px); line-height: 1.18; letter-spacing: -.045em; }
.page-head p { max-width: 650px; margin: 8px 0 0; color: var(--muted); }
.page-actions { flex: none; display: flex; flex-wrap: wrap; gap: 8px; }
.section-title { margin: 30px 0 12px; font-size: 17px; letter-spacing: -.02em; }
.section-title:first-child { margin-top: 0; }
.period-timeline { display: grid; border-top: 1px solid var(--line); }
.period-day { min-width: 0; padding: 18px 0 22px; border-bottom: 1px solid var(--line); }
.period-date-head { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px 10px 8px; }
.period-date-head h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
.month-date-add, .month-empty-toggle { min-height: 44px; border: 1px solid #b7cac7; border-radius: 6px; color: var(--blue-dark); background: #fff; font: inherit; font-weight: 700; }
.month-date-add { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; }
.month-date-add:hover, .month-empty-toggle:hover { border-color: var(--blue); background: var(--blue-soft); }
.period-day .task-list { border-top: 0; }
.period-day-empty { min-height: 48px; display: flex; align-items: center; padding: 0 8px; color: var(--muted); font-size: 13px; }
.month-empty-toggle { width: 100%; margin-top: 12px; padding: 0 16px; }
.summary-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--line); }
.summary-cell { min-height: 88px; display: grid; align-content: center; padding: 15px 18px; background: var(--surface); }
.summary-cell strong { font-size: 23px; letter-spacing: -.035em; }
.summary-cell span { color: var(--muted); font-size: 12px; }

.flow-list, .task-list { display: grid; gap: 9px; }
.task-list.reorder-corridor { outline: 2px solid color-mix(in srgb, var(--blue) 38%, transparent); outline-offset: 4px; }
.flow-row, .task-row { border: 1px solid var(--line); border-radius: 13px; background: var(--surface); transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease; }
.flow-row:hover, .task-row:hover { border-color: #c5cfdd; box-shadow: 0 6px 18px rgba(31, 47, 72, .06); }
.flow-row { display: grid; grid-template-columns: minmax(0, 1fr) 48px auto; align-items: center; gap: 8px; padding: 16px 17px; }
.flow-main { min-width: 0; }
.flow-main button { max-width: 100%; padding: 0; border: 0; background: transparent; color: var(--ink); font-size: 16px; font-weight: 780; text-align: left; }
.flow-main button:hover { color: var(--blue-dark); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; margin-top: 5px; color: var(--muted); font-size: 12px; }
.origin { color: var(--teal); font-weight: 750; }
.row-actions { display: flex; align-items: center; gap: 6px; }
.row-actions button { min-width: 38px; min-height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 13px; font-weight: 750; }
.row-actions button:hover { border-color: var(--blue); color: var(--blue-dark); }

.task-row { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr) 48px auto; align-items: center; gap: 9px; min-height: 68px; padding: 11px 12px; touch-action: pan-y; }
.drag-handle { width: 48px; min-width: 48px; height: 48px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: #fff; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; font-size: 20px; }
.drag-handle:hover, .drag-handle:focus-visible { border-color: var(--blue); color: var(--blue-dark); background: var(--blue-soft); }
.drag-handle:active { cursor: grabbing; }
.task-row.dragging, .flow-row.dragging { opacity: .52; }
.task-row.drop-target { border-color: var(--blue); box-shadow: var(--focus); }
.task-row.drop-before::before, .task-row.drop-after::after { content: ""; position: absolute; z-index: 3; right: 8px; left: 8px; height: 3px; border-radius: 999px; background: var(--blue); box-shadow: 0 0 0 2px #fff; pointer-events: none; }
.task-row.drop-before::before { top: -2px; }
.task-row.drop-after::after { bottom: -2px; }
.check { width: 28px; height: 28px; display: grid; place-items: center; border: 1.5px solid #b3bfce; border-radius: 9px; background: #fff; font-size: 14px; }
.check[aria-pressed="true"] { border-color: var(--success); color: #fff; background: var(--success); }
.task-copy { min-width: 0; }
.task-title { display: block; overflow-wrap: anywhere; font-weight: 730; }
.task-row.done .task-title { color: #7a8698; text-decoration: line-through; }
.task-meta { display: flex; flex-wrap: wrap; gap: 4px 9px; margin-top: 3px; color: var(--muted); font-size: 12px; }
.empty { padding: 42px 22px; border: 1px dashed #cbd5e2; border-radius: var(--radius); color: var(--muted); background: rgba(255, 255, 255, .55); text-align: center; }
.empty strong { display: block; margin-bottom: 5px; color: #405069; font-size: 16px; }
.boot-fallback { max-width: 720px; margin: 8vh auto 0; padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
.boot-fallback h1 { margin: 0; font-size: clamp(25px, 4vw, 36px); letter-spacing: -.04em; }
.boot-fallback p { margin: 10px 0 0; color: var(--muted); }
.boot-fallback strong { color: var(--ink); }

.detail-back { margin: 0 0 20px; padding: 0; border: 0; background: none; color: var(--blue-dark); font-weight: 780; }
.detail-header { padding: 27px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.detail-header h1 { margin: 0; font-size: clamp(25px, 3vw, 36px); line-height: 1.2; letter-spacing: -.04em; }
.detail-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.step-block { margin-top: 26px; }
.step-block h2 { margin: 0 0 11px; font-size: 18px; }
.raw-source { margin-top: 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.raw-source summary { padding: 14px 16px; cursor: pointer; font-weight: 760; }
.raw-source pre { overflow: auto; max-height: 340px; margin: 0; padding: 16px; border-top: 1px solid var(--line); background: #f8fafc; font: 13px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }

.plan-editor, .result-panel { margin-top: 24px; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.plan-editor h1, .result-head h2 { margin: 0; letter-spacing: -.03em; }
.plan-editor > header > p, .result-head p { color: var(--muted); }
.source-read-only, .source-item { display: grid; gap: 5px; padding: 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-soft); color: var(--muted); }
.source-read-only { margin-top: 18px; }
.source-read-only strong, .source-item strong { color: var(--ink); }
.source-read-only pre { max-height: 180px; overflow: auto; margin: 7px 0 0; padding: 10px; border-radius: 8px; background: #fff; font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; }
.plan-title { display: grid; gap: 6px; margin-top: 18px; }
.plan-edit-list { display: grid; gap: 14px; margin-top: 24px; }
.plan-edit-list h2 { margin: 0; font-size: 19px; }
.plan-edit-item { display: grid; gap: 12px; padding: 15px; border: 1px solid var(--line); border-radius: 12px; }
.plan-edit-item .field { display: grid; gap: 6px; }
.plan-edit-item textarea { resize: vertical; }
.result-panel { display: grid; gap: 16px; }
.result-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.result-head h2 { font-size: 21px; }
.result-head p { margin: 6px 0 0; max-width: 650px; }
.result-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; padding: 5px; border-radius: 10px; background: var(--surface-soft); }
.result-tabs button { min-height: 44px; border: 0; border-radius: 7px; color: var(--muted); background: transparent; font-weight: 750; }
.result-tabs button[aria-selected="true"] { color: var(--blue-dark); background: #fff; box-shadow: 0 1px 2px #102a3d1a; }
.result-body { min-width: 0; }
.result-text, .result-txt { overflow: auto; margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); font: 13px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.result-txt { color: #e5edf5; background: #15212b; }
.result-list, .result-calendar { display: grid; gap: 8px; }
.result-calendar section { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.result-calendar h3 { margin: 0; padding: 10px 12px; font-size: 14px; background: var(--surface-soft); }
.result-item { display: flex; width: 100%; min-height: 52px; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); background: var(--surface); text-align: left; }
.result-item:last-child { border-bottom: 0; }
.result-item > span:first-child { margin-top: 2px; color: var(--blue-dark); font-size: 18px; }
.result-item strong, .result-item small { display: block; }
.result-item small { margin-top: 3px; color: var(--muted); }
.result-occurrence { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.result-occurrence .result-item { border-bottom: 0; }
.result-occurrence.static > .result-item { cursor: default; }
.result-occurrence-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px 40px; }
.result-occurrence-actions .button { min-height: 40px; }
.result-occurrence-facts { display: grid; gap: 5px; margin: 0; padding: 0 12px 10px 40px; }
.result-occurrence-facts > div { min-width: 0; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; font-size: 12px; }
.result-occurrence-facts dt { color: var(--muted); }
.result-occurrence-facts dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
.result-occurrence-subchecks { margin: 0; padding: 0 12px 10px 58px; color: var(--muted); font-size: 12px; }
.result-horizon { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid #bdded8; border-radius: 8px; color: #356b67; background: var(--teal-soft); font-size: 12px; }
.result-horizon span { min-width: 0; }
.result-horizon .button { flex: none; min-height: 40px; border-color: #8fb8b2; color: var(--blue-dark); }
.occurrence-dialog-summary { display: grid; gap: 3px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); }
.occurrence-dialog-summary span { color: var(--muted); font-size: 12px; }

.authoring-shell { display: grid; gap: 24px; }
.authoring-head { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
.authoring-head h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.05em; line-height: 1.12; }
.authoring-head p { max-width: 670px; margin: 9px 0 0; color: var(--muted); }
.authoring-steps { display: flex; gap: 7px; }
.authoring-step { padding: 6px 10px; border-radius: 999px; color: #708095; background: #e9eef5; font-size: 12px; font-weight: 750; }
.authoring-step.active { color: var(--blue-dark); background: var(--blue-soft); }
.authoring-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(310px, .9fr); gap: 18px; align-items: start; }
.editor-panel, .preview-panel { border: 1px solid var(--line); border-radius: 17px; background: var(--surface); box-shadow: 0 8px 24px rgba(31, 47, 72, .04); }
.panel-head { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 17px; border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 0; font-size: 15px; }
.panel-head span { color: var(--muted); font-size: 12px; }
.template-picker { padding: 14px 16px 3px; }
.template-picker label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 12px; font-weight: 750; }
.template-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.template-grid button { min-height: 33px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: #526076; font-size: 12px; font-weight: 700; }
.template-grid button:hover { border-color: var(--blue); color: var(--blue-dark); }
.flow-editor { display: block; width: calc(100% - 32px); min-height: 430px; resize: vertical; margin: 14px 16px 16px; padding: 17px; border: 1px solid var(--line-strong); border-radius: 12px; background: #fbfcfe; font: 14px/1.75 ui-monospace, SFMono-Regular, Consolas, monospace; }
.flow-editor:focus { border-color: var(--blue); background: #fff; }
.preview-body { min-height: 300px; padding: 17px; }
.preview-title { margin: 0 0 14px; font-size: 21px; letter-spacing: -.035em; }
.preview-step + .preview-step { margin-top: 17px; }
.preview-step h3 { margin: 0 0 7px; color: #526076; font-size: 12px; letter-spacing: .02em; }
.preview-item { padding: 8px 0 8px 16px; border-left: 2px solid #dbe5f4; }
.preview-item strong { display: block; font-size: 14px; }
.preview-item span { color: var(--muted); font-size: 11px; }
.issue-list { margin: 12px 0 0; padding: 12px 14px 12px 32px; border-radius: 11px; color: #8c3c42; background: #fff0f1; font-size: 13px; }
.ignored-note { margin-top: 12px; color: var(--muted); font-size: 12px; }
.save-panel { display: grid; gap: 14px; margin-top: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.field { display: grid; gap: 7px; }
.field > span { color: #556379; font-size: 12px; font-weight: 760; }
.field input, .field select { width: 100%; min-height: 42px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; }
.confirm-source { display: grid; grid-template-columns: 20px 1fr; gap: 9px; align-items: start; padding: 12px; border-radius: 11px; background: var(--surface-soft); font-size: 13px; }
.confirm-source input { width: 18px; height: 18px; margin: 1px 0 0; }
.authoring-actions { display: flex; justify-content: space-between; gap: 8px; }

.receipt { max-width: 680px; margin: 6vh auto 0; padding: 35px; border: 1px solid #b9ddd6; border-radius: 20px; background: #fff; box-shadow: var(--shadow); text-align: center; }
.receipt-mark { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 50%; color: #fff; background: var(--success); font-size: 26px; }
.receipt h1 { margin: 0; font-size: 29px; letter-spacing: -.04em; }
.receipt p { margin: 9px auto 0; color: var(--muted); }
.receipt-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; overflow: hidden; margin: 24px 0; border: 1px solid var(--line); border-radius: 13px; background: var(--line); text-align: left; }
.receipt-info div { padding: 12px; background: #f9fbfd; }
.receipt-info span { display: block; color: var(--muted); font-size: 11px; }
.receipt-info strong { display: block; overflow: hidden; margin-top: 3px; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.receipt-actions { display: flex; justify-content: center; gap: 9px; }

dialog { width: min(92vw, 520px); max-height: min(82vh, 720px); padding: 0; border: 1px solid var(--line); border-radius: 18px; color: var(--ink); background: #fff; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(20, 30, 47, .42); backdrop-filter: blur(2px); }
.dialog-head { min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 18px; }
#dialog-body { overflow: auto; max-height: calc(82vh - 62px); padding: 18px; }
.dialog-form { display: grid; gap: 15px; }

  function resultLinkText(values, fallback) {
    const links = Array.isArray(values) ? values.filter(Boolean) : [];
    if (links.length) return links.join(', ');
    return fallback || '';
  }

  function serializeCompleteResultTxt(title, rows, sourceOnlyText) {
    const safeTitle = String(title || '').trim() || '제목 없는 Flow';
    const lines = [safeTitle, '='.repeat(Math.max(3, Array.from(safeTitle).length)), ''];
    let currentStepKey = '';
    let itemNumber = 0;
    rows.forEach(row => {
      const stepTitle = String(row.sectionTitle || '할 일').trim() || '할 일';
      const stepKey = row.stepId || stepTitle;
      if (stepKey !== currentStepKey) {
        if (currentStepKey && lines[lines.length - 1] !== '') lines.push('');
        lines.push('[' + stepTitle + ']');
        currentStepKey = stepKey;
        itemNumber = 0;
      }
      itemNumber += 1;
      const occurrenceLabel = row.occurrenceIndex === null || row.occurrenceIndex === undefined ? '' : ' · ' + row.occurrenceIndex + '회차';
      lines.push(itemNumber + '. ' + (row.completed ? '☑' : '☐') + ' ' + row.title + occurrenceLabel);
      const properties = row.sourceProperties || {};
      pushTxtField(lines, '설명', properties['설명'] || properties['상세'] || '');
      pushTxtField(lines, '메모', row.memo || properties['메모'] || '');
      pushTxtField(lines, '완료 기준', properties['완료 기준'] || '');
      pushTxtField(lines, '날짜', row.executionDate || '');
      pushTxtField(lines, '시간', row.time || '');
      pushTxtField(lines, '시간대', properties['시간대'] || '');
      pushTxtField(lines, '장소', properties['장소'] || '');
      const duration = properties['소요 시간'];
      pushTxtField(lines, '소요 시간', duration && /^\d+$/.test(duration) ? duration + '분' : duration || '');
      pushTxtField(lines, '반복', row.recurrenceSummary || properties['반복'] || '');
      pushTxtField(lines, '실행 조건', properties['실행 조건'] || properties['조건'] || '');
      if (Array.isArray(row.subchecks) && row.subchecks.length) {
        lines.push('   체크리스트:');
        row.subchecks.forEach(subcheck => lines.push('     ' + (subcheck.sourceChecked ? '☑' : '☐') + ' ' + subcheck.title));
      }
      pushTxtField(lines, '자료', resultLinkText(row.resources, properties['자료'] || properties['링크'] || ''));
      pushTxtField(lines, '출처', resultLinkText(row.sources, properties['출처'] || ''));
      pushTxtField(lines, '주의', properties['주의'] || '');
      lines.push('');
    });
    const memoLines = (Array.isArray(sourceOnlyText) ? sourceOnlyText : [])
      .map(value => String(value).trim())
      .filter(Boolean);
    if (memoLines.length) {
      if (lines[lines.length - 1] !== '') lines.push('');
      lines.push('[원문 메모]');
      memoLines.forEach(value => lines.push('- ' + value));
      lines.push('');
    }
    return normalizeResultTxt(lines.join('\n'));
  }

  function resultMonthCells(month, selectedDate, items) {
    const parts = month.split('-').map(Number);
    const leading = new Date(Date.UTC(parts[0], parts[1] - 1, 1)).getUTCDay();
    const days = new Date(Date.UTC(parts[0], parts[1], 0)).getUTCDate();
    const byDate = new Map();
    items.forEach(item => {
      if (!item.executionDate || item.timelinePolicy === 'excluded') return;
      const rows = byDate.get(item.executionDate) || [];
      rows.push(item);
      byDate.set(item.executionDate, rows);
    });
    return Array.from({ length: 42 }, (_, index) => {
      const day = index - leading + 1;
      if (day < 1 || day > days) return {
        key: month + ':empty:' + index,
        inMonth: false,
        selected: false,
        itemRefs: [],
        rowIds: [],
        occurrenceIds: [],
        completedCount: 0
      };
      const date = month + '-' + String(day).padStart(2, '0');
      const rows = (byDate.get(date) || []).slice().sort(compareResultContextOrder);
      return {
        key: date,
        date,
        day,
        inMonth: true,
        selected: date === selectedDate,
        itemRefs: rows.map(item => item.ref),
        rowIds: rows.map(item => item.rowId),
        occurrenceIds: rows.map(item => item.occurrenceId).filter(Boolean),
        completedCount: rows.filter(item => item.completed).length
      };
    });
  }

  function buildResultCalendar(items, itemRefs, baseDate, selectedDate) {
    const month = baseDate.slice(0, 7);
    const cells = resultMonthCells(month, selectedDate, items);
    const visibleItems = items.filter(item => item.timelinePolicy !== 'excluded');
    const selectedItems = visibleItems
      .filter(item => item.executionDate === selectedDate)
      .sort(compareResultContextOrder);
    const undatedItems = visibleItems
      .filter(item => !item.executionDate)
      .sort(compareResultContextOrder);
    const calendar = {
      itemRefs: itemRefs.slice(),
      month,
      baseDate,
      selectedDate,
      cells,
      selectedItemRefs: selectedItems.map(item => item.ref),
      selectedRowIds: selectedItems.map(item => item.rowId),
      selectedOccurrenceIds: selectedItems.map(item => item.occurrenceId).filter(Boolean),
      selectedItems,
      undatedItemRefs: undatedItems.map(item => item.ref),
      undatedRowIds: undatedItems.map(item => item.rowId),
      undatedOccurrenceIds: undatedItems.map(item => item.occurrenceId).filter(Boolean),
      undatedItems,
      datePolicy: 'effective-date-execution-first',
      weekStartsOn: 'sunday',
      weekCount: 6,
      monthItemRefs: cells.reduce((refs, cell) => refs.concat(cell.itemRefs), []),
      monthRowIds: cells.reduce((refs, cell) => refs.concat(cell.rowIds), []),
      monthOccurrenceIds: cells.reduce((refs, cell) => refs.concat(cell.occurrenceIds), [])
    };
    visibleItems.slice().sort(compareResultContextOrder).forEach(item => {
      const key = item.executionDate || 'undated';
      if (!calendar[key]) calendar[key] = [];
      calendar[key].push(item.ref);
    });
    return calendar;
  }

  function resultFilenameSegment(value, fallback) {
    const normalized = String(value || '')
      .normalize('NFKC')
      .replace(/[\u0000-\u001f<>:"/\\|?*\u007f]/g, ' ')
      .trim()
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^[-. ]+/g, '')
      .replace(/[. ]+$/g, '')
      .slice(0, 60);
    return normalized || fallback;
  }

  function quoteCsvValue(value) {
    return '"' + String(value === null || value === undefined ? '' : value).replace(/"/g, '""') + '"';
  }

  function buildResultDownloads(title, savedCopyId, itemRefs, txt, sheetRows, manifest) {
    const stem = 'flow-' + resultFilenameSegment(title, 'result') + '-' + resultFilenameSegment(savedCopyId, 'copy');
    const normalizedTxt = normalizeResultTxt(txt);
    const csvRows = [
      RESULT_SHEET_COLUMNS.map(column => quoteCsvValue(column.label)).join(','),
      ...sheetRows.map(row => RESULT_SHEET_COLUMNS.map(column => quoteCsvValue(
        column.key === 'status' ? row.statusCode : row[column.key]
      )).join(','))
    ];
    return {
      version: RESULT_DOWNLOAD_CONTRACT_VERSION,
      itemRefs: itemRefs.slice(),
      sourceItemRefs: manifest && Array.isArray(manifest.sourceItemRefs) ? manifest.sourceItemRefs.slice() : itemRefs.slice(),
      rowIds: manifest && Array.isArray(manifest.rowIds) ? manifest.rowIds.slice() : itemRefs.slice(),
      occurrenceIds: manifest && Array.isArray(manifest.occurrenceIds) ? manifest.occurrenceIds.slice() : [],
      txt: {
        filename: stem + '.txt',
        mediaType: 'text/plain;charset=utf-8',
        encoding: 'utf-8',
        bom: false,
        lineEndings: 'lf',
        finalNewline: 'single',
        payload: normalizedTxt
      },
      csv: {
        filename: stem + '.csv',
        mediaType: 'text/csv;charset=utf-8',
        encoding: 'utf-8',
        bom: true,
        lineEndings: 'crlf',
        finalNewline: 'single',
        payload: '\uFEFF' + csvRows.join('\r\n') + '\r\n',
        columns: RESULT_SHEET_COLUMNS.map(column => column.key),
        delimiter: ',',
        escaping: 'rfc4180-double-quote-all-fields'
      },
      sourceRawTextIncluded: false,
      sourceMutationCount: 0
    };
  }

  function buildUnifiedResultProjection(config) {
    const items = [];
    const recurrenceManifests = [];
    const projectionFailures = [];
    config.sourceItems.forEach(base => {
      const result = resultOccurrenceRows(config.state, base, config.options);
      if (!result.ok) {
        projectionFailures.push({ sourceItemRef: base.sourceItemRef, reason: result.reason });
        return;
      }
      recurrenceManifests.push.apply(recurrenceManifests, result.manifests);
      result.rows.forEach(row => {
        const planOrder = items.length;
        const rank = resultContextRank(config.state, { id: base.id, date: row.executionDate }, planOrder);
        items.push(Object.assign({}, row, {
          planOrder,
          sourcePlanOrder: base.planOrder,
          contextOrder: rank.order,
          contextKey: rank.key,
          manualContextOrder: rank.manual
        }));
      });
    });
    if (projectionFailures.length && config.failClosed) return null;
    const sourceItemRefs = config.sourceItems.map(item => item.sourceItemRef);
    const itemRefs = items.map(item => item.rowId);
    const rowIds = itemRefs.slice();
    const occurrenceIds = items.map(item => item.occurrenceId).filter(Boolean);
    const occurrenceManifest = {
      version: OCCURRENCE_CONTRACT_VERSION,
      sourceItemRefs: sourceItemRefs.slice(),
      itemRefs: itemRefs.slice(),
      rowIds: rowIds.slice(),
      occurrenceIds: occurrenceIds.slice(),
      rows: items.map(item => ({
        rowId: item.rowId,
        occurrenceId: item.occurrenceId,
        seriesId: item.seriesId,
        sourceItemRef: item.sourceItemRef,
        originalDate: item.originalDate,
        occurrenceIndex: item.occurrenceIndex
      })),
      recurrenceManifests,
      hasMore: recurrenceManifests.some(manifest => manifest.hasMore),
      finitePageSize: FINITE_RECURRENCE_PAGE_SIZE,
      openEndedWindowWeeks: OPEN_ENDED_RECURRENCE_WEEKS
    };
    const baseDate = config.options && isDate(config.options.baseDate) ? config.options.baseDate : TODAY;
    const selectedDate = config.options && isDate(config.options.selectedDate) ? config.options.selectedDate : baseDate;
    const calendar = buildResultCalendar(items, itemRefs, baseDate, selectedDate);
    const txt = serializeCompleteResultTxt(config.title, items, config.sourceOnlyText);
    const sheet = items.map(item => ({
      itemRef: item.rowId,
      sourceItemRef: item.sourceItemRef,
      rowId: item.rowId,
      occurrenceId: item.occurrenceId,
      occurrenceIndex: item.occurrenceIndex,
      originalDate: item.originalDate,
      originalOccurrenceDate: item.originalDate,
      order: item.planOrder + 1,
      status: item.completed ? '완료' : '진행 중',
      statusCode: item.completed ? 'completed' : 'open',
      sectionTitle: item.sectionTitle,
      title: item.title,
      memo: item.memo || null,
      planDate: item.date,
      effectiveDate: item.executionDate,
      executionDate: item.executionDate,
      time: item.time || null,
      relativeDate: item.sourceProperties['상대 날짜'] || null,
      sourceDate: item.sourceProperties['날짜'] || item.sourceDate || null,
      timeZone: item.sourceProperties['시간대'] || null,
      place: item.sourceProperties['장소'] || null,
      resourceUrl: resultLinkText(item.resources, item.sourceProperties['자료'] || null) || null,
      recurrence: item.sourceProperties['반복'] || null,
      recurrenceEnd: item.sourceProperties['반복 종료'] || null,
      completionCriteria: item.sourceProperties['완료 기준'] || null,
      completedAt: item.completedAt,
      planOrder: item.planOrder,
      sourceLine: item.sourceLine
    }));
    const downloads = buildResultDownloads(config.title, config.savedCopyId, itemRefs, txt, sheet, occurrenceManifest);
    const slotManifest = { sourceItemRefs, itemRefs, rowIds, occurrenceIds };
    return Object.assign({
      contractVersion: RESULT_PROJECTION_VERSION,
      occurrenceContractVersion: OCCURRENCE_CONTRACT_VERSION,
      flowRef: config.flowRef,
      title: config.title,
      sourceItemRefs,
      itemRefs,
      rowIds,
      occurrenceIds,
      occurrenceManifest,
      recurrenceManifests,
      items,
      workingSource: config.workingSource,
      textLines: config.textLines,
      todo: itemRefs.slice(),
      calendar,
      sheet,
      txt,
      downloads,
      slots: {
        txt: Object.assign({ kind: 'copy-only', value: txt, download: downloads.txt }, slotManifest),
        todo: Object.assign({ kind: config.preview ? 'preview-projection' : 'interactive-projection' }, slotManifest),
        calendar: Object.assign({ kind: config.preview ? 'preview-projection' : 'interactive-projection' }, slotManifest),
        sheet: Object.assign({ kind: 'read-only-projection', rows: sheet, download: downloads.csv }, slotManifest)
      },
      projectionFailures
    }, config.extra || {});
  }

  /* A read-only projection: writes happen only through explicit occurrence transitions. */
  function resultProjection(state, flowId, options) {
    const flow = state && state.flows && state.flows.find(entry => entry.id === flowId);
    if (!flow || isTrashedFlow(state, flowId)) return null;
    const byId = new Map(state.tasks.map(task => [task.id, task]));
    const sourceItems = [];
    const lines = ['# ' + flow.title];
    flow.steps.forEach((step, stepIndex) => {
      lines.push('## ' + step.title);
      step.itemIds.forEach(id => {
        const task = byId.get(id);
        if (!task) return;
        const planDate = taskPlanDate(task) || null;
        const sourceItemRef = sourceItemRefForTask(flow, task);
        sourceItems.push({
          id: task.id,
          sourceItemRef,
          title: task.title,
          memo: task.memo || '',
          sectionTitle: step.title,
          stepId: step.id || 'step-' + (stepIndex + 1),
          planDate,
          executionDate: task.date || null,
          sourceDate: task.sourceDate || null,
          sourceLine: task.sourceLine || null,
          sourceProperties: clone(task.sourceProperties || {}),
          subchecks: clone(task.sourceSubchecks || task.subchecks || []),
          resources: clone(task.sourceResources || task.resources || []),
          sources: clone(task.sourceSources || task.sources || []),
          time: task.time || '',
          completed: task.done,
          completedAt: task.completedAt || null,
          planOrder: sourceItems.length,
          timelinePolicy: task.timelinePolicy === 'excluded' || task.timelinePolicy === 'included' ? task.timelinePolicy : 'auto'
        });
        lines.push('- [' + (task.done ? 'x' : ' ') + '] ' + task.title);
        lines.push('  - 계획 날짜: ' + (planDate || '미정'));
        if (task.date !== planDate) lines.push('  - 실행 날짜: ' + (task.date || '미정'));
        if (task.memo) lines.push('  - 메모: ' + task.memo);
      });
    });
    const parsedRaw = flow.rawText === null ? null : parseSource(flow.rawText);
    return buildUnifiedResultProjection({
      state,
      flowRef: flow.ref,
      title: flow.title,
      savedCopyId: flow.savedCopyId,
      sourceItems,
      options: options || {},
      sourceOnlyText: parsedRaw ? parsedRaw.sourceOnlyText : [],
      workingSource: {
        kind: flow.rawText === null ? 'projected-source' : 'preserved-raw-source',
        editable: false,
        rawText: flow.rawText === null ? lines.join('\n') : flow.rawText
      },
      textLines: lines,
      preview: false,
      failClosed: true
    });
  }

  function authoringResultProjection(rawText, options) {
    const parsed = parseSource(rawText);
    const previewSavedCopyId = 'poc-preview-' + parsed.sourceFingerprint;
    const previewSourceFlowId = 'authoring-preview-' + parsed.sourceFingerprint;
    const lines = parsed.title ? ['# ' + parsed.title] : ['# 제목 없음'];
    const sourceItems = [];
    parsed.steps.forEach((step, stepIndex) => {
      if (!step.items.length) return;
      lines.push('## ' + step.title);
      step.items.forEach(item => {
        const sourceItemRef = 'flow-item:' + previewSavedCopyId + ':' + previewSourceFlowId + ':item-' + (sourceItems.length + 1);
        sourceItems.push({
          id: sourceItemRef,
          sourceItemRef,
          title: item.title,
          memo: '',
          sectionTitle: step.title,
          stepId: 'step-' + (stepIndex + 1),
          planDate: item.date || null,
          executionDate: item.date || null,
          sourceDate: item.properties['날짜'] || null,
          sourceLine: item.sourceLine,
          sourceProperties: clone(item.properties),
          properties: clone(item.properties),
          subchecks: clone(item.subchecks || []),
          resources: clone(item.resources || []),
          sources: clone(item.sources || []),
          time: item.properties['시간'] || '',
          completed: item.checkedInSource,
          completedAt: null,
          planOrder: sourceItems.length,
          timelinePolicy: 'auto'
        });
        lines.push('- [' + (item.checkedInSource ? 'x' : ' ') + '] ' + item.title);
        lines.push('  - 계획 날짜: ' + (item.date || '미정'));
      });
    });
    return buildUnifiedResultProjection({
      state: { orders: {}, occurrenceOverrides: {} },
      flowRef: 'saved-flow:' + previewSavedCopyId + ':' + previewSourceFlowId,
      title: parsed.title || '제목 없음',
      savedCopyId: previewSavedCopyId,
      sourceItems,
      options: options || {},
      sourceOnlyText: parsed.sourceOnlyText,
      workingSource: { kind: 'working-source', editable: true, rawText: parsed.rawText },
      textLines: lines,
      preview: true,
      failClosed: false,
      extra: {
        sourceFingerprint: parsed.sourceFingerprint,
        issues: parsed.issues,
        ignoredLineCount: parsed.ignoredLineCount
      }
    });
  }

  function authoringPropertyByKey(key) {
    return AUTHORING_PROPERTY_CATALOG.find(entry => entry.key === key) || null;
  }

  function protectedAuthoringLines(rawText) {
    const protectedLines = new Set();
    let fence = null;
    let inHtmlComment = false;
    splitLogicalSourceLines(rawText).forEach(line => {
      const match = /^ {0,3}(`{3,}|~{3,})/.exec(line.rawLine);
      if (fence) {
        protectedLines.add(line.line);
        if (match && match[1][0] === fence.marker && match[1].length >= fence.length) fence = null;
        return;
      }
      if (inHtmlComment) {
        protectedLines.add(line.line);
        if (line.rawLine.includes('-->')) inHtmlComment = false;
        return;
      }
      if (match) {
        fence = { marker: match[1][0], length: match[1].length };
        protectedLines.add(line.line);
        return;
      }
      if (line.rawLine.includes('<!--')) {
        protectedLines.add(line.line);
        if (!line.rawLine.slice(line.rawLine.indexOf('<!--') + 4).includes('-->')) inHtmlComment = true;
      }
    });
    return protectedLines;
  }

  function authoringItemSpan(rawText, itemSourceLine) {
    const lines = splitLogicalSourceLines(rawText);
    const protectedLines = protectedAuthoringLines(rawText);
    const index = lines.findIndex(line => line.line === itemSourceLine);
    if (index < 0 || protectedLines.has(itemSourceLine) || !/^- \[[ xX]\]\s+\S/.test(lines[index].rawLine)) return null;
    let end = index + 1;
    while (end < lines.length && !/^(?:#{1,2}(?:\s|$)|- \[[ xX]\](?:\s|$)|-[ \t]*\[[ \t]*\][ \t]+\S)/.test(lines[end].rawLine)) end += 1;
    return {
      lines: lines.slice(index, end),
      insertOffset: end < lines.length ? lines[end].startOffset : rawText.length,
      lineEnding: rawText.includes('\r\n') ? '\r\n' : rawText.includes('\r') ? '\r' : '\n',
      trailingNewline: /[\r\n]$/.test(rawText)
    };
  }

  function authoringPropertyMatches(rawText, itemSourceLine, entry) {
    const span = authoringItemSpan(rawText, itemSourceLine);
    if (!span) return null;
    const protectedLines = protectedAuthoringLines(rawText);
    const matches = span.lines.slice(1).flatMap(line => {
      if (protectedLines.has(line.line)) return [];
      const match = /^(?: {2,}|\t+)- ([^:：\r\n]{1,32})[:：]([ \t]*)(.*)$/.exec(line.rawLine);
      if (!match || match[1].trim().replace(/[\s_-]+/g, '') !== entry.sourceLabel.replace(/[\s_-]+/g, '')) return [];
      const rawValue = match[3];
      const start = line.startOffset + match[0].length - rawValue.length;
      return [{ line, rawValue: rawValue.trimEnd(), start, end: start + rawValue.trimEnd().length }];
    });
    return { span, matches };
  }

  function authoringChildActionMatches(rawText, itemSourceLine) {
    const span = authoringItemSpan(rawText, itemSourceLine);
    if (!span) return null;
    const protectedLines = protectedAuthoringLines(rawText);
    const matches = span.lines.slice(1).flatMap(line => {
      if (protectedLines.has(line.line)) return [];
      const match = /^ {2}- \[([ xX])\]([ \t]*)(.*)$/.exec(line.rawLine);
      if (!match || !match[3].trim()) return [];
      const rawValue = match[3];
      const start = line.startOffset + match[0].length - rawValue.length;
      return [{ line, rawValue: rawValue.trimEnd(), start, end: start + rawValue.trimEnd().length, sourceChecked: match[1].toLowerCase() === 'x' }];
    });
    return { span, matches };
  }

  function listAuthoringPropertyInstances(input) {
    const rawText = typeof input.rawText === 'string' ? input.rawText : '';
    if (input.expectedSourceFingerprint && fingerprint(rawText) !== input.expectedSourceFingerprint) return [];
    const entry = authoringPropertyByKey(input.key);
    if (!entry) return [];
    const found = entry.sourceKind === 'child-action'
      ? authoringChildActionMatches(rawText, input.itemSourceLine)
      : authoringPropertyMatches(rawText, input.itemSourceLine, entry);
    if (!found) return [];
    return found.matches.map(match => ({
      key: entry.key,
      sourceLine: match.line.line,
      rawValue: match.rawValue,
      sourceChecked: Boolean(match.sourceChecked),
      selection: { start: match.start, end: match.end }
    }));
  }

  function normalizeAuthoringPropertyValue(entry, value) {
    const normalized = String(value || '').trim();
    if (!normalized || /[\r\n]/.test(normalized)) return null;
    if (entry.valueKind === 'date') return isDate(normalized) ? normalized : null;
    if (entry.valueKind === 'time') return /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(normalized) ? normalized : null;
    if (entry.valueKind === 'time-zone') {
      try {
        new Intl.DateTimeFormat('ko-KR', { timeZone: normalized }).format();
        return normalized;
      } catch (error) {
        return null;
      }
    }
    if (entry.valueKind === 'relative-date') {
      if (/^D(?:-Day|[+-]?0)$/i.test(normalized.replace(/\s+/g, ''))) return 'D-Day';
      const relative = normalized.match(/^D\s*([+-])\s*(\d+)$/i);
      return relative ? 'D' + relative[1] + String(Number(relative[2])) : null;
    }
    if (entry.valueKind === 'duration') {
      const match = /^([1-9]\d*)\s*(분|시간)$/.exec(normalized);
      return match && Number.isSafeInteger(Number(match[1])) ? String(Number(match[1])) + match[2] : null;
    }
    if (entry.valueKind === 'recurrence-end') {
      return isDate(normalized) || /^([1-9]\d*)\s*회$/.test(normalized)
        ? normalized.replace(/\s+/g, '')
        : null;
    }
    if (entry.valueKind === 'url') {
      const markdown = /^\[([^\]\r\n]+)\]\((https?:\/\/[^\s)]+)\)$/i.exec(normalized);
      const candidate = markdown ? markdown[2] : normalized;
      try { const parsed = new URL(candidate); return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? normalized : null; }
      catch (error) { return null; }
    }
    return normalized;
  }
