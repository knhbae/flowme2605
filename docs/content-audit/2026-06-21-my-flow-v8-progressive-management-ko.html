<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>내 Flow</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --soft: #f8fafc;
      --line: #dbe4ef;
      --line-strong: #b8c7da;
      --text: #101827;
      --muted: #596779;
      --faint: #8290a2;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #0f766e;
      --green-soft: #ecfdf5;
      --amber: #b45309;
      --amber-soft: #fffbeb;
      --radius: 18px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(760px, calc(100% - 28px)); margin: 0 auto; padding: 24px 0 54px; }
    .top, .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .top { padding: 20px; }
    .top-row { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    h1, h2, h3, p { margin-top: 0; letter-spacing: 0; }
    h1 { margin-bottom: 4px; font-size: clamp(28px, 5vw, 38px); line-height: 1.08; }
    h2 { margin-bottom: 2px; font-size: 20px; }
    h3 { margin-bottom: 4px; font-size: 17px; }
    p { margin-bottom: 0; color: var(--muted); }
    .eyebrow { margin: 0 0 4px; color: var(--blue); font-size: 12px; font-weight: 900; }
    .stat {
      min-width: 108px;
      border-radius: 14px;
      background: var(--soft);
      padding: 12px;
      text-align: right;
    }
    .stat b, .stat span { display: block; }
    .stat b { font-size: 20px; }
    .stat span { color: var(--muted); font-size: 12px; font-weight: 750; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin: 12px 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      padding: 6px;
    }
    .tabs button {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-weight: 850;
    }
    .tabs button.active { background: var(--blue-soft); color: var(--blue); box-shadow: inset 0 0 0 1px #bfdbfe; }
    .panel { padding: 16px; }
    .view { display: none; }
    .view.active { display: block; }
    .head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .count {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border-radius: 999px;
      background: var(--soft);
      padding: 4px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .list { display: grid; gap: 10px; padding-top: 12px; }
    .step-block { display: grid; gap: 8px; }
    .row, .subrow {
      width: 100%;
      min-height: 68px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--card);
      text-align: left;
      padding: 13px;
    }
    .row.action-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }
    .row.flow-card { border-left: 4px solid var(--blue); background: #fff; }
    .row.map-card { border-left: 4px solid var(--amber); background: #fff; }
    .row.step-row { border-left: 4px solid #bfdbfe; background: #fff; }
    .row.step-row.nested { margin-left: 10px; width: calc(100% - 10px); background: #fbfdff; }
    .row.active, .subrow.active { border-color: #93c5fd; background: var(--blue-soft); }
    .row-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      border: 0;
      background: transparent;
      padding: 0;
      text-align: left;
    }
    .row-main b, .subrow b { display: block; color: var(--text); font-size: 15px; line-height: 1.35; }
    .row-main span, .subrow span { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .row-main .row-content { display: block; margin-top: 0; color: inherit; }
    .row-main .row-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .row-main .row-meta span,
    .row-main .row-meta strong {
      display: inline;
      margin: 0;
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: 1.25;
    }
    .row-main .row-meta strong {
      color: var(--text);
      font-weight: 900;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      max-width: 100%;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      padding: 3px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .chip.blue { border-color: #bfdbfe; background: var(--blue-soft); color: var(--blue); }
    .chip.green { border-color: #99f6e4; background: var(--green-soft); color: var(--green); }
    .chip.amber { border-color: #fed7aa; background: var(--amber-soft); color: var(--amber); }
    .quick {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--card);
      color: transparent;
      font-weight: 900;
    }
    .quick.done { border-color: #99f6e4; background: var(--green); color: #fff; }
    .mini-progress {
      display: block;
      height: 5px;
      width: min(148px, 100%);
      margin-top: 7px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .mini-progress i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
    }
    .progress {
      height: 7px;
      margin-top: 10px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .progress span { display: block; height: 100%; border-radius: 999px; background: var(--blue); }
    .expand {
      display: none;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .row.expanded .expand { display: grid; }
    .subrow {
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      background: #fbfdff;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      margin-top: 12px;
    }
    .weekday {
      min-height: 28px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }
    .day {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--muted);
      padding: 7px 6px;
      text-align: left;
      font-weight: 850;
    }
    .day.blank {
      border-color: transparent;
      background: transparent;
      pointer-events: none;
    }
    .day.has { color: var(--text); }
    .day.selected { border-color: #93c5fd; background: var(--blue-soft); color: var(--blue); }
    .day.today { box-shadow: inset 0 0 0 1px #bfdbfe; }
    .day span { display: block; color: var(--faint); font-size: 11px; font-weight: 850; }
    .day.has span { color: var(--blue); }
    .calendar-note {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--soft);
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .date-group {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .date-group + .date-group { margin-top: 12px; }
    .date-group-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--soft);
      padding: 8px 10px;
      color: var(--muted);
      font-weight: 850;
    }
    .date-group-head b { color: var(--text); font-size: 13px; }
    .date-group-head span { color: var(--muted); font-size: 12px; font-weight: 900; }
    .detail {
      display: none;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfdff;
      padding: 16px;
    }
    .detail.open { display: block; }
    .detail.inline {
      margin-top: 0;
      margin-left: 10px;
      border-left: 4px solid var(--green);
      background: #fff;
    }
    .detail-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .event-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .event-strip span {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      padding: 9px 10px;
    }
    .event-strip b,
    .event-strip em {
      display: block;
      font-style: normal;
      line-height: 1.25;
    }
    .event-strip b { color: var(--muted); font-size: 11px; font-weight: 900; }
    .event-strip em { margin-top: 4px; color: var(--text); font-size: 12px; font-weight: 900; }
    .items { display: grid; gap: 10px; margin-top: 12px; }
    .label { color: var(--muted); font-size: 12px; font-weight: 900; }
    .basis, .item {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--card);
      padding: 12px;
    }
    .basis b, .item b { display: block; color: var(--text); font-size: 14px; }
    .basis span, .item span span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 550; }
    .item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    .item.done { border-color: #99f6e4; background: var(--green-soft); }
    .item input { width: 36px; height: 36px; accent-color: var(--blue); }
    .memo { display: grid; gap: 7px; margin-top: 12px; }
    .memo label { color: var(--text); font-size: 13px; font-weight: 850; }
    textarea {
      width: 100%;
      min-height: 88px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: #fff;
      padding: 10px 12px;
      resize: vertical;
    }
    textarea::placeholder { color: var(--faint); }
    details {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--card);
      padding: 11px;
    }
    summary { min-height: 36px; display: flex; align-items: center; cursor: pointer; font-weight: 850; }
    pre { white-space: pre-wrap; word-break: keep-all; color: var(--muted); font-size: 13px; }
    .crumb {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--soft);
    }
    .crumb button {
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: #fff;
      padding: 5px 10px;
      color: var(--muted);
      font-weight: 850;
    }
    .crumb b { color: var(--text); }
    @media (max-width: 520px) {
      .app { width: min(100% - 20px, 430px); padding-top: 18px; }
      .top, .panel { border-radius: 16px; }
      .top { padding: 16px; }
      .top-row { display: grid; }
      .stat { width: 100%; text-align: left; }
      .head { align-items: flex-start; }
      .tabs { gap: 4px; padding: 5px; }
      .tabs button { min-height: 42px; border-radius: 10px; font-size: 14px; }
      .calendar { gap: 5px; }
      .day { min-height: 54px; padding: 6px 5px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="top-row">
        <div>
          <p class="eyebrow">실행 공간</p>
          <h1>내 Flow</h1>
        </div>
        <aside class="stat" aria-live="polite">
          <b id="todayStat">오늘 6개</b>
          <span id="savedStat">개별 Flow 6개 · 지도 2개</span>
        </aside>
      </div>
    </header>

    <nav class="tabs" aria-label="내 Flow 보기">
      <button type="button" class="active" data-view="today">오늘</button>
      <button type="button" data-view="calendar">일정</button>
      <button type="button" data-view="flows">Flow</button>
      <button type="button" data-view="maps">지도</button>
    </nav>

    <section class="view active panel" id="todayView" aria-labelledby="todayTitle">
      <div class="head">
        <div>
          <p class="eyebrow">오늘</p>
          <h2 id="todayTitle">먼저 할 일</h2>
        </div>
        <span class="count" id="todayCount">6개</span>
      </div>
      <div class="list" id="todayList"></div>
      <article class="detail" id="todayDetail"></article>
    </section>

    <section class="view panel" id="calendarView" aria-labelledby="calendarTitle">
      <div class="head">
        <div>
          <p class="eyebrow">일정</p>
          <h2 id="calendarTitle">2026년 6월</h2>
        </div>
        <span class="count" id="calendarCount">0개</span>
      </div>
      <div class="calendar" id="calendarGrid" aria-label="6월 일정"></div>
      <div class="calendar-note" id="calendarNote"></div>
      <div class="list" id="calendarList"></div>
      <article class="detail" id="calendarDetail"></article>
    </section>

    <section class="view panel" id="flowsView" aria-labelledby="flowsTitle">
      <div class="head">
        <div>
          <p class="eyebrow">개별 Flow</p>
          <h2 id="flowsTitle">저장한 Flow</h2>
        </div>
        <span class="count" id="flowsCount">6개</span>
      </div>
      <div class="list" id="flowList"></div>
      <article class="detail" id="flowDetail"></article>
    </section>

    <section class="view panel" id="mapsView" aria-labelledby="mapsTitle">
      <div class="head">
        <div>
          <p class="eyebrow">Flow 지도</p>
          <h2 id="mapsTitle">지도별 Flow</h2>
        </div>
        <span class="count" id="mapsCount">2개</span>
      </div>
      <div class="list" id="mapList"></div>
      <article class="detail" id="mapDetail"></article>
    </section>
  </main>

      `;
      return `
        <div class="detail-top">
          <div>
            <p class="eyebrow">${map ? `${map.name} · ${flow.name}` : flow.name}</p>
            <h3>${step.title}</h3>
          </div>
        </div>
        <div class="event-strip" aria-label="Step 정보">
          <span><b>일정</b><em>${step.date}</em></span>
          <span><b>저장</b><em>${destinationLabel(flow)}</em></span>
          <span><b>진행</b><em>${progressText(step)}</em></span>
        </div>
        <div class="items">
          <div class="label">${itemLabel}</div>
          ${itemMarkup}
        </div>
        <div class="memo">
          <label for="memo-${step.id}">메모</label>
          <textarea id="memo-${step.id}" data-memo="${step.id}" placeholder="${step.memoHint || '확인한 내용만 짧게 남기세요'}">${state.memos[step.id] || ''}</textarea>
        </div>
      `;
    }
    function toggleStep(stepId) {
      const step = stepById(stepId);
      const next = !isDone(step);
      const items = stepItems(step);
      if (!items.length) state.done[step.id] = next;
      else items.forEach((_, index) => { state.checks[checkKey(step, index)] = next; });
      render();
    }
    function rowStep(step, options = {}) {
      const done = isDone(step);
      const flow = flowById(step.flowId);
      const map = step.mapId ? mapById(step.mapId) : null;
      const p = progress(flow);
      const selected = state.selectedStep === step.id;
      const context = rowContext(step, flow, map);
      const showDateBadge = options.showDateBadge !== false;
      const showMeta = options.showMeta !== false;
      const chipText = done ? '완료' : showDateBadge ? step.date : '';
      const chip = chipText ? `<span class="chip ${done ? 'green' : isToday(step) ? 'blue' : 'amber'}">${chipText}</span>` : '';
      const meta = showMeta ? `<span class="row-meta"><span>${context}</span><strong>${p.done}/${p.total} 완료</strong></span>` : '';
      const inline = selected && options.inline !== false
        ? `<article class="detail inline open">${stepDetailMarkup(step)}</article>`
        : '';
      const ariaText = showMeta ? `${step.title}, ${context}, ${p.done}/${p.total} 완료` : `${step.title}, ${step.date}`;
      return `
        <div class="step-block">
          <article class="row action-row step-row ${options.nested ? 'nested' : ''} ${selected ? 'active' : ''}">
            <button class="row-main" type="button" data-open-step="${step.id}" aria-label="${ariaText}">
              <span class="row-content">
                ${chip}
                <b>${step.title}</b>
                ${meta}
              </span>
            </button>
            <button class="quick ${done ? 'done' : ''}" type="button" data-quick="${step.id}" aria-label="${done ? '완료 취소' : '완료 표시'}">${done ? '✓' : ''}</button>
          </article>
          ${inline}
        </div>
      `;
    }
    function renderDetail(container) {
      const step = state.selectedStep ? stepById(state.selectedStep) : null;
      if (!step) {
        container.className = 'detail';
        container.innerHTML = '';
        return;
      }
      const flow = flowById(step.flowId);
      const map = step.mapId ? mapById(step.mapId) : null;
      const done = isDone(step);
      const items = stepItems(step);
      const itemLabel = itemLabelFor(flow, items);
      const itemMarkup = items.length ? items.map((item, index) => {
        const key = checkKey(step, index);
        const checked = Boolean(state.checks[key]) || step.date === '완료';
        return `
          <label class="item ${checked ? 'done' : ''}">
            <input type="checkbox" data-check="${key}" ${checked ? 'checked' : ''} ${step.date === '완료' ? 'disabled' : ''} />
            <span><b>${item.title}</b><span>${item.detail}</span></span>
          </label>
        `;
      }).join('') : `
        <label class="item ${done ? 'done' : ''}">
          <input type="checkbox" data-step="${step.id}" ${done ? 'checked' : ''} ${step.date === '완료' ? 'disabled' : ''} />
          <span><b>완료로 표시</b><span>${step.completion}</span></span>
        </label>
      `;
      container.className = 'detail open';
      container.innerHTML = `
        <div class="detail-top">
          <div>
            <p class="eyebrow">${map ? `${map.name} · ${flow.name}` : flow.name}</p>
            <h3>${step.title}</h3>
          </div>
        </div>
        <div class="event-strip" aria-label="Step 정보">
          <span><b>일정</b><em>${step.date}</em></span>
          <span><b>저장</b><em>${destinationLabel(flow)}</em></span>
          <span><b>진행</b><em>${progressText(step)}</em></span>
        </div>
        <div class="items">
          <div class="label">${itemLabel}</div>
          ${itemMarkup}
        </div>
        <div class="memo">
          <label for="memo-${step.id}">메모</label>
          <textarea id="memo-${step.id}" data-memo="${step.id}" placeholder="${step.memoHint || '확인한 내용만 짧게 남기세요'}">${state.memos[step.id] || ''}</textarea>
        </div>
      `;
    }
    function renderSummary() {
      const todayCount = todaySteps().length;
      $('todayStat').textContent = `오늘 ${todayCount}개`;
      $('savedStat').textContent = `개별 Flow ${standaloneFlows().length}개 · 지도 ${maps.length}개`;
      $('todayCount').textContent = `${todayCount}개`;
      $('calendarCount').textContent = `${scheduledDateKeys().length}일`;
      $('flowsCount').textContent = `${standaloneFlows().length}개`;
      $('mapsCount').textContent = `${maps.length}개`;
    }
    function renderNav() {
      all('[data-view]').forEach((button) => button.classList.toggle('active', button.dataset.view === state.view));
      all('.view').forEach((view) => view.classList.toggle('active', view.id === `${state.view}View`));
    }
    function renderToday() {
      $('todayList').innerHTML = todaySteps().map((step) => rowStep(step, { compact: false, inline: state.view === 'today', showDateBadge: false })).join('');
      $('todayDetail').className = 'detail';
      $('todayDetail').innerHTML = '';
    }
    function renderCalendar() {
      const counts = scheduledSteps().reduce((acc, step) => {
        const key = dateKey(step);
        acc[key] = (acc[key] || 0) + 1;
        return acc;
      }, {});
      const days = [];
      weekdays.forEach((day) => days.push(`<div class="weekday">${day}</div>`));
      for (let i = 0; i < 1; i += 1) days.push('<button class="day blank" type="button" tabindex="-1" aria-hidden="true"></button>');
      for (let day = 1; day <= 30; day += 1) {
        const key = `2026-06-${String(day).padStart(2, '0')}`;
        const count = counts[key] || 0;
        const selected = state.selectedDate === key;
        const today = key === '2026-06-22';
        days.push(`
          <button class="day ${count ? 'has' : ''} ${selected ? 'selected' : ''} ${today ? 'today' : ''}" type="button" data-date="${key}">
            ${day}
            <span>${count ? `${count}개` : ''}</span>
          </button>
        `);
      }
      $('calendarGrid').innerHTML = days.join('');
      const selected = state.selectedDate ? stepsOnDate(state.selectedDate) : [];
      const selectedMarkup = selected.length > 4
        ? groupedByContext(selected).map((group) => `
          <section class="date-group" aria-label="${group.label}">
            <div class="date-group-head"><b>${group.label}</b><span>${group.steps.length}개</span></div>
            ${group.steps.map((step) => rowStep(step, { compact: false, inline: state.view === 'calendar', showDateBadge: false, showMeta: false })).join('')}
          </section>
        `).join('')
        : selected.map((step) => rowStep(step, { compact: false, inline: state.view === 'calendar', showDateBadge: false })).join('');
      $('calendarNote').textContent = state.selectedDate
        ? `${dateLabel(state.selectedDate)} 일정 ${selected.length}개`
        : '날짜를 누르면 해당 날짜 항목만 보입니다.';
      $('calendarList').innerHTML = state.selectedDate
        ? (selected.length ? selectedMarkup : '<div class="calendar-note">이 날짜에는 저장된 일정 Step이 없습니다.</div>')
        : '';
      $('calendarDetail').className = 'detail';
      $('calendarDetail').innerHTML = '';
    }
    function renderFlows() {
      $('flowList').innerHTML = standaloneFlows().map((flow) => {
        const p = progress(flow);
        const expanded = state.expandedFlow === flow.id;
        const steps = stepsForFlow(flow);
        const next = steps.find((step) => !isDone(step)) || steps[0];
        return `
          <article class="row flow-card ${expanded ? 'expanded active' : ''}">
            <button class="row-main" type="button" data-expand-flow="${flow.id}">
              <span>
                <span class="chip blue">${flow.type}</span>
                <b>${flow.name}</b>
                <span>${p.done}/${p.total}개 완료 · 다음: ${next.title}</span>
              </span>
              <span class="count">${p.total}개</span>
            </button>
            <div class="progress"><span style="width:${p.pct}%"></span></div>
            <div class="expand">
              ${steps.map((step) => rowStep(step, { compact: true, nested: true, inline: state.view === 'flows', showMeta: false })).join('')}
            </div>
          </article>
        `;
      }).join('');
      $('flowDetail').className = 'detail';
      $('flowDetail').innerHTML = '';
    }
    function renderMaps() {
      if (!state.expandedMap) {
        $('mapList').innerHTML = maps.map((map) => {
          const p = mapProgress(map.id);
          return `
            <article class="row map-card">
              <button class="row-main" type="button" data-expand-map="${map.id}">
                <span>
                  <span class="chip amber">${map.kind}</span>
                  <b>${map.name}</b>
                  <span>${p.flows}개 Flow · ${p.done}/${p.total}개 완료</span>
                  <span class="mini-progress" aria-hidden="true"><i style="width:${p.pct}%"></i></span>
                </span>
                <span class="count">${p.flows}개</span>
              </button>
            </article>
          `;
        }).join('');
      } else if (!state.expandedMapFlow) {
        const map = mapById(state.expandedMap);
        const childFlows = flowsForMap(map.id);
        $('mapList').innerHTML = `
          <div class="crumb">
            <button type="button" data-map-back>지도</button>
            <b>${map.name}</b>
          </div>
          ${childFlows.map((flow) => {
            const p = progress(flow);
            const next = flow.steps.find((step) => !isDone({ ...step, flowId: flow.id, mapId: flow.mapId })) || flow.steps[0];
            return `
              <article class="row flow-card">
                <button class="row-main" type="button" data-expand-map-flow="${flow.id}">
                  <span>
                    <span class="chip blue">${flow.type}</span>
                    <b>${flow.name}</b>
                    <span>${p.done}/${p.total}개 완료 · 다음: ${next.title}</span>
                    <span class="mini-progress" aria-hidden="true"><i style="width:${p.pct}%"></i></span>
                  </span>
                  <span class="count">${p.total}개</span>
                </button>
              </article>
            `;
          }).join('')}
        `;
      } else {
        const map = mapById(state.expandedMap);
        const flow = flowById(state.expandedMapFlow);
        const p = progress(flow);
        $('mapList').innerHTML = `
          <div class="crumb">
            <button type="button" data-map-back>지도</button>
            <button type="button" data-map-flow-back>${map.name}</button>
            <b>${flow.name}</b>
          </div>
          <article class="row flow-card active">
            <button class="row-main" type="button" data-map-flow-back>
              <span>
                <span class="chip blue">${flow.type}</span>
                <b>${flow.name}</b>
                <span>${p.done}/${p.total}개 완료</span>
                <span class="mini-progress" aria-hidden="true"><i style="width:${p.pct}%"></i></span>
              </span>
              <span class="count">${p.total}개</span>
            </button>
          </article>
          ${stepsForFlow(flow).map((step) => rowStep(step, { compact: true, nested: true, inline: state.view === 'maps', showMeta: false })).join('')}
        `;
      }
      $('mapDetail').className = 'detail';
      $('mapDetail').innerHTML = '';
    }
    function bind() {
      const bindOnce = (selector, eventName, handler) => {
        all(selector).forEach((element) => {
          if (element.dataset.bound) return;
          element.dataset.bound = 'true';
          element.addEventListener(eventName, handler);
        });
      };
      bindOnce('[data-view]', 'click', (event) => {
        state.view = event.currentTarget.dataset.view;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-date]', 'click', (event) => {
        state.selectedDate = event.currentTarget.dataset.date;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-open-step]', 'click', (event) => {
        const id = event.currentTarget.dataset.openStep;
        state.selectedStep = state.selectedStep === id ? null : id;
        render();
      });
      bindOnce('[data-quick]', 'click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        toggleStep(event.currentTarget.dataset.quick);
      });
      bindOnce('[data-expand-flow]', 'click', (event) => {
        const id = event.currentTarget.dataset.expandFlow;
        state.expandedFlow = state.expandedFlow === id ? null : id;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-expand-map]', 'click', (event) => {
        const id = event.currentTarget.dataset.expandMap;
        state.expandedMap = id;
        state.expandedMapFlow = null;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-expand-map-flow]', 'click', (event) => {
        const id = event.currentTarget.dataset.expandMapFlow;
        state.expandedMapFlow = state.expandedMapFlow === id ? null : id;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-map-back]', 'click', () => {
        state.expandedMap = null;
        state.expandedMapFlow = null;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-map-flow-back]', 'click', () => {
        state.expandedMapFlow = null;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-check]', 'change', (event) => {
        state.checks[event.currentTarget.dataset.check] = event.currentTarget.checked;
        render();
      });
      bindOnce('[data-step]', 'change', (event) => {
        state.done[event.currentTarget.dataset.step] = event.currentTarget.checked;
        render();
      });
      bindOnce('[data-memo]', 'input', (event) => {
        state.memos[event.currentTarget.dataset.memo] = event.currentTarget.value;
      });
    }
    function render() {
      renderSummary();
      renderNav();
      renderToday();
      renderCalendar();
      renderFlows();
      renderMaps();
      bind();
    }
    render();
  </script>
</body>
</html>
