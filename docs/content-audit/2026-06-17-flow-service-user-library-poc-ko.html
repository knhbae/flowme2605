<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlowMe 저장한 Flow</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --paper: #fff;
        --ink: #111827;
        --muted: #607086;
        --line: #d9e2ef;
        --blue: #1f5fbf;
        --green: #0f7a4a;
        --amber: #986400;
        --red: #b42318;
        --soft-blue: #edf4ff;
        --soft-green: #ebf8f0;
        --soft-amber: #fff8e6;
        --soft-red: #fff1ef;
        --shadow: 0 14px 34px rgba(15, 23, 42, .07);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.55; }
      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }
      a { color: var(--blue); text-underline-offset: 3px; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 4px; font-size: clamp(26px, 4vw, 40px); line-height: 1.12; letter-spacing: 0; }
      h2 { margin-bottom: 8px; font-size: 22px; line-height: 1.2; letter-spacing: 0; }
      h3 { margin-bottom: 5px; font-size: 18px; line-height: 1.25; letter-spacing: 0; }
      .app { width: min(1220px, calc(100% - 28px)); margin: 0 auto; padding: 16px 0 64px; }
      .topbar, .hero, .panel, .detail, .card, .task, .row, .calendar-day {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 54px;
        padding: 10px 12px;
        box-shadow: var(--shadow);
      }
      .brand { font-size: 18px; font-weight: 950; text-decoration: none; color: var(--ink); }
      .top-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
      .btn {
        min-height: 38px;
        padding: 8px 12px;
        border: 1px solid var(--blue);
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
        font-weight: 850;
      }
      .btn.secondary { background: #fff; color: var(--blue); }
      .btn.green { border-color: var(--green); background: var(--green); }
      .btn.ghost { border-color: var(--line); background: #fff; color: var(--ink); }
      .hero { margin-top: 12px; padding: 18px; }
      .desc, .meta, .small { color: var(--muted); }
      .small { font-size: 13px; }
      .chips, .tabs, .actions, .stats { display: flex; flex-wrap: wrap; gap: 8px; }
      .chips { margin-top: 10px; }
      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: #334155;
        font-size: 13px;
        font-weight: 850;
      }
      .chip.blue { border-color: #bfdbfe; background: var(--soft-blue); color: var(--blue); }
      .chip.green { border-color: #bde7cb; background: var(--soft-green); color: var(--green); }
      .chip.amber { border-color: #f4d58d; background: var(--soft-amber); color: var(--amber); }
      .chip.red { border-color: #f4b3ad; background: var(--soft-red); color: var(--red); }
      .layout {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 12px;
        margin-top: 12px;
        align-items: start;
      }
      .panel, .detail { padding: 14px; box-shadow: 0 8px 22px rgba(15, 23, 42, .04); }
      .tabs { margin: 10px 0; }
      .tabs button {
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-weight: 850;
      }
      .tabs button.active { border-color: var(--blue); background: var(--soft-blue); color: var(--blue); }
      .flow-list { display: grid; gap: 8px; }
      .flow-card {
        width: 100%;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        text-align: left;
      }
      .flow-card.active { border-color: var(--blue); background: var(--soft-blue); }
      .flow-title { display: block; font-weight: 950; color: var(--ink); }
      .flow-meta { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
      .flow-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; align-items: center; }
      .progress {
        overflow: hidden;
        height: 8px;
        border-radius: 999px;
        background: #e8edf5;
      }
      .progress span { display: block; height: 100%; width: var(--value, 10%); background: var(--blue); }
      .detail-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
      }
      .actions { justify-content: flex-end; }
      .stats { margin-top: 12px; }
      .stat {
        flex: 1 1 150px;
        min-height: 76px;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcff;
      }
      .stat strong { display: block; margin-bottom: 4px; font-size: 20px; }
      .content-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
        gap: 12px;
        margin-top: 12px;
        align-items: start;
      }
      .card { padding: 14px; }
      .artifact-list, .task-list, .rows { display: grid; gap: 8px; }
      .row, .task {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
        padding: 10px;
      }
      .row button {
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        padding: 0;
      }
      .row.active { border-color: var(--blue); background: var(--soft-blue); }
      .row.done .item-title, .task.done .item-title { text-decoration: line-through; color: var(--muted); }
      .item-title { margin: 0; font-weight: 900; }
      input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--blue); }
      textarea, input[type="date"], input[type="text"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fff;
      }
      textarea { min-height: 98px; resize: vertical; }
      .source-box {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      .toast {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #bde7cb;
        border-radius: 8px;
        background: var(--soft-green);
        color: var(--green);
        font-weight: 850;
      }
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
        margin-top: 8px;
      }
      .calendar-day {
        min-height: 44px;
        padding: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .calendar-day.marked { border-color: var(--blue); background: var(--soft-blue); color: var(--blue); font-weight: 900; }
      .calendar-day.today { border-color: var(--green); background: var(--soft-green); color: var(--green); font-weight: 900; }
      @media (max-width: 900px) {
        .app { width: min(100% - 18px, 1220px); padding-top: 10px; }
        .topbar, .detail-head { align-items: stretch; }
        .layout, .content-grid, .detail-head { grid-template-columns: 1fr; }
        .panel { order: 2; }
        .detail { order: 1; }
        .flow-list { display: grid; overflow: visible; padding-bottom: 0; }
        .flow-card { min-width: 0; }
        .actions { justify-content: flex-start; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <a class="brand" href="#">FlowMe</a>
        <div class="top-actions">
          <button class="btn secondary" type="button" id="showToday">오늘 할 일</button>
          <button class="btn secondary" type="button" id="showSaved">보관 자료</button>
          <button class="btn green" type="button" id="openFeedback">피드백 남기기</button>
        </div>
      </header>

      <section class="hero">
        <p class="small" style="font-weight:900;color:var(--blue);margin-bottom:6px">내 Flow</p>
        <h1>저장한 원문을 실행할 수 있게 모아둔 곳</h1>
        <p class="desc">Flow는 글이나 영상을 다시 읽으라는 목록이 아니라, 내 캘린더·체크리스트·표·버킷으로 옮겨진 실행 항목입니다.</p>
        <div class="chips">
          <span class="chip blue">오늘 3개</span>
          <span class="chip green">진행 중 5개</span>
          <span class="chip amber">보관 자료 2개</span>
          <span class="chip red">실사용 데이터 없음</span>
        </div>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>저장한 Flow</h2>
          <p class="desc">오늘 할 일, 예정된 일정, 보관 자료, 반복 루틴으로 나눠 봅니다.</p>
          <nav class="tabs" aria-label="Flow 보기 필터">
            <button class="active" type="button" data-filter="all">전체</button>
            <button type="button" data-filter="today">오늘</button>
            <button type="button" data-filter="upcoming">예정</button>
            <button type="button" data-filter="saved">보관</button>
            <button type="button" data-filter="routine">반복</button>
          </nav>
          <div class="flow-list" id="flowList"></div>
        </aside>

        <section class="detail" id="detail" aria-live="polite"></section>
      </section>
    </main>

          primary: "다음 물주기 후보 확인",
          next: "2026-06-20",
          progress: 50,
          input: "첫 물주기 2026-06-20",
          rows: [["속 흙까지 말랐는지 확인", "겉흙만 보지 않고 속 흙까지 말랐는지 봅니다."], ["화분 아래로 흘러나올 정도로 물주기", "한 번 줄 때는 충분히 주되 너무 자주 주지 않습니다."], ["받침 물 제거", "과습과 뿌리 썩음을 막기 위해 받침 물을 버립니다."], ["겨울에는 간격 늦추기", "여름은 2~3주, 겨울은 4~6주 간격을 기준으로 봅니다."]]
        },
        {
          id: "babycheck",
          group: "upcoming",
          title: "영유아 건강검진 일정",
          source: "구로구 보건소 검진안내",
          sourceUrl: "https://www.guro.go.kr/health/contents.do?key=1357",
          artifact: "생년월일 기준 표",
          kind: "schedule",
          primary: "다음 검진 기간 확인",
          next: "2차 건강검진",
          progress: 15,
          input: "생년월일 2025-12-01",
          schedule: [["1차 건강검진", "생후 14~35일", "완료"], ["2차 건강검진", "생후 4~6개월", "예약 전"], ["3차 건강검진", "생후 9~12개월", "대기"], ["구강검진", "생후 18~29개월", "대기"]]
        }
      ];

      const state = {
        active: "jeonse",
        filter: "all",
        selectedEntry: {},
        checked: {},
        memo: {},
        toast: ""
      };

      const $ = (id) => document.getElementById(id);
      const flow = () => flows.find((item) => item.id === state.active) || flows[0];
      const keyFor = (flowId, rowId, index) => `${flowId}-${rowId}-${index}`;

      function groupLabel(group) {
        return { today: "오늘", upcoming: "예정", saved: "보관", routine: "반복" }[group] || "전체";
      }

      function filteredFlows() {
        if (state.filter === "all") return flows;
        return flows.filter((item) => item.group === state.filter);
      }

      function rowsFor(item) {
        if (item.kind === "timeline") {
          const selected = state.selectedEntry[item.id] || item.entries[0].id;
          const entry = item.entries.find((row) => row.id === selected) || item.entries[0];
          return { title: entry.title, rows: entry.rows, id: entry.id, subtitle: `${entry.label} · ${entry.date}` };
        }
        if (item.kind === "field") {
          const selected = state.selectedEntry[item.id] || item.sections[0].id;
          const section = item.sections.find((row) => row.id === selected) || item.sections[0];
          return { title: section.title, rows: section.rows, id: section.id, subtitle: "현장 체크" };
        }
        return { title: item.primary, rows: item.rows || [], id: "single", subtitle: item.artifact };
      }

      function doneCount(item) {
        const rowInfo = rowsFor(item);
        return rowInfo.rows.filter((_, index) => state.checked[keyFor(item.id, rowInfo.id, index)]).length;
      }

      function renderList() {
        document.querySelectorAll("[data-filter]").forEach((button) => {
          button.classList.toggle("active", button.dataset.filter === state.filter);
        });
        $("flowList").innerHTML = filteredFlows().map((item) => `
          <button class="flow-card ${item.id === state.active ? "active" : ""}" type="button" data-flow="${item.id}">
            <span class="flow-title">${item.title}</span>
            <span class="flow-meta">${item.artifact} · ${groupLabel(item.group)}</span>
            <span class="flow-foot">
              <span class="small">${item.next}</span>
              <span class="chip ${item.group === "today" ? "green" : item.group === "saved" ? "amber" : "blue"}">${item.progress}%</span>
            </span>
          </button>
        `).join("");
      }

      function renderArtifact(item) {
        if (item.kind === "timeline") {
          return `
            <div class="artifact-list">
              ${item.entries.map((entry) => `
                <div class="row ${entry.id === (state.selectedEntry[item.id] || item.entries[0].id) ? "active" : ""}">
                  <span class="chip blue">${entry.label}</span>
                  <button type="button" data-entry="${entry.id}">
                    <p class="item-title">${entry.title}</p>
                    <span class="small">${entry.date}</span>
                  </button>
                  <span class="small">${entry.rows.length}개</span>
                </div>
              `).join("")}
            </div>
          `;
        }
        if (item.kind === "field") {
          return `
            <div class="artifact-list">
              ${item.sections.map((section, index) => `
                <div class="row ${section.id === (state.selectedEntry[item.id] || item.sections[0].id) ? "active" : ""}">
                  <span class="chip blue">${index + 1}</span>
                  <button type="button" data-entry="${section.id}">
                    <p class="item-title">${section.title}</p>
                    <span class="small">${section.rows.length}개 체크</span>
                  </button>
                  <span class="small">현장</span>
                </div>
              `).join("")}
            </div>
          `;
        }
        if (item.kind === "schedule") {
          return `
            <div class="rows">
              ${item.schedule.map((row) => `
                <div class="row">
                  <span class="chip ${row[2] === "완료" ? "green" : row[2] === "예약 전" ? "amber" : "blue"}">${row[2]}</span>
                  <span><p class="item-title">${row[0]}</p><span class="small">${row[1]}</span></span>
                  <span class="small">표</span>
                </div>
              `).join("")}
            </div>
          `;
        }
        if (item.kind === "bucket") {
          return `
            <label class="small" for="bucketDate">할 날짜가 생기면 캘린더에 붙이기</label>
            <input id="bucketDate" type="date" value="">
            <div class="rows" style="margin-top:8px">
              ${item.rows.map((row, index) => `
                <div class="row">
                  <span class="chip amber">${index + 1}</span>
                  <span><p class="item-title">${row[0]}</p><span class="small">${row[1]}</span></span>
                  <span class="small">준비물</span>
                </div>
              `).join("")}
            </div>
          `;
        }
        if (item.kind === "routine") {
          return `
            <div class="calendar" aria-label="반복 일정 미리보기">
              ${["월","화","수","목","금","토","일"].map((day) => `<div class="calendar-day ${["월","수","금"].includes(day) && item.id === "workout" ? "marked" : day === "토" && item.id === "stuckyi" ? "today" : ""}">${day}<br>${item.id === "workout" && ["월","수","금"].includes(day) ? "20:00" : item.id === "stuckyi" && day === "토" ? "물주기" : ""}</div>`).join("")}
            </div>
          `;
        }
        return "";
      }

      function renderTasks(item) {
        const rowInfo = rowsFor(item);
        return `
          <p class="small" style="font-weight:900;color:var(--blue);margin-bottom:6px">${rowInfo.subtitle}</p>
          <h3>${rowInfo.title}</h3>
          <div class="task-list">
            ${rowInfo.rows.map((row, index) => {
              const id = keyFor(item.id, rowInfo.id, index);
              return `
                <label class="task ${state.checked[id] ? "done" : ""}">
                  <input type="checkbox" data-check="${id}" ${state.checked[id] ? "checked" : ""}>
                  <span><p class="item-title">${row[0]}</p><span class="small">${row[1]}</span></span>
                  <span class="chip ${state.checked[id] ? "green" : "blue"}">${state.checked[id] ? "완료" : "체크"}</span>
                </label>
              `;
            }).join("")}
          </div>
        `;
      }

      function renderDetail() {
        const item = flow();
        const rowInfo = rowsFor(item);
        const done = doneCount(item);
        $("detail").innerHTML = `
          <div class="detail-head">
            <div>
              <p class="small" style="font-weight:900;color:var(--blue);margin-bottom:6px">${item.source}</p>
              <h2>${item.title}</h2>
              <p class="desc">${item.primary}</p>
              <div class="chips">
                <span class="chip blue">${item.artifact}</span>
                <span class="chip green">${item.input}</span>
                <span class="chip amber">다음: ${item.next}</span>
              </div>
            </div>
            <div class="actions">
              <button class="btn" type="button" id="mainAction">${item.kind === "bucket" ? "날짜 붙이기" : item.kind === "schedule" ? "표 열기" : "내 도구로 옮기기"}</button>
              <button class="btn secondary" type="button" id="openSource">원문 열기</button>
            </div>
          </div>

          <div class="stats">
            <div class="stat"><strong>${item.progress}%</strong><span class="small">전체 진행</span><div class="progress" style="margin-top:8px"><span style="--value:${item.progress}%"></span></div></div>
            <div class="stat"><strong>${done}/${rowInfo.rows.length}</strong><span class="small">현재 화면 체크</span></div>
            <div class="stat"><strong>${groupLabel(item.group)}</strong><span class="small">관리 위치</span></div>
          </div>

          <div class="content-grid">
            <article class="card">
              <h3>${item.kind === "bucket" ? "보관한 자료" : item.kind === "routine" ? "반복 일정" : "실행 항목"}</h3>
              ${renderArtifact(item)}
            </article>
            <article class="card">
              ${renderTasks(item)}
              <label class="small" style="display:block;margin-top:12px" for="memo">메모</label>
              <textarea id="memo" placeholder="다시 볼 내용만 짧게 남기기">${state.memo[item.id] || ""}</textarea>
              <div class="source-box">원문: <a href="${item.sourceUrl}" target="_blank" rel="noreferrer">${item.source}</a></div>
              ${state.toast ? `<div class="toast">${state.toast}</div>` : ""}
            </article>
          </div>
        `;
      }

      function render() {
        renderList();
        renderDetail();
      }

      document.addEventListener("click", (event) => {
        const filter = event.target.closest("[data-filter]");
        if (filter) {
          state.filter = filter.dataset.filter;
          const first = filteredFlows()[0];
          if (first && !filteredFlows().some((item) => item.id === state.active)) state.active = first.id;
          state.toast = "";
          render();
          return;
        }
        const selectedFlow = event.target.closest("[data-flow]");
        if (selectedFlow) {
          state.active = selectedFlow.dataset.flow;
          state.toast = "";
          render();
          return;
        }
        const selectedEntry = event.target.closest("[data-entry]");
        if (selectedEntry) {
          state.selectedEntry[state.active] = selectedEntry.dataset.entry;
          state.toast = "";
          render();
          return;
        }
        const check = event.target.closest("[data-check]");
        if (check) {
          state.checked[check.dataset.check] = check.checked;
          render();
          return;
        }
        if (event.target.id === "mainAction") {
          const item = flow();
          state.toast = item.kind === "bucket"
            ? `${item.title}에 날짜를 붙일 수 있습니다. 준비물은 그대로 보관됩니다.`
            : `${item.artifact} 형태로 내 도구에 옮길 준비가 됐습니다.`;
          render();
          return;
        }
        if (event.target.id === "openSource") {
          const item = flow();
          state.toast = `${item.source} 원문을 새 탭으로 엽니다.`;
          window.open(item.sourceUrl, "_blank", "noopener");
          render();
          return;
        }
        if (event.target.id === "showToday") {
          state.filter = "today";
          state.active = filteredFlows()[0]?.id || state.active;
          state.toast = "";
          render();
          return;
        }
        if (event.target.id === "showSaved") {
          state.filter = "saved";
          state.active = filteredFlows()[0]?.id || state.active;
          state.toast = "";
          render();
          return;
        }
        if (event.target.id === "openFeedback") {
          state.toast = "이 Flow가 실제로 도움이 됐는지, 막힌 지점만 짧게 남깁니다.";
          render();
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.id === "memo") {
          state.memo[state.active] = event.target.value;
        }
      });

      render();
    </script>
  </body>
</html>
