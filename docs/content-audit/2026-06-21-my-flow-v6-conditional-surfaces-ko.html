<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>내 Flow</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #2563eb;
      --brand-weak: #eff6ff;
      --brand-line: #bfdbfe;
      --page: #f5f7fb;
      --card: #fff;
      --subtle: #f8fafc;
      --muted-surface: #eef2f7;
      --border: #d8e0eb;
      --border-strong: #c2ccd9;
      --text-primary: #202936;
      --text-secondary: #536173;
      --text-tertiary: #738197;
      --success: #0f7a4a;
      --success-weak: #e8f7ef;
      --warning: #9a6100;
      --warning-weak: #fff6df;
      --radius-card: 16px;
      --radius-inner: 10px;
      --shadow-card: 0 1px 3px rgba(32, 41, 54, .04);
      --shadow-raised: 0 4px 12px rgba(32, 41, 54, .08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      color: var(--text-primary);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); letter-spacing: 0; }
    button, input, textarea { font: inherit; letter-spacing: 0; }
    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }
    .app {
      width: min(100% - 48px, 1080px);
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 0 max(48px, env(safe-area-inset-bottom));
    }
    .shell { display: grid; gap: 24px; }
    .top, .panel, .row, .detail, .check, .finder, .flow-card, .note-box, .rail, .calendar, .progress {
      border-radius: var(--radius-card);
      background: var(--card);
    }
    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
      padding: 24px;
      box-shadow: var(--shadow-card);
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: 24px; line-height: 1.35; letter-spacing: -.01em; }
    h2 { margin-bottom: 6px; font-size: 20px; line-height: 1.35; letter-spacing: -.01em; }
    h3 { margin-bottom: 4px; font-size: 18px; line-height: 1.35; letter-spacing: -.01em; }
    p { color: var(--text-secondary); font-size: 15px; font-weight: 500; line-height: 1.5; }
    .eyebrow {
      margin-bottom: 6px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }
    .summary {
      min-width: 208px;
      border-radius: var(--radius-inner);
      background: var(--subtle);
      padding: 16px;
    }
    .summary b, .summary span { display: block; }
    .summary b { color: var(--text-primary); font-size: 18px; font-weight: 700; line-height: 1.35; }
    .summary span { margin-top: 4px; color: var(--text-secondary); font-size: 13px; font-weight: 500; line-height: 1.5; }
    .panel {
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: none;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .secondary {
      min-height: 44px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-inner);
      background: var(--card);
      color: var(--text-primary);
      padding: 0 16px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .secondary:hover, .show-more:hover, .date-pill:hover, .flow-card:hover, .row:hover { border-color: var(--brand-line); background: var(--brand-weak); }
    .layout { display: grid; grid-template-columns: minmax(0, .92fr) minmax(330px, 1.08fr); gap: 24px; padding-top: 24px; align-items: start; }
    .layout.single { grid-template-columns: minmax(0, 1fr); }
    .stack { display: grid; gap: 12px; }
    .section-title { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 8px; color: var(--text-primary); font-size: 13px; font-weight: 700; line-height: 1.5; }
    .section-title span { color: var(--text-tertiary); font-size: 12px; font-weight: 600; }
    .rail {
      display: flex;
      gap: 8px;
      padding: 8px;
      overflow-x: auto;
      border: 1px solid var(--border);
      background: var(--subtle);
      box-shadow: none;
    }
    .date-pill {
      min-width: 84px;
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: var(--radius-inner);
      background: var(--card);
      padding: 8px 10px;
      text-align: left;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 700;
    }
    .date-pill b, .date-pill span { display: block; }
    .date-pill span { margin-top: 3px; color: var(--text-tertiary); font-weight: 600; }
    .date-pill.active { border-color: var(--brand-line); background: var(--brand-weak); color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand-line); }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 76px;
      padding: 14px;
      text-align: left;
      border: 1px solid var(--border);
      box-shadow: none;
    }
    .row.active { border-color: var(--brand-line); background: var(--brand-weak); box-shadow: inset 0 0 0 1px var(--brand-line); }
    .row-main { min-width: 0; min-height: 44px; border: 0; background: transparent; padding: 0; text-align: left; color: inherit; }
    .row-main b, .row-main span { display: block; }
    .row-main b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); font-size: 14px; font-weight: 700; line-height: 1.35; }
    .row-main span { margin-top: 4px; color: var(--text-secondary); font-size: 13px; font-weight: 500; line-height: 1.5; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      width: fit-content;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--subtle);
      padding: 4px 10px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .chip.blue { border-color: var(--brand-line); background: var(--brand-weak); color: var(--brand); }
    .chip.green { border-color: #bde7cb; background: var(--success-weak); color: var(--success); }
    .chip.amber { border-color: #efd08f; background: var(--warning-weak); color: var(--warning); }
    .quick-check {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-inner);
      background: var(--card);
      color: transparent;
      font-size: 16px;
      font-weight: 700;
    }
    .quick-check.done { border-color: var(--success); background: var(--success); color: var(--card); }
    .detail {
      position: sticky;
      top: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: none;
    }
    .layout.single .detail { position: static; }
    .detail-top { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .checks { display: grid; gap: 10px; margin-top: 14px; }
    .section-label { margin-top: 14px; color: var(--text-secondary); font-size: 12px; font-weight: 800; }
    .check {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      min-height: 72px;
      padding: 14px;
      border: 1px solid var(--border);
      box-shadow: none;
    }
    .check.done { border-color: #bde7cb; background: var(--success-weak); }
    .check input { width: 24px; height: 24px; margin-top: 1px; accent-color: var(--brand); }
    .check b, .check span { display: block; }
    .check b { color: var(--text-primary); font-size: 14px; font-weight: 700; line-height: 1.35; }
    .check span span { margin-top: 4px; color: var(--text-secondary); font-size: 13px; font-weight: 500; line-height: 1.5; }
    .step-detail {
      display: grid;
      gap: 6px;
      margin-top: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-inner);
      background: var(--subtle);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.55;
    }
    .step-detail b { color: var(--text-primary); font-size: 14px; }
    .memo { display: grid; gap: 8px; margin-top: 14px; }
    .memo label { color: var(--text-primary); font-size: 13px; font-weight: 700; }
    textarea, input[type="search"] {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-inner);
      background: var(--card);
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.5;
    }
    textarea { min-height: 104px; resize: vertical; }
    textarea::placeholder, input::placeholder { color: var(--text-tertiary); }
    .save-state {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      margin-top: 10px;
      border-radius: 999px;
      background: var(--subtle);
      padding: 5px 10px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
    }
    .note-box, .progress {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      background: var(--subtle);
      box-shadow: none;
    }
    .note-box summary, .progress summary { min-height: 44px; display: flex; align-items: center; color: var(--text-primary); font-size: 14px; font-weight: 700; cursor: pointer; }
    .note-box pre { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; color: var(--text-secondary); font: inherit; font-size: 13px; line-height: 1.5; }
    .progress-list { display: grid; gap: 8px; margin-top: 10px; }
    .progress-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-inner);
      background: var(--card);
      padding: 10px;
    }
    .progress-row b, .progress-row span { display: block; }
    .progress-row b { color: var(--text-primary); font-size: 14px; font-weight: 700; }
    .progress-row span { color: var(--text-secondary); font-size: 13px; font-weight: 500; }
    .step-num { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 999px; background: var(--muted-surface); color: var(--text-secondary); font-size: 12px; font-weight: 700; }
    .finder, .calendar {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      background: var(--subtle);
      box-shadow: none;
    }
    .finder.open, .calendar.open { display: grid; gap: 12px; }
    .flow-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .flow-card {
      display: grid;
      gap: 6px;
      min-height: 86px;
      padding: 14px;
      border: 1px solid var(--border);
      text-align: left;
      box-shadow: none;
    }
    .flow-card.active { border-color: var(--brand-line); background: var(--brand-weak); }
    .flow-card b, .flow-card span { display: block; }
    .flow-card b { color: var(--text-primary); font-size: 14px; font-weight: 700; line-height: 1.35; }
    .flow-card span { color: var(--text-secondary); font-size: 13px; font-weight: 500; line-height: 1.5; }
    .show-more {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-inner);
      background: var(--subtle);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
    }
    .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    .day {
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: var(--radius-inner);
      background: var(--card);
      padding: 7px;
      text-align: left;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
    }
    .day.has { border-color: var(--brand-line); background: var(--brand-weak); color: var(--brand); }
    .day.active { box-shadow: inset 0 0 0 2px var(--brand); }
    .empty { border: 1px dashed var(--border-strong); border-radius: var(--radius-inner); padding: 16px; color: var(--text-secondary); font-size: 13px; font-weight: 600; }
    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    }
    @media (max-width: 820px) {
      .app { width: min(100% - 24px, 720px); padding-top: max(12px, env(safe-area-inset-top)); }
      .top, .layout, .layout.single { grid-template-columns: 1fr; }
      .summary { min-width: 0; }
      .panel-head, .detail-top { display: grid; }
      .head-actions { justify-content: flex-start; }
      .detail { position: static; }
      .flow-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .app { width: min(100% - 20px, 430px); }
      .shell { gap: 16px; }
      h1 { font-size: 24px; }
      h2 { font-size: 18px; }
      .top, .panel { padding: 16px; }
      .top { gap: 16px; }
      .layout { gap: 16px; padding-top: 16px; }
      .panel-head { gap: 12px; padding-bottom: 14px; }
      .head-actions { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .secondary { width: 100%; }
      .row-main b { white-space: normal; }
      .calendar { padding: 12px; }
      .month-grid { grid-template-columns: repeat(5, minmax(44px, 1fr)); gap: 6px; }
      .day { min-width: 44px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <header class="top">
        <div>
          <p class="eyebrow">내 실행 공간</p>
          <h1>내 Flow</h1>
          <p id="heroCopy">오늘 할 일만 먼저 보고, 필요할 때 일정과 진도를 엽니다.</p>
        </div>
        <aside class="summary" aria-live="polite">
          <b id="summaryTitle">오늘 3개</b>
          <span id="summaryMeta">저장한 Flow 8개</span>
          <span id="summaryHint">체크하거나 짧게 메모하세요.</span>
        </aside>
      </header>

      <section class="panel" aria-labelledby="screenTitle">
        <div class="panel-head">
          <div>
            <p class="eyebrow" id="screenKicker">오늘</p>
            <h2 id="screenTitle">먼저 할 일</h2>
            <p id="screenCopy">지금 처리할 항목만 모았습니다.</p>
          </div>
          <div class="head-actions">
            <button class="secondary hidden" type="button" id="toggleCalendar">일정 보기</button>
            <button class="secondary" type="button" id="toggleFinder">Flow 찾기</button>
          </div>
        </div>

        <div class="layout" id="layout">
          <div class="stack" id="listPane">
            <div class="rail" id="dateRail" aria-label="날짜 선택"></div>

            <div class="calendar" id="calendarPanel" aria-label="일정 보기">
              <div class="section-title">
                <b>6월 일정</b>
                <span id="calendarCount">0개</span>
              </div>
              <div class="month-grid" id="monthGrid"></div>
            </div>

            <div>
              <div class="section-title">
                <b id="listTitle">오늘 할 일</b>
                <span id="listCount">3개</span>
              </div>
              <div class="stack" id="entryList"></div>
              <button class="show-more hidden" type="button" id="showListButton">남은 항목 보기</button>
            </div>

            <div class="finder" id="finderPanel">
              <div class="section-title">
                <b>저장한 Flow</b>
                <span id="finderCount">8개</span>
              </div>
              <input id="searchInput" type="search" placeholder="예: 수학, 여권, 홈트" aria-label="저장한 Flow 검색" />
              <div class="flow-grid" id="flowList"></div>
              <button class="show-more hidden" type="button" id="showMoreButton">전체 Flow 보기</button>
            </div>
          </div>

          <article class="detail" aria-labelledby="detailTitle">
            <div class="detail-top">
              <div>
                <p class="eyebrow" id="detailKicker">선택한 항목</p>
                <h3 id="detailTitle">계약 전 서류 확인</h3>
                <p id="detailMeta">전세계약 전 서류 체크 · 오늘</p>
              </div>
              <span class="chip blue" id="detailStatus">오늘</span>
            </div>

            <div class="checks" id="checkList"></div>

            <div class="memo">
              <label for="memoInput">메모</label>
              <textarea id="memoInput" placeholder="확인한 내용이나 다시 볼 링크를 남기세요"></textarea>
            </div>
            <span class="save-state" id="saveState">입력하면 자동 저장됩니다.</span>

            <details class="progress hidden" id="progressBox">
              <summary>전체 진도 보기</summary>
              <div class="progress-list" id="progressList"></div>
            </details>

            <details class="note-box">
              <summary>다른 앱에 붙일 텍스트</summary>
              <pre id="fallbackText"></pre>
            </details>
          </article>
        </div>
      </section>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const mode = ['single', 'few', 'mixed', 'large'].includes(params.get('mode')) ? params.get('mode') : 'mixed';

    const flows = [
      { id: 'jeonse', name: '전세계약 전 서류 체크', type: '일정', nextId: 'jeonse-docs', aliases: 'jeonse rent contract' },
      { id: 'move', name: '이사 D-30 준비', type: '일정', nextId: 'move-quote', aliases: 'move moving' },
      { id: 'math', name: '중1 수학 학습 지도', type: '진도', nextId: 'math-lesson', sub: '정수와 유리수', aliases: 'math study middle school', progress: [
        ['1', '소인수분해', '완료'],
        ['2', '정수와 유리수', '오늘'],
        ['3', '문자의 사용과 식', '다음'],
        ['4', '좌표평면과 그래프', '보관']
      ] },
      { id: 'workout', name: '초보 홈트 영상 루틴', type: '루틴', nextId: 'workout-session', aliases: 'workout home training routine' },
      { id: 'passport', name: '온라인 여권 재발급', type: '체크', nextId: 'passport-photo', aliases: 'passport' },
      { id: 'baby', name: '영유아 건강검진 준비', type: '일정', nextId: 'baby-checkup', aliases: 'baby health checkup' },
      { id: 'squishy', name: '무료 도안 스퀴시 만들기', type: '보관', nextId: 'squishy-play', aliases: 'squishy craft' },
      { id: 'plant', name: '스투키 물주기', type: '루틴', nextId: 'plant-water', aliases: 'plant water' }
    ];

    const entries = [
      {
        id: 'jeonse-docs',
        flowId: 'jeonse',
        dateKey: 'today',
        day: 21,
        dateText: '오늘',
        title: '계약 전 서류 확인',
        meta: '시세, 등기부등본, 보증보험 가능 여부',
        source: '전세계약 전 서류 체크 Flow',
        detail: '계약 전에 실제로 확인해야 하는 서류 단서만 남긴 항목입니다.',
        completion: '시세, 등기부등본, 보증보험 가능 여부를 확인하고 걸리는 내용을 메모했습니다.',
        items: [
          { title: '시세 확인', detail: '주변 실거래가와 보증금 차이를 봅니다.' },
          { title: '등기부등본 확인', detail: '소유자, 근저당, 압류 여부를 봅니다.' },
          { title: '전세보증보험 가능 여부 확인', detail: '가입 가능 여부와 필요 서류를 봅니다.' }
        ],
        memo: '계약서 원문, 주민등록번호, 계좌번호는 저장하지 않음.',
        memoHint: '걸리는 서류 항목, 확인한 URL, 중개사에게 물어볼 내용만 남기세요'
      },
      {
        id: 'math-lesson',
        flowId: 'math',
        dateKey: 'today',
        day: 21,
        dateText: '오늘',
        title: '정수와 유리수 10강',

        const entry = entryById(flow.nextId);
        return `
          <button class="flow-card ${entry.id === state.selectedId ? 'active' : ''}" type="button" data-open="${entry.id}">
            <span class="chip">${flow.type}</span>
            <b>${flow.name}</b>
            <span>${flow.sub ? `${flow.sub} · ` : ''}${entry.title}</span>
          </button>
        `;
      }).join('') || '<div class="empty">검색 결과가 없습니다.</div>';
      const hasMore = activeFlows.length > config.finderLimit && !state.showAll && !state.query;
      $('showMoreButton').classList.toggle('hidden', !hasMore);
      $('showMoreButton').textContent = `전체 Flow ${activeFlows.length}개 보기`;
    }

    function renderDetail() {
      const entry = entryById(state.selectedId);
      const flow = flowById(entry.flowId);
      const done = isDone(entry);
      const items = entryItems(entry);
      $('detailKicker').textContent = flow.sub ? `${flow.name}에서 이어보기` : '선택한 항목';
      $('detailTitle').textContent = entry.title;
      $('detailMeta').textContent = `${scopedName(entry)} · ${entry.dateText}`;
      $('detailStatus').textContent = done ? '완료' : entry.dateText;
      $('detailStatus').className = `chip ${done ? 'green' : entry.dateKey === 'today' ? 'blue' : entry.dateKey === 'week' ? 'amber' : ''}`;
      $('saveState').textContent = state.memos[entry.id] ? '메모 저장됨' : '입력하면 자동 저장됩니다.';
      const itemMarkup = items.length ? items.map((item, index) => {
        const key = checkKey(entry, index);
        const checked = Boolean(state.checks[key]);
        return `
          <label class="check ${checked ? 'done' : ''}">
            <input type="checkbox" data-check="${key}" ${checked ? 'checked' : ''} />
            <span><b>${item.title}</b><span>${item.detail || '필요한 내용만 메모에 남깁니다.'}</span></span>
          </label>
        `;
      }).join('') : `
          <label class="check ${done ? 'done' : ''}">
            <input type="checkbox" data-step="${entry.id}" ${done ? 'checked' : ''} />
            <span><b>이 항목 완료</b><span>${entry.completion || '이 항목을 실행했으면 완료로 표시합니다.'}</span></span>
          </label>
        `;
      const itemSectionLabel = items.length > 1 ? '세부 항목' : items.length === 1 ? '할 일' : '완료 표시';
      $('checkList').innerHTML = `
        <div class="section-label">${itemSectionLabel}</div>
        <div class="step-detail"><b>실행 기준</b><span>${entry.detail || entry.meta}</span></div>
        ${itemMarkup}
      `;
      $('memoInput').value = state.memos[entry.id] ?? entry.memo ?? '';
      $('memoInput').placeholder = entry.memoHint || '확인한 내용이나 다시 볼 링크를 남기세요';
      $('fallbackText').textContent = fallbackText(entry);
      const progressRows = flow.progress || [];
      $('progressBox').classList.toggle('hidden', progressRows.length === 0);
      $('progressList').innerHTML = progressRows.map(([num, title, status]) => `
        <div class="progress-row">
          <span class="step-num">${num}</span>
          <span><b>${title}</b><span>${status}</span></span>
          <span class="chip ${status === '오늘' ? 'blue' : status === '완료' ? 'green' : ''}">${status}</span>
        </div>
      `).join('');
    }

    function render() {
      renderChrome();
      renderRail();
      renderCalendar();
      renderList();
      renderFinder();
      renderDetail();
      bindDynamicEvents();
    }

    function toggleAll(entryId) {
      const entry = entryById(entryId);
      const next = !isDone(entry);
      const items = entryItems(entry);
      if (!items.length) {
        state.stepDone[entry.id] = next;
      } else {
        items.forEach((_, index) => {
          state.checks[checkKey(entry, index)] = next;
        });
      }
      render();
    }

    function selectEntry(entryId, options = {}) {
      state.selectedId = entryId;
      const entry = entryById(entryId);
      state.date = entry.dateKey;
      state.listExpanded = false;
      if (options.closeFinder) {
        state.finderOpen = false;
        state.query = '';
        state.showAll = false;
      }
      render();
    }

    function bindDynamicEvents() {
      all('[data-date]').forEach((button) => {
        button.addEventListener('click', () => {
          state.date = button.dataset.date;
          state.listExpanded = false;
          const first = listEntries()[0];
          if (first) state.selectedId = first.id;
          render();
        });
      });
      all('[data-day]').forEach((button) => {
        button.addEventListener('click', () => {
          const day = Number(button.dataset.day);
          const first = datedEntries().find((entry) => entry.day === day);
          if (first) selectEntry(first.id);
        });
      });
      all('[data-open]').forEach((button) => {
        button.addEventListener('click', () => {
          selectEntry(button.dataset.open, { closeFinder: Boolean(button.closest('#finderPanel')) });
        });
      });
      all('[data-toggle]').forEach((button) => {
        button.addEventListener('click', () => toggleAll(button.dataset.toggle));
      });
      all('[data-check]').forEach((input) => {
        input.addEventListener('change', () => {
          state.checks[input.dataset.check] = input.checked;
          render();
        });
      });
      all('[data-step]').forEach((input) => {
        input.addEventListener('change', () => {
          state.stepDone[input.dataset.step] = input.checked;
          render();
        });
      });
    }

    $('toggleFinder').addEventListener('click', () => {
      state.finderOpen = !state.finderOpen;
      if (state.finderOpen) state.calendarOpen = false;
      render();
      if (state.finderOpen) $('searchInput').focus();
    });

    $('toggleCalendar').addEventListener('click', () => {
      state.calendarOpen = !state.calendarOpen;
      if (state.calendarOpen) state.finderOpen = false;
      render();
    });

    $('searchInput').addEventListener('input', (event) => {
      state.query = event.target.value;
      renderFinder();
      bindDynamicEvents();
    });

    $('showMoreButton').addEventListener('click', () => {
      state.showAll = true;
      renderFinder();
      bindDynamicEvents();
    });

    $('showListButton').addEventListener('click', () => {
      state.listExpanded = true;
      render();
    });

    $('memoInput').addEventListener('input', (event) => {
      state.memos[state.selectedId] = event.target.value;
      $('fallbackText').textContent = fallbackText(entryById(state.selectedId));
      $('saveState').textContent = event.target.value.trim() ? '메모 저장됨' : '입력하면 자동 저장됩니다.';
      $('summaryHint').textContent = '메모가 저장되었습니다.';
    });

    render();
  </script>
</body>
</html>
