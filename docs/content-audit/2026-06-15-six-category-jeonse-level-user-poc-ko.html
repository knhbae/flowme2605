<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>6개 카테고리 Flow 사용자 PoC</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --surface: #ffffff;
      --soft: #f8fafc;
      --line: #dbe3ef;
      --line-strong: #c5d0df;
      --text: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #047857;
      --green-soft: #ecfdf5;
      --amber: #b45309;
      --amber-soft: #fffbeb;
      --red: #b42318;
      --red-soft: #fff1f2;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      --radius: 8px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #fbfdff 0, var(--bg) 420px);
      font-size: 16px;
      line-height: 1.58;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      font-weight: 800;
    }

    a {
      color: var(--blue);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    p,
    h1,
    h2,
    h3,
    h4 {
      margin-top: 0;
    }

    .page {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .brand {
      color: #1d4ed8;
      font-size: 24px;
      font-weight: 900;
      text-decoration: none;
    }

    .ghost {
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      padding: 0 12px;
    }

    .hero {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(26px, 5vw, 38px);
      line-height: 1.16;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 8px;
      font-size: clamp(22px, 3vw, 30px);
      line-height: 1.22;
      letter-spacing: 0;
    }

    h3 {
      margin-bottom: 6px;
      font-size: 19px;
      line-height: 1.3;
    }

    h4 {
      margin-bottom: 6px;
      font-size: 16px;
    }

    .desc {
      max-width: 760px;
      color: #334155;
    }

    .chips,
    .button-row,
    .source-links,
    .segment-row,
    .weekday-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chips {
      margin-top: 12px;
    }

    .chip,
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      color: #334155;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chip.blue,
    .pill.blue {
      border-color: #bfdbfe;
      background: var(--blue-soft);
      color: #1e3a8a;
    }

    .chip.green,
    .pill.green {
      border-color: #bbf7d0;
      background: var(--green-soft);
      color: var(--green);
    }

    .chip.warn,
    .pill.warn {
      border-color: #fde68a;
      background: var(--amber-soft);
      color: var(--amber);
    }

    .app-shell {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 14px;
      margin-top: 14px;
      align-items: start;
    }

    .flow-nav,
    .workbench {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .flow-nav {
      position: sticky;
      top: 12px;
      display: grid;
      gap: 8px;
      padding: 10px;
    }

    .nav-button {
      min-height: 66px;
      padding: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: #334155;
      text-align: left;
    }

    .nav-button b,
    .nav-button span {
      display: block;
    }

    .nav-button span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .nav-button[aria-selected="true"] {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: #1d4ed8;
      box-shadow: inset 0 0 0 1px var(--blue);
    }

    .workbench {
      overflow: hidden;
    }

    .workbench-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff 0, #f8fafc 100%);
    }

    .progress-pill {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(340px, 0.85fr) minmax(0, 1.15fr);
      gap: 0;
    }

    .phone {
      border-right: 1px solid var(--line);
      background: #f1f5f9;
      padding: 14px;
    }

    .phone-frame {
      max-width: 420px;
      margin: 0 auto;
      border: 1px solid #cbd5e1;
      border-radius: 22px;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 20px 44px rgba(15, 23, 42, 0.12);
    }

    .phone-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .phone-title b,
    .phone-title span {
      display: block;
    }

    .phone-title span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .phone-body {
      display: grid;
      gap: 10px;
      padding: 12px;
      background: #f8fafc;
    }

    .screen-card {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .label {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .source-links {
      margin-top: 8px;
    }

    .source-links a {
      text-decoration: none;
    }

    .input-grid {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: #334155;
      font-size: 13px;
      font-weight: 850;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: white;
      color: var(--text);
    }

    input,
    select {
      min-height: 44px;
      padding: 8px 10px;
    }

    textarea {
      min-height: 84px;
      padding: 10px;
      resize: vertical;
    }

    .primary {
      min-height: 44px;
      background: var(--blue);
      color: #fff;
      padding: 0 14px;
    }

    .secondary {
      min-height: 42px;
      border: 1px solid var(--line);
      background: white;
      color: #334155;
      padding: 0 12px;
    }

    .segment,
    .weekday {
      min-height: 40px;
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      padding: 0 10px;
    }

    .segment.active,
    .weekday.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: #1d4ed8;
      box-shadow: inset 0 0 0 1px var(--blue);
    }

    .toast {
      display: none;
      margin-top: 10px;
      padding: 9px 10px;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      background: var(--blue-soft);
      color: #1e3a8a;
      font-size: 13px;
      font-weight: 800;
    }

    .toast.show {
      display: block;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #e8eef6;
    }

    .tab {
      min-height: 42px;
      background: transparent;
      color: #475569;
      font-size: 14px;
    }

    .tab.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .time-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .time-button {
      min-height: 72px;
      padding: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      text-align: left;
    }

    .time-button span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .time-button.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: #1d4ed8;
      box-shadow: inset 0 0 0 1px var(--blue);
    }

    .progress {
      height: 8px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e2e8f0;
    }

    .progress span {
      display: block;
      width: var(--value, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
      transition: width 180ms ease;
    }

    .task-list {
      display: grid;
      gap: 9px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .task {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .task input {
      width: 18px;
      height: 18px;
      min-height: 18px;
      margin-top: 3px;
    }

    .task strong,
    .task span {
      display: block;
    }

    .task span {
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .task.done strong {
      color: #94a3b8;
      text-decoration: line-through;
    }

    .state-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .state-button {
      min-height: 40px;
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      padding: 0 10px;
      font-size: 14px;
    }

    .state-button.active {
      border-color: #bbf7d0;
      background: var(--green-soft);
      color: var(--green);
      box-shadow: inset 0 0 0 1px #10b981;
    }

    .content-panel {
      padding: 16px;
      background: var(--surface);
    }

    .calendar-card,
    .detail-card,
    .all-card,
    .next-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 14px;
    }

    .detail-card,
    .all-card,
    .next-card {
      margin-top: 12px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      margin-top: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .calendar-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
    }

    .month-nav {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .month-button {
      min-height: 36px;
      padding: 0 9px;
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      font-size: 13px;
    }

    .weekday-label,
    .day {
      min-height: 56px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 6px;
      font-size: 12px;
    }

    .weekday-label {
      min-height: auto;
      background: #f1f5f9;
      text-align: center;
      font-weight: 900;
    }

    .day {
      appearance: none;
      border-radius: 0;
      background: #fff;
      color: var(--text);
      text-align: left;
      font-weight: 700;
    }

    .day:nth-child(7n),
    .weekday-label:nth-child(7n) {
      border-right: 0;
    }

    .day.empty {
      background: #f8fafc;
      color: #cbd5e1;
    }

    .day.has-event:hover,
    .day.has-event:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: -2px;
      background: var(--blue-soft);
    }

    .day.active {
      background: var(--blue-soft);
      box-shadow: inset 0 0 0 2px var(--blue);
    }

    .event-chip {
      margin-top: 4px;
      padding: 3px 4px;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      background: var(--blue-soft);
      color: #1e3a8a;
      font-size: 11px;
      font-weight: 900;
    }

    .date-agenda,
    .schedule-strip {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
    }

    .agenda-list,
    .schedule-list {
      display: grid;
      gap: 7px;
      margin-top: 8px;
    }

    .agenda-item,
    .schedule-item {
      min-height: 42px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #334155;
      text-align: left;
    }

    .agenda-item b,
    .agenda-item span,
    .schedule-item b,
    .schedule-item span {
      display: block;
    }

    .agenda-item span,
    .schedule-item span {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .agenda-item.active,
    .schedule-item.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: #1d4ed8;
      box-shadow: inset 0 0 0 1px var(--blue);
    }

    .all-stage {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .all-stage + .all-stage {
      margin-top: 10px;
    }

    .detail-links {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .detail-links a {
      display: block;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
      font-weight: 800;
      text-decoration: none;
    }

    .copy-box {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      background: var(--blue-soft);
      color: #1e3a8a;
      font-size: 14px;
      font-weight: 750;
    }

    .warning-box {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #fde68a;
      border-radius: 6px;
      background: var(--amber-soft);
      color: #92400e;
      font-size: 14px;
      font-weight: 750;
    }

    @media (max-width: 980px) {
      .app-shell,
      .workspace {
        grid-template-columns: 1fr;
      }

      .flow-nav {
        position: static;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .phone {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .phone-frame {
        max-width: 100%;
      }
    }

    @media (max-width: 620px) {
      .page {
        width: min(100% - 20px, 1180px);
        padding-top: 10px;
      }

      .hero,
      .workbench-head,
      .content-panel {
        padding: 14px;
      }

      .flow-nav {
        grid-template-columns: 1fr;
      }

      .workbench-head {
        flex-direction: column;
      }

      .phone {
        padding: 10px;
      }

      .time-row,
      .tabs {
        grid-template-columns: 1fr;
      }

      .day {
        min-height: 68px;
        padding: 5px;
      }

      .chip,
      .pill {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="topbar" aria-label="FLOW">
      <a class="brand" href="#">FLOW</a>
      <button class="ghost" type="button" id="reset-flow">현재 Flow 초기화</button>
    </nav>

    <header class="hero">
      <p class="eyebrow">카테고리별 사용자 Flow PoC</p>
      <h1>원컨텐츠를 내 실행 일정으로 바꾸기</h1>
      <p class="desc">전세 계약 Flow처럼, 원컨텐츠를 저장하고 날짜나 반복 기준을 넣은 뒤 체크, 메모, URL까지 실제로 눌러볼 수 있는 사용자 화면입니다.</p>
      <div class="chips">
        <span class="chip blue">입력 1-3개</span>
        <span class="chip green">체크/메모 저장</span>
        <span class="chip warn">캘린더/루틴/버킷 변형</span>
      </div>
    </header>

    <section class="app-shell" aria-label="6개 Flow 사용자 PoC">
      <nav class="flow-nav" id="flow-nav" aria-label="Flow 선택"></nav>

      <article class="workbench">
        <header class="workbench-head">
          <div>
            <div class="chips" id="flow-tags" style="margin-top:0"></div>
            <h2 id="flow-title"></h2>
            <p class="desc" id="flow-summary"></p>
          </div>
          <span class="progress-pill" id="total-progress">0/0 완료</span>
        </header>

        <div class="workspace">
          <section class="phone" aria-label="사용자 화면">
            <div class="phone-frame">
              <div class="phone-top">
                <div class="phone-title">
                  <b id="phone-title"></b>
                  <span id="phone-subtitle"></span>
                </div>
                <span class="pill blue" id="phone-status">저장 전</span>
              </div>
              <div class="phone-body">
                <section class="screen-card" id="source-card"></section>
                <section class="screen-card" id="setup-card"></section>
                <section class="screen-card">
                  <p class="label">보기</p>
                  <div class="tabs" id="view-tabs"></div>
                </section>
                <section class="screen-card" id="time-card"></section>
                <section class="screen-card" id="run-card"></section>
              </div>
            </div>
          </section>

          <section class="content-panel" aria-label="캘린더와 상세">
            <section class="calendar-card" id="calendar-card"></section>
            <section id="secondary-panel"></section>
          </section>
        </div>
      </article>
    </section>
  </main>

  <script>
    const flows = [
      {
        id: 'moving',
        nav: '이사',
        title: '이사 D-30 준비 Flow',
        subtitle: '이사일 기준 일정',
        summary: '이사일과 이사 방식을 넣으면 D-30부터 D-Day까지 견적, 예약, 정산 일정이 생깁니다.',
        tags: ['날짜형', '캘린더', '체크리스트'],
        sourceText: '오늘의집과 이사 체크리스트를 보다가 내 이사일 기준으로 다시 알림을 받고 싶을 때 저장합니다.',
        sources: [
          ['오늘의집 이사 준비 체크리스트', 'https://ohou.se/advices/8442'],
          ['아정당 이사 준비 체크리스트', 'https://www.ajd.co.kr/contents/basic-tip/detail/%EC%8B%A0%ED%98%BC%EC%A7%91_%EC%9D%B4%EC%82%AC_%EC%A4%80%EB%B9%84_%EA%B3%BC%EC%A0%95_%EC%B4%9D%EC%A0%95%EB%A6%AC-48329']
        ],
        inputs: [
          { key: 'moveDate', label: '이사일', type: 'date', value: '2026-07-18' },
          { key: 'method', label: '이사 방식', type: 'segment', value: '포장이사', options: ['포장이사', '반포장이사', '용달/직접'] }
        ],
        anchorKey: 'moveDate',
        saveLabel: '이사 일정 만들기',
        primaryTab: '일정 보기',
        nextLabel: '다음 일정',
        exportLabel: '캘린더에 넣기',
        memoLabel: '업체/예약 메모',

            tasks: ['가방/실내화/필통 확인', '학교 금지 물품 제외', '이름표 필요한 물품 표시']

            tasks: ['가방에 준비물 넣기', '아이가 물건 위치 찾기', '빠진 물품 메모']

            tasks: ['등교 준비에 걸린 시간 확인', '준비물 빠짐 여부 확인', '아이 컨디션 짧게 메모']
          }
        ]
      }
    ];

    const state = {};
    flows.forEach((flow) => {
      const inputs = {};
      flow.inputs.forEach((input) => {
        inputs[input.key] = Array.isArray(input.value) ? [...input.value] : input.value;
      });
      state[flow.id] = {
        inputs,
        saved: false,
        view: 'run',
        stage: flow.stages[0].key,
        calendarDate: '',
        calendarMonth: '',
        checks: {},
        memos: {},
        status: {},
        toast: ''
      };
    });

    let activeFlowId = 'moving';

    const flowById = (id) => flows.find((flow) => flow.id === id);
    const activeFlow = () => flowById(activeFlowId);
    const activeState = () => state[activeFlowId];
    const pad = (value) => String(value).padStart(2, '0');

    function addDays(date, offset) {
      if (!date) return '';
      const value = new Date(`${date}T00:00:00`);
      value.setDate(value.getDate() + offset);
      return `${value.getFullYear()}-${pad(value.getMonth() + 1)}-${pad(value.getDate())}`;
    }

    function dateLabel(date) {
      if (!date) return '날짜 없음';
      const value = new Date(`${date}T00:00:00`);
      if (Number.isNaN(value.getTime())) return '날짜 없음';
      const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
      return `${value.getFullYear()}년 ${value.getMonth() + 1}월 ${value.getDate()}일 ${weekdays[value.getDay()]}요일`;
    }

    function shortDate(date) {
      if (!date) return '날짜 없음';
      const value = new Date(`${date}T00:00:00`);
      if (Number.isNaN(value.getTime())) return '날짜 없음';
      return `${value.getMonth() + 1}/${value.getDate()}`;
    }

    function monthKey(date) {
      if (!date) return '';
      const value = new Date(`${date}T00:00:00`);
      if (Number.isNaN(value.getTime())) return '';
      return `${value.getFullYear()}-${pad(value.getMonth() + 1)}`;
    }

    function shiftMonth(key, offset) {
      if (!key) return '';
      const [year, month] = key.split('-').map(Number);
      const value = new Date(year, month - 1 + offset, 1);
      return `${value.getFullYear()}-${pad(value.getMonth() + 1)}`;
    }

    function getInput(flow, key) {
      return state[flow.id].inputs[key];
    }

    function stageDate(flow, stage) {
      const inputs = state[flow.id].inputs;
      if (flow.id === 'squishy') {
        if (stage.key === '저장') return '';
        if (stage.key === '실행일') return inputs.playDate || '';
        if (stage.key === '완료 후') return inputs.playDate ? addDays(inputs.playDate, 0) : '';
      }
      const anchor = inputs[flow.anchorKey];
      if (!anchor) return '';
      if (typeof stage.offset === 'number') return addDays(anchor, stage.offset);
      if (stage.intervalMultiplier) {
        const interval = Number(inputs.interval || 14);
        return addDays(anchor, interval * stage.intervalMultiplier);
      }
      return anchor;
    }

    function activeStage(flow = activeFlow()) {
      return flow.stages.find((stage) => stage.key === state[flow.id].stage) || flow.stages[0];
    }

    function setActiveStage(flow, stageKey) {
      const stateForFlow = state[flow.id];
      const stage = flow.stages.find((item) => item.key === stageKey) || flow.stages[0];
      const date = stageDate(flow, stage);
      stateForFlow.stage = stage.key;
      stateForFlow.view = 'run';
      if (date) {
        stateForFlow.calendarDate = date;
        stateForFlow.calendarMonth = monthKey(date);
      }
    }

    function checkKey(stage, index) {
      return `${stage.key}-${index}`;
    }

    function taskTitle(task) {
      return typeof task === 'string' ? task : task.title;
    }

    function taskNote(task) {
      return typeof task === 'string' ? '' : task.note || '';
    }

    function stageDone(flow, stage) {
      return stage.tasks.filter((_, index) => state[flow.id].checks[checkKey(stage, index)]).length;
    }

    function flowDone(flow) {
      return flow.stages.reduce((sum, stage) => sum + stageDone(flow, stage), 0);
    }

    function flowTotal(flow) {
      return flow.stages.reduce((sum, stage) => sum + stage.tasks.length, 0);
    }

    function nextStage(flow) {
      const current = activeStage(flow);
      const index = flow.stages.findIndex((stage) => stage.key === current.key);
      return flow.stages[Math.min(index + 1, flow.stages.length - 1)];
    }

    function renderNav() {
      document.querySelector('#flow-nav').innerHTML = flows.map((flow) => `
        <button class="nav-button" type="button" data-flow="${flow.id}" aria-selected="${flow.id === activeFlowId}">
          <b>${flow.nav}</b>
          <span>${flow.title}</span>
        </button>
      `).join('');
      document.querySelectorAll('[data-flow]').forEach((button) => {
        button.addEventListener('click', () => {
          activeFlowId = button.dataset.flow;
          render();
        });
      });
    }

    function renderHeader(flow) {
      document.querySelector('#flow-tags').innerHTML = flow.tags.map((tag) => `<span class="chip blue">${tag}</span>`).join('');
      document.querySelector('#flow-title').textContent = flow.title;
      document.querySelector('#flow-summary').textContent = flow.summary;
      document.querySelector('#phone-title').textContent = flow.title;
      document.querySelector('#phone-subtitle').textContent = flow.subtitle;
      document.querySelector('#phone-status').textContent = state[flow.id].saved ? `${flowDone(flow)}/${flowTotal(flow)} 완료` : '저장 전';
      document.querySelector('#total-progress').textContent = `${flowDone(flow)}/${flowTotal(flow)} 완료`;
    }

    function renderSource(flow) {
      document.querySelector('#source-card').innerHTML = `
        <p class="label">원컨텐츠</p>
        <p>${flow.sourceText}</p>
        <div class="source-links">
          ${flow.sources.map(([label, href]) => `<a class="chip blue" href="${href}" target="_blank" rel="noreferrer">${label}</a>`).join('')}
        </div>
      `;
    }

    function inputControl(flow, input) {
      const value = getInput(flow, input.key);
      if (input.type === 'segment') {
        return `
          <div class="field">
            <label>${input.label}</label>
            <div class="segment-row">
              ${input.options.map((option) => `<button class="segment ${value === option ? 'active' : ''}" type="button" data-input="${input.key}" data-value="${option}">${option}</button>`).join('')}
            </div>
          </div>
        `;
      }
      if (input.type === 'weekday') {
        return `
          <div class="field">
            <label>${input.label}</label>
            <div class="weekday-row">
              ${input.options.map((option) => `<button class="weekday ${value.includes(option) ? 'active' : ''}" type="button" data-weekday="${input.key}" data-value="${option}">${option}</button>`).join('')}
            </div>
          </div>
        `;
      }
      if (input.type === 'select') {
        return `
          <div class="field">
            <label for="${flow.id}-${input.key}">${input.label}</label>
            <select id="${flow.id}-${input.key}" data-field="${input.key}">
              ${input.options.map(([optionValue, label]) => `<option value="${optionValue}" ${value === optionValue ? 'selected' : ''}>${label}</option>`).join('')}
            </select>
          </div>
        `;
      }
      return `
        <div class="field">
          <label for="${flow.id}-${input.key}">${input.label}</label>
          <input id="${flow.id}-${input.key}" data-field="${input.key}" type="${input.type}" value="${value || ''}" />
        </div>
      `;
    }

    function renderSetup(flow) {
      const currentState = state[flow.id];
      document.querySelector('#setup-card').innerHTML = `
        <p class="label">저장 설정</p>
        <div class="input-grid">${flow.inputs.map((input) => inputControl(flow, input)).join('')}</div>
        <div class="button-row" style="margin-top:12px">
          <button class="primary" type="button" id="save-flow">${flow.saveLabel}</button>
          <button class="secondary" type="button" id="copy-flow">메모/URL 복사</button>
        </div>
        <p class="toast ${currentState.toast ? 'show' : ''}" id="save-toast" role="status">${currentState.toast || '저장되었습니다.'}</p>
      `;
      document.querySelectorAll('[data-field]').forEach((input) => {
        input.addEventListener('input', () => {
          currentState.inputs[input.dataset.field] = input.value;
          render();
        });
      });
      document.querySelectorAll('[data-input]').forEach((button) => {
        button.addEventListener('click', () => {
          currentState.inputs[button.dataset.input] = button.dataset.value;
          render();
        });
      });
      document.querySelectorAll('[data-weekday]').forEach((button) => {
        button.addEventListener('click', () => {
          const key = button.dataset.weekday;
          const day = button.dataset.value;
          const list = currentState.inputs[key];
          currentState.inputs[key] = list.includes(day) ? list.filter((item) => item !== day) : [...list, day];
          if (currentState.inputs[key].length === 0) currentState.inputs[key] = [day];
          render();
        });
      });
      document.querySelector('#save-flow').addEventListener('click', () => {
        currentState.saved = true;
        currentState.toast = `${flow.saveLabel.replace(' 만들기', '')}가 저장되었습니다.`;
        currentState.view = 'run';
        currentState.stage = flow.stages[0].key;
        currentState.calendarDate = stageDate(flow, flow.stages[0]);
        currentState.calendarMonth = monthKey(currentState.calendarDate);
        render();
      });
      document.querySelector('#copy-flow').addEventListener('click', () => {
        currentState.toast = '제목, 상세 설명, URL을 메모 형식으로 복사했습니다.';
        render();
      });
    }

    function renderTabs(flow) {
      const tabs = [
        ['run', flow.primaryTab],
        ['all', '전체 보기'],
        ['next', flow.nextLabel]
      ];
      document.querySelector('#view-tabs').innerHTML = tabs.map(([key, label]) => `
        <button class="tab ${state[flow.id].view === key ? 'active' : ''}" type="button" data-view="${key}">${label}</button>
      `).join('');
      document.querySelectorAll('[data-view]').forEach((button) => {
        button.addEventListener('click', () => {
          state[flow.id].view = button.dataset.view;
          render();
        });
      });
    }

    function renderTime(flow) {
      const stateForFlow = state[flow.id];
      document.querySelector('#time-card').innerHTML = `
        <p class="label">실행 지점</p>
        <div class="time-row">
          ${flow.stages.map((stage) => {
            const date = stageDate(flow, stage);
            return `
              <button class="time-button ${stateForFlow.stage === stage.key ? 'active' : ''}" type="button" data-stage="${stage.key}">
                ${stage.key}
                <span>${date ? shortDate(date) : '날짜 없음'}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
      document.querySelectorAll('[data-stage]').forEach((button) => {
        button.addEventListener('click', () => {
          setActiveStage(flow, button.dataset.stage);
          render();
        });
      });
    }

    function renderRunCard(flow) {
      const stateForFlow = state[flow.id];
      const stage = activeStage(flow);
      const date = stageDate(flow, stage);
      const done = stageDone(flow, stage);
      const status = stateForFlow.status[stage.key] || '';
      document.querySelector('#run-card').innerHTML = `
        <p class="label">현재 실행</p>
        <h3>${stage.title}</h3>
        <p class="desc">${dateLabel(date)} · ${stage.key} · ${done}/${stage.tasks.length} 완료</p>
        <div class="progress" aria-label="진행률"><span style="--value:${Math.round((done / stage.tasks.length) * 100)}%"></span></div>
        <ul class="task-list">
          ${stage.tasks.map((task, index) => {
            const key = checkKey(stage, index);
            const checked = !!stateForFlow.checks[key];
            const title = taskTitle(task);
            const note = taskNote(task);
            return `
              <li class="task ${checked ? 'done' : ''}">
                <input type="checkbox" data-check="${key}" ${checked ? 'checked' : ''} aria-label="${title}" />
                <div><strong>${title}</strong>${note ? `<span>${note}</span>` : ''}</div>
              </li>
            `;
          }).join('')}
        </ul>
        ${flow.stateActions ? `
          <div class="state-row">
            ${flow.stateActions.map((action) => `<button class="state-button ${status === action ? 'active' : ''}" type="button" data-status="${action}">${action}</button>`).join('')}
          </div>
        ` : ''}
        <div class="field" style="margin-top:12px">
          <label for="stage-memo">${flow.memoLabel}</label>
          <textarea id="stage-memo" placeholder="필요한 내용만 짧게 남기기">${stateForFlow.memos[stage.key] || ''}</textarea>
        </div>
      `;
      bindRunControls(flow);
    }

    function renderAllCard(flow) {
      const stateForFlow = state[flow.id];
      document.querySelector('#run-card').innerHTML = `
        <p class="label">전체 보기</p>
        <h3>${flow.title} 전체 항목</h3>
        <p class="desc">각 날짜나 회차를 눌러 해당 실행 카드로 이동할 수 있습니다.</p>
      `;
      document.querySelector('#secondary-panel').innerHTML = `
        <section class="all-card">
          ${flow.stages.map((stage) => {
            const done = stageDone(flow, stage);
            return `
              <article class="all-stage">
                <div class="chips" style="margin-top:0">
                  <span class="chip blue">${stage.key}</span>
                  <span class="chip">${dateLabel(stageDate(flow, stage))}</span>
                  <span class="chip green">${done}/${stage.tasks.length} 완료</span>
                </div>
                <h4>${stage.title}</h4>
                <ul class="task-list">
                  ${stage.tasks.map((task, index) => {
                    const key = checkKey(stage, index);
                    const checked = !!stateForFlow.checks[key];
                    const title = taskTitle(task);
                    const note = taskNote(task);
                    return `
                      <li class="task ${checked ? 'done' : ''}">
                        <input type="checkbox" data-check="${key}" ${checked ? 'checked' : ''} aria-label="${title}" />
                        <div><strong>${title}</strong>${note ? `<span>${note}</span>` : ''}</div>
                      </li>
                    `;
                  }).join('')}
                </ul>
                <div class="button-row" style="margin-top:10px">
                  <button class="secondary" type="button" data-jump="${stage.key}">이 지점 열기</button>
                </div>
              </article>
            `;
          }).join('')}
        </section>
      `;
      bindRunControls(flow);
      document.querySelectorAll('[data-jump]').forEach((button) => {
        button.addEventListener('click', () => {
          setActiveStage(flow, button.dataset.jump);
          render();
        });
      });
    }

    function renderNextCard(flow) {
      const stateForFlow = state[flow.id];
      const current = activeStage(flow);
      const next = nextStage(flow);
      document.querySelector('#run-card').innerHTML = `
        <p class="label">${flow.nextLabel}</p>
        <h3>${next.title}</h3>
        <p class="desc">${dateLabel(stageDate(flow, next))}</p>
        <div class="copy-box">이전 지점: ${current.key} · 현재 완료 ${flowDone(flow)}/${flowTotal(flow)}개</div>
        <div class="button-row" style="margin-top:12px">
          <button class="primary" type="button" id="go-next">${flow.nextLabel} 열기</button>
          <button class="secondary" type="button" id="copy-next">다음 항목 메모로 복사</button>
        </div>
      `;
      document.querySelector('#secondary-panel').innerHTML = `
        <section class="next-card">
          <h3>다음 실행 메모</h3>
          <ul class="task-list">
            <li class="task"><span></span><div><strong>다음 항목</strong><span>${next.title}</span></div></li>
            <li class="task"><span></span><div><strong>상세 설명</strong><span>${next.detail}</span></div></li>
            <li class="task"><span></span><div><strong>남겨둔 메모</strong><span>${stateForFlow.memos[current.key] || '아직 메모 없음'}</span></div></li>
          </ul>
        </section>
      `;
      document.querySelector('#go-next').addEventListener('click', () => {
        setActiveStage(flow, next.key);
        render();
      });
      document.querySelector('#copy-next').addEventListener('click', () => {
        stateForFlow.toast = '다음 action과 상세 설명을 메모로 복사했습니다.';
        render();
      });
    }

    function bindRunControls(flow) {
      const stateForFlow = state[flow.id];
      document.querySelectorAll('[data-check]').forEach((input) => {
        input.addEventListener('change', () => {
          stateForFlow.checks[input.dataset.check] = input.checked;
          render();
        });
      });
      document.querySelectorAll('[data-status]').forEach((button) => {
        button.addEventListener('click', () => {
          stateForFlow.status[activeStage(flow).key] = button.dataset.status;
          render();
        });
      });
      const memo = document.querySelector('#stage-memo');
      if (memo) {
        memo.addEventListener('input', () => {
          stateForFlow.memos[activeStage(flow).key] = memo.value;
        });
      }
    }

    function datedStages(flow) {
      return flow.stages
        .map((stage) => ({ stage, date: stageDate(flow, stage) }))
        .filter((entry) => entry.date)
        .sort((a, b) => a.date.localeCompare(b.date) || flow.stages.indexOf(a.stage) - flow.stages.indexOf(b.stage));
    }

    function renderCalendar(flow) {
      const stateForFlow = state[flow.id];
      const entries = datedStages(flow);
      const selected = activeStage(flow);
      const selectedDate = stageDate(flow, selected);
      if (!entries.length) {
        document.querySelector('#calendar-card').innerHTML = `
          <p class="label">저장 위치</p>
          <h3>날짜 없이 저장됨</h3>
          <p class="desc">먼저 버킷에 저장하고, 나중에 날짜를 정하면 캘린더 미리보기가 생깁니다.</p>
          <div class="button-row" style="margin-top:10px"><button class="primary" type="button" id="focus-date">날짜 정하기</button></div>
        `;
        const focus = document.querySelector('#focus-date');
        if (focus) {
          focus.addEventListener('click', () => {
            const input = document.querySelector(`[data-field="${flow.anchorKey}"]`);
            if (input) input.focus();
          });
        }
        return;
      }

      const entryDates = entries.map((entry) => entry.date);
      let resetCalendarDate = false;
      if (!stateForFlow.calendarDate || !entryDates.includes(stateForFlow.calendarDate)) {
        stateForFlow.calendarDate = selectedDate || entries[0].date;
        resetCalendarDate = true;
      }
      if (!stateForFlow.calendarMonth || resetCalendarDate) {
        stateForFlow.calendarMonth = monthKey(stateForFlow.calendarDate);
      }

      const base = new Date(`${stateForFlow.calendarMonth}-01T00:00:00`);
      const year = base.getFullYear();
      const month = base.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const selectedDateEntries = entries.filter((entry) => entry.date === stateForFlow.calendarDate);
      const cells = [];
      for (let i = 0; i < firstDay.getDay(); i += 1) cells.push({ empty: true });
      for (let day = 1; day <= lastDay.getDate(); day += 1) {
        const date = `${year}-${pad(month + 1)}-${pad(day)}`;
        cells.push({
          date,
          day,
          entries: entries.filter((entry) => entry.date === date)
        });
      }
      while (cells.length % 7 !== 0) cells.push({ empty: true });

      document.querySelector('#calendar-card').innerHTML = `
        <p class="label">캘린더 미리보기</p>
        <div class="calendar-head">
          <div>
            <h3>${year}년 ${month + 1}월</h3>
            <p class="desc">날짜에 항목이 여러 개 있으면 아래에서 하나를 고릅니다.</p>
          </div>
          <div class="month-nav" aria-label="달 이동">
            <button class="month-button" type="button" data-month-shift="-1">이전</button>
            <button class="month-button" type="button" data-month-shift="1">다음</button>
          </div>
        </div>
        <div class="calendar-grid">
          ${['일', '월', '화', '수', '목', '금', '토'].map((day) => `<div class="weekday-label">${day}</div>`).join('')}
          ${cells.map((cell) => {
            if (cell.empty) return '<div class="day empty"></div>';
            const hasEvent = cell.entries.length > 0;
            const isActive = cell.date === stateForFlow.calendarDate;
            return `
              <button class="day ${hasEvent ? 'has-event' : ''} ${isActive ? 'active' : ''}" type="button" ${hasEvent ? `data-calendar-date="${cell.date}"` : ''}>
                ${cell.day}
                ${cell.entries.map((entry) => `<div class="event-chip">${entry.stage.key}</div>`).join('')}
              </button>
            `;
          }).join('')}
        </div>
        <div class="date-agenda">
          <p class="label">${dateLabel(stateForFlow.calendarDate)} 항목</p>
          <div class="agenda-list">
            ${selectedDateEntries.map((entry) => `
              <button class="agenda-item ${entry.stage.key === selected.key ? 'active' : ''}" type="button" data-calendar-stage="${entry.stage.key}">
                <b>${entry.stage.key} · ${entry.stage.title}</b>
                <span>${stageDone(flow, entry.stage)}/${entry.stage.tasks.length} 완료</span>
              </button>
            `).join('') || '<div class="copy-box">이 날짜에는 실행 항목이 없습니다.</div>'}
          </div>
        </div>
        <div class="schedule-strip">
          <p class="label">전체 일정</p>
          <div class="schedule-list">
            ${entries.map((entry) => `
              <button class="schedule-item ${entry.stage.key === selected.key ? 'active' : ''}" type="button" data-timeline-stage="${entry.stage.key}">
                <b>${entry.stage.key} · ${shortDate(entry.date)}</b>
                <span>${entry.stage.title}</span>
              </button>
            `).join('')}
          </div>
        </div>
        <div class="button-row" style="margin-top:12px">
          <button class="primary" type="button" id="export-flow">${flow.exportLabel}</button>
          <button class="secondary" type="button" id="copy-current">현재 설명 복사</button>
        </div>
      `;
      document.querySelectorAll('[data-month-shift]').forEach((button) => {
        button.addEventListener('click', () => {
          stateForFlow.calendarMonth = shiftMonth(stateForFlow.calendarMonth, Number(button.dataset.monthShift));
          render();
        });
      });
      document.querySelectorAll('[data-calendar-date]').forEach((button) => {
        button.addEventListener('click', () => {
          const dateEntries = entries.filter((entry) => entry.date === button.dataset.calendarDate);
          stateForFlow.calendarDate = button.dataset.calendarDate;
          if (dateEntries.length === 1) setActiveStage(flow, dateEntries[0].stage.key);
          render();
        });
      });
      document.querySelectorAll('[data-calendar-stage], [data-timeline-stage]').forEach((button) => {
        button.addEventListener('click', () => {
          setActiveStage(flow, button.dataset.calendarStage || button.dataset.timelineStage);
          render();
        });
      });
      document.querySelector('#export-flow').addEventListener('click', () => {
        stateForFlow.toast = `${flow.exportLabel} 항목을 준비했습니다.`;
        render();
      });
      document.querySelector('#copy-current').addEventListener('click', () => {
        stateForFlow.toast = '현재 action의 상세 설명과 URL을 복사했습니다.';
        render();
      });
    }

    function renderSecondary(flow) {
      const stage = activeStage(flow);
      const links = [...(stage.links || []), ...flow.sources.slice(0, 2)];
      document.querySelector('#secondary-panel').innerHTML = `
        <section class="detail-card">
          <p class="label">설명 / URL / 선택 상세</p>
          <h3>${stage.title}</h3>
          <p class="desc">${stage.detail}</p>
          ${flow.caution ? `<div class="warning-box">${flow.caution}</div>` : ''}
          <div class="detail-links">
            ${links.map(([label, href]) => `<a href="${href}" target="_blank" rel="noreferrer">${label}</a>`).join('')}
          </div>
        </section>
      `;
    }

    function renderView(flow) {
      if (state[flow.id].view === 'all') {
        renderAllCard(flow);
        return;
      }
      if (state[flow.id].view === 'next') {
        renderNextCard(flow);
        return;
      }
      renderRunCard(flow);
      renderSecondary(flow);
    }

    function render() {
      const flow = activeFlow();
      renderNav();
      renderHeader(flow);
      renderSource(flow);
      renderSetup(flow);
      renderTabs(flow);
      renderTime(flow);
      renderCalendar(flow);
      renderView(flow);
    }

    document.querySelector('#reset-flow').addEventListener('click', () => {
      const flow = activeFlow();
      state[flow.id].saved = false;
      state[flow.id].view = 'run';
      state[flow.id].stage = flow.stages[0].key;
      state[flow.id].checks = {};
      state[flow.id].memos = {};
      state[flow.id].status = {};
      state[flow.id].toast = '현재 Flow를 초기화했습니다.';
      render();
    });

    render();
  </script>
</body>
</html>
