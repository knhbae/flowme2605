<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>내 Flow 저장 후 실행 v4</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --soft: #f1f5f9;
      --line: #d9e2ef;
      --line-strong: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #0f766e;
      --green-soft: #ecfdf5;
      --amber: #b45309;
      --amber-soft: #fff7ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); letter-spacing: 0; }
    button, input, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    .app { width: min(100% - 24px, 1040px); margin: 0 auto; padding: 14px 0 46px; }
    .shell { display: grid; gap: 12px; }
    .top, .panel, .detail, .row, .flow-card, .check, .fallback, .state-bar, .search {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 12px 28px rgba(15, 23, 42, .06);
    }
    .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 18px; align-items: start; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 5px; font-size: 32px; line-height: 1.12; letter-spacing: 0; }
    h2 { margin-bottom: 6px; font-size: 21px; line-height: 1.24; letter-spacing: 0; }
    h3 { margin-bottom: 4px; font-size: 18px; line-height: 1.3; letter-spacing: 0; }
    p { color: var(--muted); font-size: 14px; font-weight: 720; line-height: 1.55; }
    .eyebrow { margin-bottom: 5px; color: var(--blue); font-size: 13px; font-weight: 950; }
    .summary { min-width: 190px; border-radius: 11px; background: var(--soft); padding: 12px; }
    .summary b, .summary span { display: block; }
    .summary b { font-size: 18px; }
    .summary span { margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 850; line-height: 1.4; }
    .state-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; box-shadow: none; background: var(--soft); }
    .state-bar button {
      min-height: 40px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #334155;
      font-size: 13px;
      font-weight: 950;
    }
    .state-bar button.active { background: var(--blue); color: #ffffff; }
    .panel { padding: 16px; }
    .panel-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .layout { display: grid; grid-template-columns: minmax(0, .9fr) minmax(330px, 1.1fr); gap: 12px; padding-top: 12px; align-items: start; }
    .layout.single { grid-template-columns: 1fr; }
    .stack { display: grid; gap: 9px; }
    .section-title { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 7px; font-size: 13px; font-weight: 950; }
    .section-title span { color: var(--muted); font-size: 12px; }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 11px;
      text-align: left;
      box-shadow: none;
    }
    .row.active { border-color: #bfdbfe; background: var(--blue-soft); box-shadow: inset 0 0 0 1px #bfdbfe; }
    .row-main { min-width: 0; border: 0; background: transparent; padding: 0; text-align: left; color: inherit; }
    .row-main b, .row-main span { display: block; }
    .row-main b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; line-height: 1.35; }
    .row-main span { margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 820; line-height: 1.35; }
    .quick-check {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: transparent;
      font-weight: 950;
    }
    .quick-check.done { border-color: var(--green); background: var(--green); color: #ffffff; }
    .detail { position: sticky; top: 12px; padding: 14px; box-shadow: none; }
    .detail-top { display: flex; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      width: fit-content;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      padding: 4px 9px;
      color: #334155;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    .chip.blue { border-color: #bfdbfe; background: var(--blue-soft); color: #1d4ed8; }
    .chip.green { border-color: #99f6e4; background: var(--green-soft); color: var(--green); }
    .chip.amber { border-color: #fed7aa; background: var(--amber-soft); color: var(--amber); }
    .checks { display: grid; gap: 8px; margin-top: 10px; }
    .check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 11px; box-shadow: none; }
    .check.done { border-color: #bbf7d0; background: var(--green-soft); }
    .check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--blue); }
    .check b, .check span { display: block; }
    .check b { font-size: 14px; line-height: 1.35; }
    .check span span { margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 780; line-height: 1.42; }
    .memo { display: grid; gap: 6px; margin-top: 10px; }
    .memo label { color: #334155; font-size: 13px; font-weight: 950; }
    textarea, input[type="search"] {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #ffffff;
      padding: 10px;
      color: var(--text);
      line-height: 1.55;
    }
    textarea { min-height: 96px; resize: vertical; }
    .detail-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .small-check, .secondary {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #ffffff;
      padding: 8px 11px;
      color: #334155;
      font-size: 13px;
      font-weight: 950;
    }
    .small-check { display: inline-flex; align-items: center; gap: 7px; }
    .small-check::before {
      content: "";
      width: 16px;
      height: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #ffffff;
    }
    .small-check.done { border-color: #99f6e4; background: var(--green-soft); color: var(--green); }
    .small-check.done::before {
      content: "✓";
      display: inline-grid;
      place-items: center;
      border-color: var(--green);
      background: var(--green);
      color: #ffffff;
      font-size: 11px;
    }
    .fallback { margin-top: 10px; padding: 11px; background: var(--soft); box-shadow: none; }
    .fallback summary { color: #334155; font-size: 13px; font-weight: 950; cursor: pointer; }
    .fallback pre { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; color: #475569; font: inherit; font-size: 12px; line-height: 1.5; }
    .library { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .library.open { display: grid; gap: 9px; }
    .search { padding: 10px; background: var(--soft); box-shadow: none; }
    .flow-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .flow-card { display: grid; gap: 5px; padding: 11px; text-align: left; box-shadow: none; }
    .flow-card b, .flow-card span { display: block; }
    .flow-card b { font-size: 14px; line-height: 1.32; }
    .flow-card span { color: var(--muted); font-size: 12px; font-weight: 800; line-height: 1.35; }
    .empty { border: 1px dashed #cbd5e1; border-radius: 11px; padding: 14px; color: var(--muted); font-size: 13px; font-weight: 820; }
    .hidden { display: none !important; }
    @media (max-width: 820px) {
      .app { width: min(100% - 20px, 720px); padding-top: 10px; }
      .top, .layout, .layout.single { grid-template-columns: 1fr; }
      .summary { min-width: 0; }
      .panel-head, .detail-top { display: grid; }
      .detail { position: static; }
      .flow-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      h1 { font-size: 29px; }
      h2 { font-size: 20px; }
      .top, .panel { padding: 14px; }
      .state-bar { grid-template-columns: 1fr; }
      .row { grid-template-columns: minmax(0, 1fr) auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <header class="top">
        <div>
          <p class="eyebrow">내 실행 공간</p>
          <h1>내 Flow</h1>
          <p id="heroCopy">오늘 할 일만 먼저 보고, 필요한 Flow는 접어 둡니다.</p>
        </div>
        <aside class="summary" aria-live="polite">
          <b id="summaryTitle">오늘 3개</b>
          <span id="summaryMeta">저장한 Flow 4개</span>
          <span id="summaryHint">항목을 열어 체크와 메모를 남깁니다.</span>
        </aside>
      </header>

      <nav class="state-bar" aria-label="저장 상태 보기">
        <button class="active" type="button" data-scenario="single">1개 저장</button>
        <button type="button" data-scenario="few">4개 저장</button>
        <button type="button" data-scenario="many">8개 저장</button>
      </nav>

      <section class="panel" aria-labelledby="screenTitle">
        <div class="panel-head">
          <div>
            <p class="eyebrow" id="screenKicker">오늘</p>
            <h2 id="screenTitle">먼저 할 일</h2>
            <p id="screenCopy">저장한 Flow 중 오늘 확인할 항목만 보여줍니다.</p>
          </div>
          <button class="secondary" type="button" id="toggleLibrary">Flow 찾기</button>
        </div>

        <div class="layout" id="mainLayout">
          <div class="stack" id="leftPane">
            <div>
              <div class="section-title">
                <b>오늘 할 일</b>
                <span id="todayCount">3개</span>
              </div>
              <div class="stack" id="todayList"></div>
            </div>

            <div id="nextBlock">
              <div class="section-title">
                <b>다음 항목</b>
                <span id="nextCount">4개</span>
              </div>
              <div class="stack" id="nextList"></div>
            </div>

            <div class="library" id="libraryPanel">
              <div class="section-title">
                <b>저장한 Flow</b>
                <span id="libraryCount">8개</span>
              </div>
              <div class="search">
                <input id="searchInput" type="search" placeholder="Flow나 항목 검색" aria-label="저장한 Flow 검색" />
              </div>
              <div class="flow-grid" id="libraryList"></div>
            </div>
          </div>

          <article class="detail" aria-labelledby="detailTitle">
            <div class="detail-top">
              <div>
                <p class="eyebrow" id="detailKicker">실행 항목</p>
                <h3 id="detailTitle">계약 전 서류 확인</h3>
                <p id="detailMeta">전세계약 전 서류 체크 · D-3</p>
              </div>
              <span class="chip blue" id="detailStatus">오늘</span>
            </div>

            <div class="checks" id="checkList"></div>

            <div class="memo">
              <label for="memoInput">메모</label>
              <textarea id="memoInput" placeholder="확인한 내용, 다시 볼 링크, 보류 이유만 짧게 남기기"></textarea>
            </div>

            <div class="detail-actions" id="detailActions">
              <button class="small-check" type="button" id="completeButton" aria-label="완료 체크">완료</button>
            </div>

            <details class="fallback">
              <summary>다른 앱에 붙일 텍스트</summary>
              <pre id="fallbackText"></pre>
            </details>
          </article>
        </div>
      </section>
    </div>
  </main>

  <script>
    const flows = [
      { id: 'jeonse', name: '전세계약 전 서류 체크', category: '전세', nextId: 'jeonse-docs' },
      { id: 'move', name: '이사 D-30 준비', category: '이사', nextId: 'move-quote' },
      { id: 'math', name: '중1 수학 학습 지도', category: '수학', child: '정수와 유리수', nextId: 'math-lesson' },
      { id: 'workout', name: '초보 홈트 영상 루틴', category: '루틴', nextId: 'workout-session' },
      { id: 'passport', name: '온라인 여권 재발급', category: '행정', nextId: 'passport-photo' },
      { id: 'baby', name: '영유아 건강검진 준비', category: '검진', nextId: 'baby-checkup' },
      { id: 'squishy', name: '무료 도안 스퀴시 만들기', category: '놀이', nextId: 'squishy-play' },
      { id: 'plant', name: '스투키 물주기', category: '식물', nextId: 'plant-water' }
    ];

    const entries = [
      {
        id: 'jeonse-docs',
        flowId: 'jeonse',
        flow: '전세계약 전 서류 체크',
        date: '오늘',
        status: 'today',
        title: '계약 전 서류 확인',
        meta: '시세, 등기부등본, 보증보험 가능 여부',
        source: '전세계약 전 서류 체크 Flow',
        checks: ['시세 확인', '등기부등본 확인', '전세보증보험 가능 여부 확인'],
        notes: ['주변 시세와 보증금 차이를 확인', '소유자와 근저당 등 권리관계 확인', '가능 여부와 필요한 서류 확인'],
        memo: '계약서 원문, 주민등록번호, 계좌번호는 저장하지 않음.'
      },
      {
        id: 'math-lesson',
        flowId: 'math',
        map: '중1 수학 학습 지도',
        flow: '정수와 유리수',
        date: '오늘',
        status: 'today',
        title: '정수와 유리수 10강',
        meta: 'EBS 강의 10강 · 교재 34-36쪽',
        source: 'EBS 중학 뉴런 수학1(상)',
        checks: ['원문 강의 열기', '교재 범위 풀기', '막힌 개념 메모'],
        notes: ['FlowMe에서는 진도와 메모만 남김', '원문에 있는 오늘 범위만 진행', '다음 복습 때 볼 내용만 짧게'],
        memo: ''
      },
      {
        id: 'workout-session',
        flowId: 'workout',
        flow: '초보 홈트 영상 루틴',
        date: '오늘 20:00',
        status: 'today',
        title: '원본 영상 한 번 따라하기',
        meta: '주 3회 · 통증이 있으면 중단',
        source: '초보 홈트 영상 링크',
        checks: ['영상 열기', '오늘 가능한 만큼 따라하기', '불편한 부위 메모'],
        notes: ['체크리스트 안에서 링크 확인', '무리하지 않고 영상 흐름만 따라감', '통증이면 중단하고 메모'],
        memo: ''
      },
      {
        id: 'move-quote',
        flowId: 'move',
        flow: '이사 D-30 준비',
        date: '2026.06.18',
        status: 'upcoming',
        title: '견적 3곳 요청하기',
        meta: '포장/반포장/일반 중 하나 선택',
        source: '이사 D-30 준비 Flow',
        checks: ['이사 방식 1개 선택', '견적 후보 2-3곳 열기', '예상 비용과 포함 범위 메모'],
        notes: ['포장/반포장/일반 중 선택', '업체명과 연락처만 메모', '추가비 가능성이 있는 항목만 남김'],
        memo: ''
      },
      {
        id: 'passport-photo',
        flowId: 'passport',
        flow: '온라인 여권 재발급',
        date: '2026.06.21',
        status: 'upcoming',
        title: '여권 사진 파일 준비하기',
        meta: '신청 링크와 사진 규격 확인',
        source: '정부24 여권 재발급 안내',
        checks: ['사진 파일 위치 메모', '신청 링크 열기', '수령 기관 메모'],
        notes: ['파일명이나 저장 위치만 짧게', '정부24 신청 페이지 확인', '방문할 기관만 기록'],
        memo: ''
      },
      {
        id: 'baby-checkup',
        flowId: 'baby',
        flow: '영유아 건강검진 준비',
        date: '2026.06.22',
        status: 'upcoming',
        title: '문진표 질문 메모 준비하기',
        meta: '방문 전 물어볼 질문 1-2개',
        source: '국민건강보험 영유아 검진 안내',
        checks: ['문진표 작성 여부 확인', '발달선별검사 여부 확인', '의료진에게 물어볼 질문 메모'],
        notes: ['공식 문진표 기준', '대상 월령에 해당할 때만', '판단은 병원에서 확인'],
        memo: ''
      },
      {
        id: 'squishy-play',
        flowId: 'squishy',
        flow: '무료 도안 스퀴시 만들기',
        date: '날짜 없음',
        status: 'later',
        title: '도안 출력하고 준비물 챙기기',
        meta: '도안 URL과 준비물',
        source: '무료 도안 원문 링크',
        checks: ['도안 URL 열기', '원본 설명의 준비물 체크', '놀이 후 정리할 봉투 준비'],
        notes: ['원문 도안 링크 보기', '종이, 테이프, 솜 등', '완성 후 보관/정리'],
        memo: ''
      },
      {
        id: 'plant-water',
        flowId: 'plant',
        flow: '스투키 물주기',
        date: '최근 체크',
        status: 'later',
        title: '흙 상태 보고 물 줄지 결정하기',
        meta: '과습이면 미루기',
        source: '스투키 관리 원문 링크',
        checks: ['흙 마름 확인', '몸통 물러짐 확인', '다음 물줄 날짜 메모'],
        notes: ['겉흙보다 안쪽 마름 확인', '무름이 있으면 물주기 보류', '계절별 간격은 메모로 조정'],
        memo: ''
      }
    ];

    const scenarios = {
      single: ['jeonse-docs'],
      few: ['jeonse-docs', 'math-lesson', 'workout-session', 'move-quote'],
      many: entries.map((entry) => entry.id)
    };

    const state = {
      scenario: 'few',
      selectedId: 'jeonse-docs',
      libraryOpen: false,
      query: '',
      checks: {},
      done: {},
      memos: {}
    };

    const $ = (id) => document.getElementById(id);
    const all = (selector) => Array.from(document.querySelectorAll(selector));

    function activeEntries() {
      return scenarios[state.scenario].map((id) => entries.find((entry) => entry.id === id));
    }

    function entryById(id) {
      return entries.find((entry) => entry.id === id) || entries[0];
    }

    function selectedEntry() {
      return entryById(state.selectedId);
    }

    function flowById(id) {
      return flows.find((flow) => flow.id === id) || flows[0];
    }

    function statusLabel(entry) {
      if (isDone(entry)) return '완료';
      if (entry.status === 'today') return '오늘';
      if (entry.status === 'upcoming') return '다음';
      return '보관';
    }

    function statusClass(entry) {
      if (isDone(entry)) return 'green';
      if (entry.status === 'today') return 'blue';
      if (entry.status === 'upcoming') return 'amber';
      return '';
    }

    function scopeLabel(entry) {
      return entry.map ? `${entry.map} · ${entry.flow}` : entry.flow;
    }

    function checkKey(entry, index) {
      return `${entry.id}:${index}`;
    }

    function checkProgress(entry) {
      const done = entry.checks.filter((_, index) => state.checks[checkKey(entry, index)]).length;
      return { done, total: entry.checks.length, complete: done === entry.checks.length };
    }

    function isDone(entry) {
      return Boolean(state.done[entry.id]) || checkProgress(entry).complete;
    }

    function visibleEntries(kind) {
      const list = activeEntries();
      if (kind === 'today') return list.filter((entry) => entry.status === 'today');
      if (kind === 'next') return list.filter((entry) => entry.status === 'upcoming');
      return list;
    }

    function fallbackText(entry) {
      const mark = isDone(entry) ? '[x]' : '[ ]';
      const memo = state.memos[entry.id] || entry.memo || '짧게 메모';
      const scope = entry.map ? `- 지도: ${entry.map}\n- Flow: ${entry.flow}` : `- Flow: ${entry.flow}`;
      return `${mark} ${entry.title}
${scope}
- ${entry.date} · ${entry.meta}
${entry.checks.map((check) => `- ${check}`).join('\n')}
- 메모: ${memo}
- 원문: ${entry.source}`;
    }

    function rowTemplate(entry) {
      const active = entry.id === state.selectedId ? 'active' : '';
      const done = isDone(entry);
      return `
        <article class="row ${active}">
          <button class="row-main" type="button" data-open="${entry.id}">
            <b>${entry.title}</b>
            <span>${scopeLabel(entry)} · ${entry.date}</span>
          </button>
          <button class="quick-check ${done ? 'done' : ''}" type="button" data-toggle="${entry.id}" aria-label="${done ? '완료 취소' : '완료 체크'}">${done ? '✓' : ''}</button>
        </article>
      `;
    }

    function renderSummary() {
      const list = activeEntries();
      const today = visibleEntries('today').length;
      const done = list.filter(isDone).length;
      $('summaryTitle').textContent = state.scenario === 'single' ? '저장한 Flow 1개' : `오늘 ${today}개`;
      $('summaryMeta').textContent = `저장한 Flow ${list.length}개 · 완료 ${done}개`;
      $('summaryHint').textContent = state.scenario === 'many'
        ? '많아지면 오늘 할 일과 Flow 찾기만 먼저 보입니다.'
        : '항목을 열어 체크와 메모를 남깁니다.';
      $('heroCopy').textContent = state.scenario === 'single'
        ? '하나만 저장했을 때는 관리 화면보다 실행 화면을 바로 엽니다.'
        : '오늘 할 일만 먼저 보고, 필요한 Flow는 접어 둡니다.';
    }

    function renderScenarioButtons() {
      all('[data-scenario]').forEach((button) => {
        button.classList.toggle('active', button.dataset.scenario === state.scenario);
      });
    }

    function renderLists() {
      const today = visibleEntries('today');
      const next = visibleEntries('next');
      $('todayCount').textContent = `${today.length}개`;
      $('todayList').innerHTML = today.map(rowTemplate).join('') || '<div class="empty">오늘 할 일이 없습니다.</div>';

      $('nextCount').textContent = `${next.length}개`;
      $('nextList').innerHTML = next.slice(0, state.scenario === 'many' ? 2 : 4).map(rowTemplate).join('') || '<div class="empty">다음 항목이 없습니다.</div>';
      $('nextBlock').classList.toggle('hidden', state.scenario === 'single');
      $('leftPane').classList.toggle('hidden', state.scenario === 'single');
      $('mainLayout').classList.toggle('single', state.scenario === 'single');
      $('toggleLibrary').classList.toggle('hidden', state.scenario === 'single');
    }

    function renderLibrary() {
      $('libraryPanel').classList.toggle('open', state.libraryOpen);
      $('toggleLibrary').textContent = state.libraryOpen ? 'Flow 찾기 닫기' : 'Flow 찾기';
      const list = activeEntries();
      $('libraryCount').textContent = `${list.length}개`;
      const query = state.query.trim().toLowerCase();
      const visible = list.filter((entry) => {
        const flow = flowById(entry.flowId);
        const text = `${flow.category} ${flow.name} ${flow.child || ''} ${entry.title} ${entry.meta}`.toLowerCase();
        return !query || text.includes(query);
      });
      $('libraryList').innerHTML = visible.map((entry) => {
        const flow = flowById(entry.flowId);
        return `
          <button class="flow-card ${entry.id === state.selectedId ? 'active' : ''}" type="button" data-open="${entry.id}">
            <span class="chip">${flow.category}</span>
            <b>${flow.name}</b>
            <span>${flow.child ? `${flow.child} · ` : ''}${entry.title}</span>
          </button>
        `;
      }).join('') || '<div class="empty">검색 결과가 없습니다.</div>';
    }

    function renderDetail() {
      const entry = selectedEntry();
      const done = isDone(entry);
      $('detailKicker').textContent = entry.map ? `${entry.map}에서 이어보기` : '실행 항목';
      $('detailTitle').textContent = entry.title;
      $('detailMeta').textContent = `${scopeLabel(entry)} · ${entry.date}`;
      $('detailStatus').textContent = statusLabel(entry);
      $('detailStatus').className = `chip ${statusClass(entry)}`;
      $('checkList').innerHTML = entry.checks.map((check, index) => {
        const key = checkKey(entry, index);
        const checked = Boolean(state.checks[key]);
        return `
          <label class="check ${checked ? 'done' : ''}">
            <input type="checkbox" data-check="${key}" ${checked ? 'checked' : ''} />
            <span><b>${check}</b><span>${entry.notes[index] || '필요하면 메모에 남깁니다.'}</span></span>
          </label>
        `;
      }).join('');
      $('memoInput').value = state.memos[entry.id] ?? entry.memo ?? '';
      $('completeButton').classList.toggle('done', done);
      $('completeButton').textContent = done ? '완료됨' : '완료';
      $('completeButton').setAttribute('aria-label', done ? '완료 취소' : '완료 체크');
      $('fallbackText').textContent = fallbackText(entry);
    }

    function setScenario(scenario) {
      state.scenario = scenario;
      const first = activeEntries()[0];
      state.selectedId = first.id;
      state.libraryOpen = false;
      state.query = '';
      render();
    }

    function toggleDone(id) {
      const entry = entryById(id);
      const next = !isDone(entry);
      state.done[id] = next;
      entry.checks.forEach((_, index) => {
        state.checks[checkKey(entry, index)] = next;
      });
      render();
    }

    function bindEvents() {
      all('[data-open]').forEach((button) => {
        button.addEventListener('click', () => {
          state.selectedId = button.dataset.open;
          render();
        });
      });
      all('[data-toggle]').forEach((button) => {
        button.addEventListener('click', () => toggleDone(button.dataset.toggle));
      });
      all('[data-check]').forEach((input) => {
        input.addEventListener('change', () => {
          state.checks[input.dataset.check] = input.checked;
          state.done[selectedEntry().id] = checkProgress(selectedEntry()).complete;
          render();
        });
      });
    }

    function render() {
      renderScenarioButtons();
      renderSummary();
      renderLists();
      renderLibrary();
      renderDetail();
      bindEvents();
    }

    all('[data-scenario]').forEach((button) => {
      button.addEventListener('click', () => setScenario(button.dataset.scenario));
    });

    $('toggleLibrary').addEventListener('click', () => {
      state.libraryOpen = !state.libraryOpen;
      render();
      if (state.libraryOpen) $('searchInput').focus();
    });

    $('searchInput').addEventListener('input', (event) => {
      state.query = event.target.value;
      renderLibrary();
      bindEvents();
    });

    $('memoInput').addEventListener('input', (event) => {
      state.memos[state.selectedId] = event.target.value;
      $('fallbackText').textContent = fallbackText(selectedEntry());
    });

    $('completeButton').addEventListener('click', () => toggleDone(state.selectedId));

    render();
  </script>
</body>
</html>
