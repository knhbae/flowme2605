<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>내 Flow</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --soft: #f8fafc;
      --line: #dbe4ef;
      --line-strong: #b8c7da;
      --text: #101827;
      --muted: #667085;
      --faint: #98a2b3;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #0f766e;
      --green-soft: #ecfdf5;
      --amber: #b45309;
      --amber-soft: #fffbeb;
      --purple: #6d28d9;
      --purple-soft: #f5f3ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      letter-spacing: 0;
    }
    button, input, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    a { color: var(--blue); text-underline-offset: 3px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 4px; font-size: clamp(30px, 7vw, 42px); line-height: 1.08; }
    h2 { margin-bottom: 4px; font-size: 21px; line-height: 1.25; }
    h3 { margin-bottom: 4px; font-size: 18px; line-height: 1.3; }
    p { margin-bottom: 0; color: var(--muted); font-size: 14px; font-weight: 700; }
    .app { width: min(760px, calc(100% - 24px)); margin: 0 auto; padding: 18px 0 56px; }
    .top, .tabs, .panel, .step, .detail, .item, .flow-card, .map-card, .calendar-note {
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      border-radius: 18px;
      padding: 18px;
    }
    .eyebrow { margin-bottom: 5px; color: var(--blue); font-size: 12px; font-weight: 950; }
    .summary {
      display: none;
      min-width: 118px;
      border-radius: 14px;
      background: var(--soft);
      padding: 12px;
      text-align: right;
    }
    .summary b, .summary span { display: block; }
    .summary b { font-size: 22px; line-height: 1.1; }
    .summary span { margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 850; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
      margin: 12px 0;
      border-radius: 16px;
      padding: 6px;
    }
    .tabs button {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
    }
    .tabs button.active { background: var(--blue-soft); color: var(--blue); box-shadow: inset 0 0 0 1px #bfdbfe; }
    .panel { display: none; border-radius: 18px; padding: 16px; }
    .panel.active { display: block; }
    .head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .count, .chip {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      padding: 4px 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    .chip.blue { border-color: #bfdbfe; background: var(--blue-soft); color: var(--blue); }
    .chip.green { border-color: #99f6e4; background: var(--green-soft); color: var(--green); }
    .chip.amber { border-color: #fed7aa; background: var(--amber-soft); color: var(--amber); }
    .chip.purple { border-color: #ddd6fe; background: var(--purple-soft); color: var(--purple); }
    .list { display: grid; gap: 10px; padding-top: 12px; }
    .step-wrap { display: grid; gap: 8px; }
    .step {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 66px;
      border-radius: 14px;
      padding: 12px;
      text-align: left;
      border-left: 4px solid #bfdbfe;
    }
    .step.active { border-color: #93c5fd; border-left-color: var(--blue); background: var(--blue-soft); }
    .step.done { border-left-color: var(--green); }
    .step button.main {
      min-width: 0;
      border: 0;
      background: transparent;
      padding: 0;
      text-align: left;
      color: inherit;
    }
    .step b, .step span { display: block; }
    .step b { margin-top: 6px; color: var(--text); font-size: 16px; line-height: 1.32; word-break: keep-all; }
    .step span.meta { margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 780; line-height: 1.38; }
    .quick {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      background: #fff;
      color: transparent;
      font-weight: 950;
    }
    .quick.done { border-color: #99f6e4; background: var(--green); color: #fff; }
    .detail {
      display: none;
      border-radius: 16px;
      background: #fbfdff;
      padding: 12px;
      border-left: 4px solid var(--green);
    }
    .detail.open { display: block; }
    .detail-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .detail-top p { font-size: 13px; }
    .facts {
      display: none;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .fact {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 9px;
    }
    .fact b, .fact span { display: block; }
    .fact b { color: var(--muted); font-size: 11px; font-weight: 950; }
    .fact span { margin-top: 3px; color: var(--text); font-size: 12px; font-weight: 900; }
    .source-link {
      display: inline-flex;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 900;
    }
    .items { display: grid; gap: 8px; margin-top: 12px; }
    .label { color: var(--muted); font-size: 12px; font-weight: 950; }
    .item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      border-radius: 13px;
      background: var(--surface);
      padding: 11px;
      box-shadow: none;
    }
    .item.done { border-color: #99f6e4; background: var(--green-soft); }
    .item input { width: 24px; height: 24px; margin-top: 1px; accent-color: var(--blue); }
    .item b, .item span span { display: block; }
    .item b { font-size: 14px; line-height: 1.35; }
    .item span span { margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 650; line-height: 1.42; }
    .memo { display: grid; gap: 7px; margin-top: 12px; }
    .memo label { color: var(--text); font-size: 13px; font-weight: 900; }
    textarea {
      width: 100%;
      min-height: 82px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #fff;
      padding: 10px 12px;
      resize: vertical;
    }
    textarea::placeholder { color: var(--faint); }
    details {
      display: none;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 10px;
    }
    summary { min-height: 32px; cursor: pointer; color: #344054; font-size: 13px; font-weight: 900; }
    pre { margin: 8px 0 0; white-space: pre-wrap; word-break: keep-all; color: var(--muted); font: inherit; font-size: 13px; line-height: 1.5; }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      margin-top: 12px;
    }
    .weekday {
      min-height: 28px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 950;
      text-align: center;
    }
    .day {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
      padding: 7px 6px;
      text-align: left;
      font-weight: 900;
    }
    .day.blank { border-color: transparent; background: transparent; pointer-events: none; }
    .day.has { color: var(--text); }
    .day.selected { border-color: #93c5fd; background: var(--blue-soft); color: var(--blue); }
    .day.today { box-shadow: inset 0 0 0 1px #bfdbfe; }
    .day span { display: block; color: var(--faint); font-size: 11px; font-weight: 900; }
    .day.has span { color: var(--blue); }
    .calendar-note {
      margin-top: 12px;
      border-radius: 14px;
      background: var(--soft);
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 780;
    }
    .flow-card, .map-card {
      border-radius: 14px;
      padding: 12px;
      box-shadow: none;
    }
    .flow-card { border-left: 5px solid var(--blue); }
    .map-card { border-left: 5px solid var(--amber); }
    .card-button {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      border: 0;
      background: transparent;
      padding: 0;
      text-align: left;
    }
    .card-button b, .card-button span { display: block; }
    .card-button b { margin-top: 6px; color: var(--text); font-size: 16px; line-height: 1.32; }
    .card-button span.meta { margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 780; line-height: 1.38; }
    .progress {
      display: none;
      height: 6px;
      margin-top: 10px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .progress i { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
    .substeps {
      display: none;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .flow-card.expanded .substeps, .map-card.expanded .substeps { display: grid; }
    .flow-card.expanded {
      border: 0;
      background: transparent;
      box-shadow: none;
      padding: 0;
    }
    .flow-card.expanded > .card-button {
      border: 1px solid var(--line);
      border-left: 5px solid var(--blue);
      border-radius: 14px;
      background: var(--surface);
      padding: 12px;
    }
    .flow-card.expanded .substeps {
      margin-top: 8px;
      padding-top: 0;
      border-top: 0;
    }
    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--soft);
    }
    .breadcrumb button {
      min-height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: #fff;
      padding: 5px 10px;
      color: var(--muted);
      font-weight: 900;
    }
    .breadcrumb b { color: var(--text); font-size: 13px; }
    .flow-card .count,
    .map-card .count { display: none; }
    @media (max-width: 540px) {
      .app { width: min(100% - 20px, 430px); padding-top: 12px; }
      .top { grid-template-columns: 1fr; padding: 16px; }
      .summary { width: 100%; text-align: left; }
      .panel { padding: 14px; border-radius: 16px; }
      .head, .detail-top { align-items: flex-start; }
      .tabs { gap: 4px; padding: 5px; }
      .tabs button { min-height: 42px; border-radius: 10px; font-size: 14px; }
      .facts { grid-template-columns: 1fr; }
      .day { min-height: 54px; padding: 6px 5px; }
      .card-button, .step { grid-template-columns: minmax(0, 1fr) auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow">실행 공간</p>
        <h1>내 Flow</h1>
        <p>저장한 콘텐츠를 오늘 할 일, 일정, Flow, 지도로 나눠 봅니다.</p>
      </div>
      <aside class="summary" aria-live="polite">
        <b id="todayStat">0개</b>
        <span id="savedStat">저장된 Flow</span>
      </aside>
    </header>

    <nav class="tabs" aria-label="내 Flow 보기">
      <button class="active" type="button" data-view="today">오늘</button>
      <button type="button" data-view="calendar">일정</button>
      <button type="button" data-view="flows">Flow</button>
      <button type="button" data-view="maps">지도</button>
    </nav>

    <section class="panel active" id="todayView" aria-labelledby="todayTitle">
      <div class="head">
        <div>
          <p class="eyebrow">오늘</p>
          <h2 id="todayTitle">먼저 할 일</h2>
        </div>
        <span class="count" id="todayCount">0개</span>
      </div>
      <div class="list" id="todayList"></div>
    </section>

    <section class="panel" id="calendarView" aria-labelledby="calendarTitle">
      <div class="head">
        <div>
          <p class="eyebrow">일정</p>
          <h2 id="calendarTitle">2026년 6월</h2>
        </div>
        <span class="count" id="calendarCount">0일</span>
      </div>
      <div class="calendar" id="calendarGrid" aria-label="2026년 6월 일정"></div>
      <div class="calendar-note" id="calendarNote">날짜를 누르면 그날의 Step만 보입니다.</div>
      <div class="list" id="calendarList"></div>
    </section>

    <section class="panel" id="flowsView" aria-labelledby="flowsTitle">
      <div class="head">
        <div>
          <p class="eyebrow">Flow</p>
          <h2 id="flowsTitle">저장한 Flow</h2>
        </div>
        <span class="count" id="flowsCount">0개</span>
      </div>
      <div class="list" id="flowList"></div>
    </section>

    <section class="panel" id="mapsView" aria-labelledby="mapsTitle">
      <div class="head">
        <div>
          <p class="eyebrow">지도</p>
          <h2 id="mapsTitle">묶어서 보는 Flow</h2>
        </div>
        <span class="count" id="mapsCount">0개</span>
      </div>
      <div class="list" id="mapList"></div>
    </section>
  </main>

    const flows = [

        steps: [

          }
        ]
      },
      {
        id: 'passport',
        name: '온라인 여권 재발급',
        type: '체크',
        source: '정부24 여권 재발급 안내',
        sourceUrl: 'https://www.gov.kr/portal/service/serviceInfo/126200000030',

    function allSteps() {
      return flows.flatMap((flow) => flow.steps.map((step) => ({ ...step, flowId: flow.id, mapId: flow.mapId || null })));
    }
    function flowById(id) { return flows.find((flow) => flow.id === id); }
    function mapById(id) { return maps.find((map) => map.id === id); }
    function flowsForMap(mapId) { return flows.filter((flow) => flow.mapId === mapId); }
    function standaloneFlows() { return flows.filter((flow) => !flow.mapId); }
    function stepById(id) { return allSteps().find((step) => step.id === id); }
    function isToday(step) { return step.date === '오늘' || step.date.includes('오늘'); }
    function dateKey(step) {
      if (isToday(step)) return '2026-06-22';
      const match = /^6\.(\d{1,2})$/.exec(step.date);
      if (!match) return null;
      return `2026-06-${match[1].padStart(2, '0')}`;
    }
    function dateLabel(key) { return `6.${Number(key.slice(-2))}`; }
    function scheduledSteps() { return allSteps().filter((step) => dateKey(step)); }
    function scheduledDateKeys() { return Array.from(new Set(scheduledSteps().map(dateKey))).sort(); }
    function stepsOnDate(key) { return scheduledSteps().filter((step) => dateKey(step) === key); }
    function checkKey(step, index) { return `${step.id}:${index}`; }
    function stepItems(step) { return step.items || []; }
    function isDone(step) {
      const items = stepItems(step);
      if (!items.length) return Boolean(state.done[step.id]);
      return items.every((_, index) => Boolean(state.checks[checkKey(step, index)]));
    }
    function stepProgress(step) {
      const items = stepItems(step);
      if (!items.length) return isDone(step) ? '완료' : '대기';
      const done = items.filter((_, index) => state.checks[checkKey(step, index)]).length;
      return `${done}/${items.length}`;
    }
    function progress(flow) {
      const steps = flow.steps.map((step) => ({ ...step, flowId: flow.id, mapId: flow.mapId || null }));
      const done = steps.filter(isDone).length;
      return { done, total: steps.length, pct: Math.round((done / Math.max(steps.length, 1)) * 100) };
    }
    function mapProgress(mapId) {
      const mapFlows = flowsForMap(mapId);
      const steps = mapFlows.flatMap((flow) => flow.steps.map((step) => ({ ...step, flowId: flow.id, mapId: flow.mapId })));
      const done = steps.filter(isDone).length;
      return { flows: mapFlows.length, done, total: steps.length, pct: Math.round((done / Math.max(steps.length, 1)) * 100) };
    }
    function stepContext(step) {
      const flow = flowById(step.flowId);
      const map = step.mapId ? mapById(step.mapId) : null;
      return map ? `${map.name} · ${flow.name}` : flow.name;
    }
    function destinationLabel(flow) {
      if (flow.type === '진도') return '진도';
      if (flow.type === '체크') return '투두';
      return '캘린더';
    }
    function fallbackText(step) {
      const flow = flowById(step.flowId);
      const items = stepItems(step);

        `[${isDone(step) ? 'x' : ' '}] ${step.title}`,
        `Flow: ${stepContext(step)}`,
        `일정: ${step.date}`,
        `원문: ${flow.source}`

        lines.push('확인할 것:');

      } else {

        return `

        <details>

          <pre>${fallbackText(step)}</pre>
        </details>
      `;
    }
    function rowStep(step, options = {}) {
      const done = isDone(step);
      const selected = state.selectedStep === step.id;
      const flow = flowById(step.flowId);
      const chip = done

      return `

          <article class="detail ${selected ? 'open' : ''}">
            ${selected ? detailMarkup(step) : ''}

      const step = stepById(stepId);

      const days = weekdays.map((day) => `<div class="weekday">${day}</div>`);
      days.push('<button class="day blank" type="button" tabindex="-1" aria-hidden="true"></button>');
      for (let day = 1; day <= 30; day += 1) {

        const count = counts[key] || 0;
        days.push(`

          ${childFlows.map((flow) => {
            const p = progress(flow);
            const next = flow.steps.map((step) => ({ ...step, flowId: flow.id, mapId: flow.mapId })).find((step) => !isDone(step)) || flow.steps[0];
            return `
              <article class="flow-card">
                <button class="card-button" type="button" data-expand-map-flow="${flow.id}">
                  <span>
                    <span class="chip purple">${flow.type}</span>
                    <b>${flow.name}</b>
                    <span class="meta">${p.done}/${p.total} 완료 · 다음: ${next.title}</span>
                  </span>
                  <span class="count">${p.total}개</span>
                </button>
                <div class="progress" aria-hidden="true"><i style="width:${p.pct}%"></i></div>
              </article>
            `;
          }).join('')}
        `;
        return;
      }

      const flow = flowById(state.expandedMapFlow);
      const p = progress(flow);
      $('mapList').innerHTML = `
        <div class="breadcrumb">
          <button type="button" data-map-back>지도</button>
          <button type="button" data-map-flow-back>${map.name}</button>
          <b>${flow.name}</b>
        </div>
        <article class="flow-card expanded">
          <button class="card-button" type="button" data-map-flow-back>
            <span>
              <span class="chip purple">${flow.type}</span>
              <b>${flow.name}</b>
              <span class="meta">${p.done}/${p.total} 완료</span>
            </span>
            <span class="count">${p.total}개</span>
          </button>
          <div class="progress" aria-hidden="true"><i style="width:${p.pct}%"></i></div>
          <div class="substeps">
            ${flow.steps.map((step) => rowStep({ ...step, flowId: flow.id, mapId: flow.mapId }, { showContext: false })).join('')}
          </div>
        </article>
      `;
    }
    function bind() {
      const bindOnce = (selector, eventName, handler) => {
        all(selector).forEach((element) => {
          if (element.dataset.bound) return;
          element.dataset.bound = 'true';
          element.addEventListener(eventName, handler);
        });
      };
      bindOnce('[data-view]', 'click', (event) => {
        state.view = event.currentTarget.dataset.view;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-open-step]', 'click', (event) => {
        const id = event.currentTarget.dataset.openStep;
        state.selectedStep = state.selectedStep === id ? null : id;
        render();
      });
      bindOnce('[data-quick]', 'click', (event) => {
        event.stopPropagation();
        toggleStep(event.currentTarget.dataset.quick);
      });
      bindOnce('[data-date]', 'click', (event) => {
        state.selectedDate = event.currentTarget.dataset.date;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-expand-flow]', 'click', (event) => {
        const id = event.currentTarget.dataset.expandFlow;
        state.expandedFlow = state.expandedFlow === id ? null : id;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-expand-map]', 'click', (event) => {
        state.expandedMap = event.currentTarget.dataset.expandMap;
        state.expandedMapFlow = null;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-expand-map-flow]', 'click', (event) => {
        const id = event.currentTarget.dataset.expandMapFlow;
        state.expandedMapFlow = state.expandedMapFlow === id ? null : id;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-map-back]', 'click', () => {
        state.expandedMap = null;
        state.expandedMapFlow = null;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-map-flow-back]', 'click', () => {
        state.expandedMapFlow = null;
        state.selectedStep = null;
        render();
      });
      bindOnce('[data-check]', 'change', (event) => {
        state.checks[event.currentTarget.dataset.check] = event.currentTarget.checked;
        render();
      });
      bindOnce('[data-step]', 'change', (event) => {
        state.done[event.currentTarget.dataset.step] = event.currentTarget.checked;
        render();
      });
      bindOnce('[data-memo]', 'input', (event) => {
        state.memos[event.currentTarget.dataset.memo] = event.currentTarget.value;
      });
    }
    function render() {
      renderSummary();
      renderNav();
      renderToday();
      renderCalendar();
      renderFlows();
      renderMaps();
      bind();
    }
    render();
  </script>
</body>
</html>
