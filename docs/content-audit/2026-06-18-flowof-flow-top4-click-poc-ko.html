<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowMe 실행 지도 4종 클릭 화면</title>
    <style>
      :root {
        --bg: #eef3f8;
        --panel: #ffffff;
        --soft: #f7fafc;
        --line: #d8e1eb;
        --line-strong: #b9c7d8;
        --text: #111827;
        --muted: #536174;
        --blue: #2563eb;
        --blue-soft: #eaf1ff;
        --green: #0f766e;
        --green-soft: #e8f6f3;
        --amber: #b45309;
        --amber-soft: #fff5df;
        --red: #b91c1c;
        --red-soft: #fff1f2;
        --shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      a {
        color: var(--blue);
        font-weight: 850;
      }

      .page {
        width: min(1160px, 100%);
        margin: 0 auto;
        padding: 16px;
      }

      .topbar,
      .hero,
      .card,
      .action-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        margin-bottom: 12px;
      }

      .brand {
        font-size: 22px;
        font-weight: 950;
      }

      .hero,
      .card,
      .action-card {
        padding: 16px;
      }

      .hero {
        margin-bottom: 12px;
      }

      .eyebrow,
      .label {
        margin: 0 0 8px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 950;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 10px;
        font-size: clamp(30px, 5vw, 46px);
        line-height: 1.08;
        letter-spacing: 0;
        word-break: keep-all;
      }

      h2 {
        margin-bottom: 10px;
        font-size: 23px;
        line-height: 1.24;
        letter-spacing: 0;
        word-break: keep-all;
      }

      h3 {
        margin-bottom: 8px;
        font-size: 17px;
        line-height: 1.35;
        letter-spacing: 0;
        word-break: keep-all;
      }

      .desc,
      .small,
      .top-note {
        color: var(--muted);
        line-height: 1.55;
      }

      .desc,
      .top-note {
        margin-bottom: 0;
      }

      .small {
        display: block;
        font-size: 13px;
      }

      .chips,
      .actions,
      .status-row,
      .timeline-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 6px 10px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--soft);
        color: #263346;
        font-size: 13px;
        font-weight: 850;
        line-height: 1.2;
      }

      .chip.blue { background: var(--blue-soft); border-color: #b8cdfb; color: #1d4ed8; }
      .chip.green { background: var(--green-soft); border-color: #b9ded8; color: var(--green); }
      .chip.amber { background: var(--amber-soft); border-color: #f5d393; color: var(--amber); }
      .chip.red { background: var(--red-soft); border-color: #fecdd3; color: var(--red); }

      .tabs {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 6px;
        background: #e7edf5;
        margin: 12px 0;
      }

      .tabs button {
        min-height: 46px;
        border: 0;
        border-radius: 11px;
        background: transparent;
        color: #334155;
        cursor: pointer;
        font-weight: 950;
      }

      .tabs button.active {
        background: #fff;
        color: var(--blue);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1.35fr);
        gap: 12px;
        align-items: start;
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label,
      .field label {
        color: #334155;
        font-size: 13px;
        font-weight: 950;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 11px;
        background: #fff;
        color: var(--text);
        padding: 11px 12px;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
        line-height: 1.5;
      }

      .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 44px;
        padding: 10px 13px;
        border: 1px solid var(--blue);
        border-radius: 12px;
        background: var(--blue);
        color: #fff;
        cursor: pointer;
        font-weight: 950;
        text-decoration: none;
      }

      .btn.secondary {
        background: #fff;
        color: var(--blue);
      }

      .btn.ghost {
        border-color: var(--line-strong);
        background: var(--soft);
        color: #334155;
      }

      .source-box,
      .note-box,
      .calendar-box,
      .toast {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--soft);
        padding: 12px;
        color: var(--muted);
        line-height: 1.55;
        font-size: 14px;
      }

      .source-box {
        border-left: 4px solid var(--blue);
        background: var(--blue-soft);
        color: #1e3a8a;
      }

      .toast {
        border-color: #b9ded8;
        background: var(--green-soft);
        color: var(--green);
        font-weight: 850;
      }

      .map-button,
      .check {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fff;
        color: var(--text);
        display: grid;
        gap: 10px;
        align-items: start;
        padding: 12px;
        text-align: left;
      }

      .map-button {
        grid-template-columns: auto minmax(0, 1fr) auto;
        cursor: pointer;
      }

      .map-button.active {
        border-color: var(--blue);
        background: var(--blue-soft);
      }

      .check {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .check input {
        width: 22px;
        height: 22px;
        margin-top: 1px;
        accent-color: var(--blue);
      }

      .check.done {
        border-color: #bbf7d0;
        background: #f0fdf4;
      }

      .check.done .item-title {
        color: var(--green);
      }

      .num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #e2e8f0;
        color: #334155;
        font-size: 13px;
        font-weight: 950;
      }

      .item-title {
        margin: 0;
        font-size: 15px;
        line-height: 1.35;
        font-weight: 950;
        word-break: keep-all;
      }

      .progress {
        height: 8px;
        border-radius: 999px;
        background: #e7edf5;
        overflow: hidden;
      }

      .progress span {
        display: block;
        height: 100%;
        width: var(--value, 0%);
        border-radius: inherit;
        background: var(--blue);
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin: 12px 0;
      }

      .status-box {
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--soft);
        padding: 10px;
      }

      .status-box b {
        display: block;
        margin-bottom: 4px;
        color: #263346;
        font-size: 13px;
      }

      .calendar-box {
        background: #fbfdff;
      }

      .date-pill {
        display: inline-flex;
        flex-direction: column;
        gap: 2px;
        min-width: 76px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        padding: 8px 10px;
      }

      .date-pill b {
        color: #263346;
        font-size: 13px;
      }

      .date-pill span {
        color: var(--muted);
        font-size: 12px;
      }

      details {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        padding: 12px;
      }

      summary {
        cursor: pointer;
        color: #263346;
        font-weight: 950;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.26);
        outline-offset: 2px;
      }

      @media (max-width: 820px) {
        .page { padding: 10px; }
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .hero,
        .card,
        .action-card {
          padding: 14px;
        }
        h1 { font-size: 30px; }
        .tabs {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .layout,
        .field-grid,
        .status-grid {
          grid-template-columns: 1fr;
        }
        .map-button {
          grid-template-columns: auto minmax(0, 1fr);
        }
        .map-button .chip {
          grid-column: 2;
          justify-self: start;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <nav class="topbar">
        <div class="brand">FlowMe</div>
        <p class="top-note">원문 묶음을 내 실행 지도와 하위 Flow로 저장해서, 지금 위치와 다음 실행 항목을 확인합니다.</p>
      </nav>

      <header class="hero">
        <p class="eyebrow">대표 실행 지도 4종</p>

        <div class="chips" style="margin-top:12px">
          <span class="chip blue">전체 저장</span>
          <span class="chip green">하위 Flow 실행</span>
          <span class="chip">체크와 메모</span>
          <span class="chip amber">원문 링크 보존</span>
        </div>
      </header>

      <nav class="tabs" aria-label="대표 콘텐츠">
        <button class="active" type="button" data-flow="computer">컴활</button>
        <button type="button" data-flow="running">5K</button>
        <button type="button" data-flow="web1">WEB1</button>
        <button type="button" data-flow="cdc">백신</button>
      </nav>

      <section class="layout">
        <aside class="card">
          <p class="eyebrow" id="sourceKind"></p>
          <h2 id="sourceTitle"></h2>
          <p class="desc" id="sourceDesc"></p>
          <div class="chips" id="flowChips" style="margin-top:12px"></div>

          <div class="field-grid" id="inputFields" style="margin-top:14px"></div>

          <div class="actions" style="margin-top:14px">
            <button class="btn" type="button" id="saveAll">전체 저장</button>
            <button class="btn secondary" type="button" id="saveSelected">현재 항목만 저장</button>
          </div>
          <div class="toast" id="toast" hidden style="margin-top:12px"></div>

          <div class="source-box" id="sourceBox" style="margin-top:12px"></div>

          <div style="margin-top:14px">
            <p class="label" id="mapLabel"></p>
            <div class="stack" id="childMap"></div>
          </div>
        </aside>

        <section class="action-card">
          <p class="eyebrow">내 Flow 실행</p>
          <h2 id="childTitle"></h2>
          <p class="desc" id="childDesc"></p>

          <div class="status-grid">
            <div class="status-box">
              <b>다음 항목</b>
              <span class="small" id="nextItem"></span>
            </div>
            <div class="status-box">
              <b>진행</b>
              <span class="small" id="progressText"></span>
            </div>
            <div class="status-box">
              <b>저장 위치</b>
              <span class="small" id="artifactText"></span>
            </div>
          </div>

          <div class="progress" aria-label="진행률">
            <span id="progressBar"></span>
          </div>

          <div class="calendar-box" id="timeBox" style="margin-top:12px"></div>

          <div class="stack" id="checkList" style="margin-top:12px"></div>

          <div class="note-box" style="margin-top:12px">
            <label for="memoBox" id="memoLabel">메모</label>
            <textarea id="memoBox" placeholder="막힌 지점, 다시 볼 항목, 확인한 URL만 짧게 남기기"></textarea>
          </div>

          <div class="actions" style="margin-top:12px">
            <a class="btn" id="childSource" href="#" target="_blank" rel="noreferrer">원문에서 보기</a>
            <button class="btn secondary" type="button" id="nextChild">다음 하위 Flow</button>
          </div>

          <details style="margin-top:12px">
            <summary>전체 지도 보기</summary>
            <div class="stack" id="fullMap" style="margin-top:10px"></div>
          </details>
        </section>
      </section>
    </main>

      const state = {
        activeFlow: "computer",
        childIndex: { computer: 0, running: 0, web1: 1, cdc: 1 },
        checks: {},
        notes: {},
        saved: {},
        inputValues: {}
      };

      const $ = (id) => document.getElementById(id);

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function activeData() {
        return sourceData[state.activeFlow];
      }

      function selectedChild() {
        const data = activeData();
        return data.children[state.childIndex[state.activeFlow]] || data.children[0];
      }

      function checkKey(child, itemIndex) {
        return `${state.activeFlow}:${child.title}:${itemIndex}`;
      }

      function doneCount(child) {
        return child.items.filter((_, index) => state.checks[checkKey(child, index)]).length;
      }

      function progressPct(child) {
        return Math.round((doneCount(child) / child.items.length) * 100);
      }

      function nextItem(child) {
        const index = child.items.findIndex((_, itemIndex) => !state.checks[checkKey(child, itemIndex)]);
        return index >= 0 ? child.items[index][0] : "이 하위 Flow 완료";
      }

      function currentInputValue(input) {
        return state.inputValues[`${state.activeFlow}:${input.id}`] || input.value;
      }

      function addDays(dateValue, days) {
        const date = new Date(`${dateValue}T00:00:00`);
        if (Number.isNaN(date.getTime())) return "";
        date.setDate(date.getDate() + days);
        return date.toISOString().slice(0, 10);
      }

      function renderTimeBox(data, child) {
        if (state.activeFlow === "running") {
          const start = currentInputValue(data.inputs[0]);
          const weekIndex = Math.max(0, data.children.indexOf(child));
          const base = weekIndex * 7;
          const dates = [base, base + 2, base + 5].map((offset, index) => `
            <span class="date-pill">
              <b>Run ${index + 1}</b>
              <span>${escapeHtml(addDays(start, offset))}</span>
            </span>
          `).join("");
          return `
            <p class="label">이번 하위 Flow 일정</p>
            <div class="timeline-row">${dates}</div>
          `;
        }

        if (state.activeFlow === "cdc") {
          return `
            <p class="label">방문 전 확인</p>
            <div class="timeline-row">
              <span class="chip red">의료 판단 아님</span>
              <span class="chip">원문 확인</span>
              <span class="chip">의료기관 일정 확인</span>
            </div>
          `;
        }

        if (state.activeFlow === "computer") {
          return `
            <p class="label">학습 기준</p>
            <div class="timeline-row">
              <span class="chip">시험 예정일 ${escapeHtml(currentInputValue(data.inputs[0]))}</span>
              <span class="chip">현재 과목 ${escapeHtml(child.title)}</span>
              <span class="chip amber">${escapeHtml(child.due)}</span>
            </div>
          `;
        }

        return `
          <p class="label">학습 기준</p>
          <div class="timeline-row">
            <span class="chip">시작일 ${escapeHtml(currentInputValue(data.inputs[0]))}</span>
            <span class="chip">페이스 ${escapeHtml(currentInputValue(data.inputs[1]))}</span>
            <span class="chip amber">${escapeHtml(child.due)}</span>
          </div>
        `;
      }

      function childButton(child, index) {
        const active = index === state.childIndex[state.activeFlow];
        const done = doneCount(child);
        const pct = Math.max(progressPct(child), done ? 12 : 4);
        return `
          <button class="map-button ${active ? "active" : ""}" type="button" data-child="${index}">
            <span class="num">${index + 1}</span>
            <span>
              <p class="item-title">${escapeHtml(child.title)}</p>
              <span class="small">${escapeHtml(child.desc)}</span>
              <span class="progress" style="display:block;margin-top:8px"><span style="--value:${pct}%"></span></span>
            </span>
            <span class="chip ${done ? "green" : active ? "blue" : ""}">${done}/${child.items.length}</span>
          </button>
        `;
      }

      function renderChecks(child) {
        return child.items.map((item, index) => {
          const checked = Boolean(state.checks[checkKey(child, index)]);
          return `
            <label class="check ${checked ? "done" : ""}">
              <input type="checkbox" data-check="${index}" ${checked ? "checked" : ""} />
              <span>
                <p class="item-title">${escapeHtml(item[0])}</p>
                <span class="small">${escapeHtml(item[1])}</span>
              </span>
            </label>
          `;
        }).join("");
      }

      function renderInputs(data) {
        return data.inputs.map((input) => `
          <div class="field">
            <label for="${input.id}">${escapeHtml(input.label)}</label>
            <input id="${input.id}" data-input="${input.id}" type="${input.type}" value="${escapeHtml(currentInputValue(input))}" />
          </div>
        `).join("");
      }

      function render() {
        const data = activeData();
        const child = selectedChild();
        const done = doneCount(child);
        const percent = Math.max(progressPct(child), done ? 12 : 4);
        const noteKey = `${state.activeFlow}:${child.title}`;

        document.querySelectorAll("[data-flow]").forEach((button) => {
          button.classList.toggle("active", button.dataset.flow === state.activeFlow);
        });

        $("sourceKind").textContent = data.kind;
        $("sourceTitle").textContent = data.title;
        $("sourceDesc").textContent = data.desc;
        $("flowChips").innerHTML = data.chips.map((chip, index) => `<span class="chip ${index === 0 ? "blue" : index === 1 ? "green" : ""}">${escapeHtml(chip)}</span>`).join("");
        $("inputFields").innerHTML = renderInputs(data);
        $("saveAll").textContent = `${data.title} 전체 저장`;
        $("saveSelected").textContent = `${child.title}만 저장`;
        $("sourceBox").innerHTML = `
          원문: <a href="${data.sourceUrl}" target="_blank" rel="noreferrer">${escapeHtml(data.sourceLabel)}</a>
          ${data.altSourceUrl ? `<br />대체 원문: <a href="${data.altSourceUrl}" target="_blank" rel="noreferrer">Darebee 30 Days of HIIT</a>` : ""}
          <br />${escapeHtml(data.sourceNote)}
        `;
        $("mapLabel").textContent = data.mapLabel;
        $("childMap").innerHTML = data.children.map(childButton).join("");
        $("fullMap").innerHTML = data.children.map(childButton).join("");

        $("childTitle").textContent = child.title;
        $("childDesc").textContent = child.desc;
        $("nextItem").textContent = nextItem(child);
        $("progressText").textContent = `${done}/${child.items.length} 완료`;
        $("artifactText").textContent = data.artifact;
        $("progressBar").style.setProperty("--value", `${percent}%`);
        $("timeBox").innerHTML = renderTimeBox(data, child);
        $("checkList").innerHTML = `
          ${child.caution ? `<div class="note-box"><strong>주의</strong><br />${escapeHtml(child.caution)}</div>` : ""}
          ${renderChecks(child)}
        `;
        $("memoLabel").textContent = child.memoLabel || "메모";
        $("memoBox").value = state.notes[noteKey] || "";
        $("memoBox").dataset.note = noteKey;
        $("childSource").href = child.sourceUrl || data.sourceUrl;
      }

      document.addEventListener("click", (event) => {
        const flowButton = event.target.closest("[data-flow]");
        if (flowButton) {
          state.activeFlow = flowButton.dataset.flow;
          render();
          return;
        }

        const childButton = event.target.closest("[data-child]");
        if (childButton) {
          state.childIndex[state.activeFlow] = Number(childButton.dataset.child);
          render();
          return;
        }

        if (event.target.id === "saveAll") {
          const data = activeData();
          state.saved[state.activeFlow] = "all";
          $("toast").hidden = false;
          $("toast").textContent = `${data.title} 전체 지도를 내 Flow에 저장했습니다.`;
          return;
        }

        if (event.target.id === "saveSelected") {
          const child = selectedChild();
          state.saved[state.activeFlow] = child.title;
          $("toast").hidden = false;
          $("toast").textContent = `${child.title} 하위 Flow만 내 Flow에 저장했습니다.`;
          return;
        }

        if (event.target.id === "nextChild") {
          const data = activeData();
          const current = state.childIndex[state.activeFlow];
          state.childIndex[state.activeFlow] = Math.min(current + 1, data.children.length - 1);
          render();
        }
      });

      document.addEventListener("change", (event) => {
        if (event.target.matches("[data-check]")) {
          const child = selectedChild();
          state.checks[checkKey(child, Number(event.target.dataset.check))] = event.target.checked;
          render();
          return;
        }

        if (event.target.matches("[data-input]")) {
          state.inputValues[`${state.activeFlow}:${event.target.dataset.input}`] = event.target.value;
          render();
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.id === "memoBox") {
          state.notes[event.target.dataset.note] = event.target.value;
        }
      });

      render();
    </script>
  </body>
</html>
