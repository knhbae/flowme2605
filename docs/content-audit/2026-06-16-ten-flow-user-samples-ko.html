<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlowMe 실행 Flow 10개</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #fff;
      --soft: #f8fafc;
      --line: #d8e2ef;
      --line-strong: #bac8da;
      --text: #101827;
      --muted: #5d697b;
      --blue: #1f5fbf;
      --blue-soft: #eaf2ff;
      --green: #0f7a4a;
      --green-soft: #e8f7ef;
      --amber: #9a6100;
      --amber-soft: #fff6df;
      --red: #b42318;
      --red-soft: #fff1ef;
      --shadow: 0 14px 32px rgba(16, 24, 39, .08);
      --radius: 8px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #fbfdff 0, var(--bg) 420px);
      font-size: 16px;
      line-height: 1.56;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(30px, 5vw, 46px); line-height: 1.1; letter-spacing: 0; }
    h2 { margin-bottom: 8px; font-size: clamp(24px, 3.2vw, 36px); line-height: 1.2; letter-spacing: 0; }
    h3 { margin-bottom: 6px; font-size: 20px; line-height: 1.28; letter-spacing: 0; }
    button, input, select, textarea { font: inherit; }
    button { min-height: 44px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 850; }
    a { color: var(--blue); text-underline-offset: 3px; }

    .page { width: min(1220px, calc(100% - 28px)); margin: 0 auto; padding: 16px 0 64px; }
    .topbar, .hero, .nav, .surface, .panel, .calendar, .notice, .item-button, .setup-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 12px 16px;
      box-shadow: 0 1px 2px rgba(16, 24, 39, .04);
    }
    .brand { color: var(--blue); font-size: 24px; font-weight: 950; text-decoration: none; }
    .hero { margin-top: 12px; padding: 18px; box-shadow: var(--shadow); }
    .eyebrow { margin-bottom: 6px; color: var(--blue); font-size: 13px; font-weight: 900; text-transform: uppercase; }
    .desc { color: var(--muted); }
    .chips, .button-row, .source-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips { margin-top: 12px; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      color: #334155;
      font-size: 13px;
      font-weight: 850;
    }
    .chip.blue { border-color: #bfdbfe; background: var(--blue-soft); color: #174ea6; }
    .chip.green { border-color: #bde7cb; background: var(--green-soft); color: var(--green); }
    .chip.warn { border-color: #efd08f; background: var(--amber-soft); color: var(--amber); }

    .app { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 14px; align-items: start; margin-top: 14px; }
    .nav {
      position: sticky;
      top: 12px;
      display: grid;
      gap: 7px;
      max-height: calc(100vh - 24px);
      padding: 10px;
      overflow: auto;
      box-shadow: var(--shadow);
    }
    .nav button {
      min-height: 58px;
      padding: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: #334155;
      text-align: left;
    }
    .nav b, .nav span { display: block; }
    .nav span { margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 750; }
    .nav button.active { border-color: var(--blue); background: var(--blue-soft); color: #174ea6; box-shadow: inset 0 0 0 1px var(--blue); }

    .surface { overflow: hidden; box-shadow: var(--shadow); }
    .surface-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff 0, #f8fafc 100%);
    }
    .progress-pill {
      align-self: start;
      min-width: 112px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #334155;
      text-align: center;
      font-size: 13px;
      font-weight: 900;
    }
    .workspace { display: grid; grid-template-columns: minmax(320px, .86fr) minmax(0, 1.14fr); gap: 0; }
    .left { padding: 16px; border-right: 1px solid var(--line); background: #f1f5f9; }
    .right { display: grid; gap: 12px; padding: 16px; background: #fff; }
    .panel, .setup-card { padding: 14px; }
    .panel + .panel, .setup-card + .setup-card { margin-top: 12px; }
    .label { margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 900; text-transform: uppercase; }
    .field-grid { display: grid; gap: 10px; margin-top: 10px; }
    .field label { display: block; margin-bottom: 5px; color: #334155; font-size: 13px; font-weight: 850; }
    input, select, textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 6px; background: #fff; color: var(--text); }
    input, select { min-height: 44px; padding: 8px 10px; }
    textarea { min-height: 86px; padding: 10px; resize: vertical; }
    .primary { padding: 0 14px; background: var(--blue); color: #fff; }
    .secondary { padding: 0 12px; border: 1px solid var(--line); background: #fff; color: #334155; }
    .toast { display: none; margin-top: 10px; padding: 9px 10px; border: 1px solid #bfdbfe; border-radius: 6px; background: var(--blue-soft); color: #174ea6; font-size: 13px; font-weight: 800; }
    .toast.show { display: block; }
    .source-row { margin-top: 8px; }
    .source-row a { display: inline-flex; align-items: center; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 13px; font-weight: 850; text-decoration: none; }
    .notice { padding: 10px; background: var(--amber-soft); color: #795100; font-size: 14px; font-weight: 750; }
    .notice.danger { border-color: #f4b4ad; background: var(--red-soft); color: var(--red); }

    .action-card { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--soft); }
    .status-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .status-box { padding: 11px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .status-box b, .status-box span { display: block; }
    .status-box span { margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 750; }
    .check-list { display: grid; gap: 8px; margin-top: 10px; }
    .check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .check input { width: 18px; height: 18px; min-height: 18px; margin-top: 3px; }
    .check strong, .check span { display: block; }
    .check span span { margin-top: 2px; color: var(--muted); font-size: 13px; }
    .check.done strong { color: #94a3b8; text-decoration: line-through; }

    .item-list { display: grid; gap: 8px; margin-top: 8px; }
    .item-button { min-height: 50px; padding: 9px 10px; color: #334155; text-align: left; }
    .item-button b, .item-button span { display: block; }
    .item-button span { margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 750; }
    .item-button.active { border-color: var(--blue); background: var(--blue-soft); color: #174ea6; box-shadow: inset 0 0 0 1px var(--blue); }

    .calendar { overflow: hidden; }
    .calendar-top { display: flex; align-items: start; justify-content: space-between; gap: 10px; padding: 12px 12px 0; }
    .month-nav { display: flex; gap: 6px; flex: 0 0 auto; }
    .month-nav button { min-height: 36px; padding: 0 9px; border: 1px solid var(--line); background: #fff; color: #334155; font-size: 13px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin: 12px; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; }
    .weekday, .day { min-height: 58px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; font-size: 12px; }
    .weekday { min-height: auto; background: #eef3f8; text-align: center; font-weight: 900; }
    .day { background: #fff; color: var(--text); text-align: left; border-radius: 0; font-weight: 750; }
    .weekday:nth-child(7n), .day:nth-child(7n) { border-right: 0; }
    .day.empty { background: #f8fafc; color: #cbd5e1; }
    .day.has-event { color: #174ea6; }
    .day.active { background: var(--blue-soft); box-shadow: inset 0 0 0 2px var(--blue); }
    .event-chip { display: block; width: fit-content; max-width: 100%; margin-top: 4px; padding: 2px 4px; overflow: hidden; border: 1px solid #bfdbfe; border-radius: 4px; background: var(--blue-soft); color: #174ea6; font-size: 11px; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }

    @media (max-width: 980px) {
      .app, .workspace { grid-template-columns: 1fr; }
      .nav { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: none; }
      .left { border-right: 0; border-bottom: 1px solid var(--line); }
    }

    @media (max-width: 660px) {
      .page { width: min(100% - 20px, 1220px); padding-top: 10px; }
      .hero, .surface-head, .left, .right { padding: 14px; }
      .surface-head { grid-template-columns: 1fr; }
      .progress-pill { width: 100%; }
      .nav { grid-template-columns: 1fr; }
      .status-grid { grid-template-columns: 1fr; }
      .day { min-height: 68px; padding: 5px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="topbar" aria-label="FLOW">
      <a class="brand" href="#">FLOW</a>
      <button class="secondary" type="button" id="reset">현재 Flow 초기화</button>
    </nav>

    <header class="hero">
      <p class="eyebrow">내 Flow</p>
      <h1>저장한 원문을 바로 실행하기</h1>
      <p class="desc">읽고 지나가기 쉬운 생활 원문을 날짜, 체크, 메모, 원본 링크가 있는 실행 화면으로 정리했습니다.</p>
      <div class="chips">
        <span class="chip blue">입력 1-3개</span>
        <span class="chip green">체크하면서 실행</span>
        <span class="chip warn">상세 설명은 원문 링크로 이동</span>
      </div>
    </header>

    <section class="app" aria-label="실행 Flow 10개">
      <nav class="nav" id="flow-nav" aria-label="Flow 선택"></nav>
      <article class="surface">
        <header class="surface-head">
          <div>
            <div class="chips" id="flow-tags" style="margin-top:0"></div>
            <h2 id="flow-title"></h2>
            <p class="desc" id="flow-summary"></p>
          </div>
          <span class="progress-pill" id="flow-progress">0/0 완료</span>
        </header>
        <div class="workspace">
          <aside class="left">
            <section class="setup-card" id="setup-panel"></section>
            <section class="setup-card" id="source-panel"></section>
          </aside>
          <section class="right" id="flow-body"></section>
        </div>
      </article>
    </section>
  </main>

  <script>
    const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

    const flows = [
      {
        id: 'moving',
        nav: '이사 D-30',
        navSub: '날짜형 준비',
        title: '이사 D-30 실행 Flow',
        summary: '이사일을 넣으면 견적, 이전 설치, 주소 변경, 당일 정산까지 날짜별로 실행합니다.',
        destination: '캘린더 + 업체 메모',
        primary: '이사 일정 만들기',
        setupTitle: '이사일과 방식만 넣기',
        setupText: '업체명과 포함 범위만 메모하고, 계약서 원문이나 계좌 정보는 저장하지 않습니다.',
        tags: ['이사일 기준', '캘린더', '업체 메모'],
        mode: 'timeline',
        calendar: true,
        anchor: 'moveDate',
        inputs: [
          { key: 'moveDate', label: '이사일', type: 'date', value: '2026-07-18' },
          { key: 'method', label: '이사 방식', type: 'select', value: '포장이사', options: ['포장이사', '반포장이사', '용달/직접'] }
        ],
        sources: [
          ['원문', '오늘의집 이사 체크리스트', 'https://ohou.se/advices/8442'],
          ['원문', '아정당 포장이사 체크리스트', 'https://www.ajd.co.kr/contents/basic-tip/detail/%ED%8F%AC%EC%9E%A5%EC%9D%B4%EC%82%AC_%EC%B2%B4%ED%81%AC%EB%A6%AC%EC%8A%A4%ED%8A%B8_%EB%B0%8F_%EA%BF%80%ED%8C%81_%EC%95%8C%EB%A0%A4%EB%93%9C%EB%A6%BD%EB%8B%88%EB%8B%A4-50950'],

        notice: '견적 금액, 포함 범위, 예약 시간만 메모합니다. 민감 정보와 계약서 원문은 저장하지 않습니다.',
        items: [

            ['이사 방식 1개 선택', '현재 선택: {method}'],
            ['견적 후보 2-3곳 이름과 연락처 메모', '비용, 포함 범위, 가능한 시간을 같이 적습니다.'],
            ['입주청소가 필요하면 같은 날 가능한 후보만 표시', '확정 전에는 후보 일정만 남깁니다.']
          ]},
          { id: 'm14', offset: -14, label: 'D-14', title: '인터넷, 도시가스, 주소 변경 예약하기', short: '이전 설치', detail: '날짜가 필요한 생활 서비스부터 예약합니다.', tasks: [
            ['인터넷/가전 이전 설치 날짜 확인', '이사 전후 가능한 시간대를 메모합니다.'],
            ['도시가스 전출입 또는 관리사무소 연락', '건물별 절차가 다르면 원문 링크를 다시 엽니다.'],
            ['우편물/정기배송 주소 변경할 곳 표시', '은행, 쇼핑몰, 정기배송처럼 자주 쓰는 곳만 먼저 합니다.']
          ]},
          { id: 'm7', offset: -7, label: 'D-7', title: '이사업체 예약 내용 다시 확인하기', short: '예약 재확인', detail: '도착 시간, 작업 범위, 추가비 조건처럼 당일 문제 되는 항목을 다시 봅니다.', tasks: [
            ['업체 도착 시간과 작업 인원 확인', '전화나 문자로 받은 내용만 짧게 메모합니다.'],
            ['추가비가 생길 수 있는 조건 확인', '사다리차, 엘리베이터, 주차 조건을 봅니다.'],
            ['큰 가구 위치를 방별로만 정리', '세부 배치는 당일에 조정합니다.']
          ]},
          { id: 'm0', offset: 0, label: 'D-Day', title: '짐 반출입과 정산 금액 확인하기', short: '당일 정산', detail: '파손, 누락, 추가비가 생기면 현장에서 바로 메모합니다.', tasks: [

            ['새집에서 큰 짐 위치 먼저 확인', '방, 거실, 주방처럼 큰 구역만 정합니다.'],
            ['정산 금액과 추가비 사유 메모', '계좌번호는 저장하지 않습니다.']
          ]}
        ]
      },
      {
        id: 'usedcar',
        nav: '중고차 방문',
        navSub: '현장 체크',
        title: '중고차 방문 당일 체크 Flow',
        summary: '방문일과 매물 링크를 넣고, 현장에서 기록부, 이력 조회, 외관, 시동/주행을 순서대로 봅니다.',
        destination: '현장 체크 + 보류 메모',
        primary: '방문 체크 시작하기',
        setupTitle: '매물 링크와 방문일 넣기',
        setupText: '차량번호는 필수가 아닙니다. 확신이 안 드는 항목만 보류 메모에 남깁니다.',
        tags: ['현장 체크', '매물 URL', '보류 메모'],
        mode: 'section',
        calendar: false,
        inputs: [
          { key: 'visitDate', label: '방문일', type: 'date', value: '2026-06-20' },
          { key: 'listing', label: '매물 URL 또는 이름', type: 'text', value: '' }
        ],
        sources: [
          ['원문', '겟차 중고차 상태 체크리스트', 'https://web.getcha.kr/blog/used-car-condition-checklist-guide'],
          ['소비자 안내', '한국소비자원 중고차 체크리스트', 'https://www.kca.go.kr/smartconsumer/sub.do?menukey=7714&mode=view&no=1002862088'],
          ['공식 조회', '자동차365 통합이력조회', 'https://www.car365.go.kr/'],
          ['보험 이력', '카히스토리 사고이력조회', 'https://www.carhistory.or.kr/']
        ],
        notice: '확인한 사실, 걸리는 항목, 다시 볼 링크만 남깁니다. 확신이 없으면 계약 전 확인 질문으로 정리합니다.',
        noticeTone: 'danger',
        items: [
          { id: 'u1', label: '1', title: '방문 전 기록부와 이력 조회 열기', short: '방문 전 준비', detail: '성능·상태점검기록부와 매물 정보를 현장에서 바로 비교할 수 있게 준비합니다.', tasks: [
            ['판매 페이지 URL 또는 매물명 저장', '현재 입력: {listing}'],
            ['성능·상태점검기록부 파일이나 사진 열어두기', '차량정보, 주행거리, 사고/수리 항목을 볼 수 있게 둡니다.'],
            ['자동차365 또는 카히스토리 조회 링크 열어두기', '조회 결과는 기록부와 나란히 비교합니다.']
          ]},

            ['침구와 매트리스 커버 확인', '학교 제공 품목이 있으면 제외합니다.'],
            ['욕실용품과 세탁용품을 한 가방에 모으기', '처음 1주에 필요한 양만 챙깁니다.'],
            ['멀티탭, 충전기, 노트북 어댑터 확인', '허용 규격이 있으면 학교 안내를 따릅니다.']
          ]},
          { id: 'd1', offset: -1, label: 'D-1', title: '서류와 첫날 쓸 물건만 따로 빼기', short: '전날', detail: '도착 직후 필요한 것만 손에 닿는 가방에 둡니다.', tasks: [
            ['신분증, 입사 확인 서류, 안내문 따로 넣기', '원문 파일은 학교 시스템에서 다시 열 수 있게 둡니다.'],
            ['첫날 세면도구와 수건 1-2장 따로 빼기', '짐을 풀기 전 바로 쓸 물건만 분리합니다.'],
            ['도착 동선과 보호자 출입 가능 여부 확인', '주차와 엘리베이터 혼잡 시간을 메모합니다.']
          ]},
          { id: 'd0', offset: 0, label: '입사일', title: '지정 시간에 도착하고 호실 상태 확인하기', short: '입사', detail: '입사 절차를 마친 뒤 방 상태와 기본 시설만 봅니다.', tasks: [
            ['지정 시간에 도착해 입사 절차 진행', '늦을 경우 연락처를 안내문에서 확인합니다.'],
            ['호실, 열쇠/출입카드, 기본 시설 확인', '파손이나 오염은 바로 메모합니다.'],
            ['첫날 필요한 물건만 꺼내기', '전체 정리는 입사 후에 천천히 합니다.']
          ]}
        ]
      }
    ];

    const state = {};
    let currentId = 'moving';

    flows.forEach((item) => {
      const inputs = {};
      item.inputs.forEach((input) => inputs[input.key] = input.value || '');
      state[item.id] = {
        inputs,
        selected: item.items[0].id,
        selectedDate: '',
        month: '',
        checks: {},
        memos: {},
        toast: ''
      };
    });

    function pad(value) { return String(value).padStart(2, '0'); }
    function parseDate(value) { return value ? new Date(`${value}T00:00:00`) : null; }
    function dateKey(date) { return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`; }
    function shiftDate(value, offset) {
      const date = parseDate(value);
      if (!date) return '';
      date.setDate(date.getDate() + offset);
      return dateKey(date);
    }
    function monthKey(value) {
      const date = parseDate(value);
      return date ? `${date.getFullYear()}-${pad(date.getMonth() + 1)}` : '';
    }
    function shiftMonth(value, amount) {
      const date = parseDate(`${value}-01`);
      date.setMonth(date.getMonth() + amount);
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}`;
    }
    function formatDate(value) {
      const date = parseDate(value);
      if (!date) return '날짜 없음';
      return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 ${dayNames[date.getDay()]}요일`;
    }
    function shortDate(value) {
      const date = parseDate(value);
      if (!date) return '';
      return `${date.getMonth() + 1}/${date.getDate()} ${dayNames[date.getDay()]}`;
    }
    function interpolate(text, item) {
      return String(text || '').replace(/\{([a-zA-Z0-9_]+)\}/g, (_, key) => state[item.id].inputs[key] || '미입력');
    }
    function currentFlow() { return flows.find((item) => item.id === currentId); }
    function entries(item) {
      if (!item.calendar) return item.items;
      return item.items.map((entry) => ({ ...entry, date: shiftDate(state[item.id].inputs[item.anchor], entry.offset || 0) }));
    }
    function activeEntry(item) {
      return entries(item).find((entry) => entry.id === state[item.id].selected) || entries(item)[0];
    }
    function allTasks(item) {
      return item.items.flatMap((entry) => entry.tasks.map((task, index) => `${entry.id}:${index}`));
    }
    function doneCount(item) {
      return allTasks(item).filter((key) => state[item.id].checks[key]).length;
    }
    function taskKey(entry, index) { return `${entry.id}:${index}`; }

    function collectInputs(item) {
      document.querySelectorAll('[data-input]').forEach((input) => {
        state[item.id].inputs[input.dataset.input] = input.value;
      });
      if (item.calendar) {
        const active = activeEntry(item);
        state[item.id].selectedDate = active.date;
        state[item.id].month = monthKey(active.date);
      }
    }

    function inputControl(item, input) {
      const value = state[item.id].inputs[input.key] || '';
      if (input.type === 'select') {
        return `
          <div class="field">
            <label for="${item.id}-${input.key}">${input.label}</label>
            <select id="${item.id}-${input.key}" data-input="${input.key}">
              ${input.options.map((option) => `<option value="${option}" ${option === value ? 'selected' : ''}>${option}</option>`).join('')}
            </select>
          </div>
        `;
      }
      return `
        <div class="field">
          <label for="${item.id}-${input.key}">${input.label}</label>
          <input id="${item.id}-${input.key}" data-input="${input.key}" type="${input.type}" value="${value}" />
        </div>
      `;
    }

    function renderNav() {
      document.querySelector('#flow-nav').innerHTML = flows.map((item) => `
        <button type="button" class="${item.id === currentId ? 'active' : ''}" data-flow="${item.id}">
          <b>${item.nav}</b>
          <span>${item.navSub}</span>
        </button>
      `).join('');
      document.querySelectorAll('[data-flow]').forEach((button) => {
        button.addEventListener('click', () => {
          currentId = button.dataset.flow;
          render();
        });
      });
    }

    function renderHeader(item) {
      document.querySelector('#flow-tags').innerHTML = item.tags.map((tag, index) => `<span class="chip ${index === 0 ? 'blue' : index === 1 ? 'green' : 'warn'}">${tag}</span>`).join('');
      document.querySelector('#flow-title').textContent = item.title;
      document.querySelector('#flow-summary').textContent = item.summary;
      document.querySelector('#flow-progress').textContent = `${doneCount(item)}/${allTasks(item).length} 완료`;
    }

    function renderSetup(item) {
      const itemState = state[item.id];
      document.querySelector('#setup-panel').innerHTML = `
        <p class="label">저장 설정</p>
        <h3>${item.setupTitle}</h3>
        <p class="desc">${item.setupText}</p>
        <div class="field-grid">${item.inputs.map((input) => inputControl(item, input)).join('')}</div>
        <div class="button-row" style="margin-top:12px">
          <button class="primary" type="button" id="save-flow">${item.primary}</button>
        </div>
        <p class="toast ${itemState.toast ? 'show' : ''}" role="status">${itemState.toast}</p>
      `;
      document.querySelectorAll('[data-input]').forEach((input) => {
        input.addEventListener('change', () => {
          collectInputs(item);
          render();
        });
      });
      document.querySelector('#save-flow').addEventListener('click', () => {
        collectInputs(item);
        itemState.toast = `${item.nav} Flow가 저장되었습니다.`;
        render();
      });

      document.querySelector('#source-panel').innerHTML = `
        <p class="label">원문 / 실행 링크</p>
        <div class="source-row">
          ${item.sources.map(([kind, label, url]) => `<a href="${url}" target="_blank" rel="noreferrer">${kind} · ${label}</a>`).join('')}
        </div>
        <div class="notice ${item.noticeTone === 'danger' ? 'danger' : ''}" style="margin-top:12px">${item.notice}</div>
      `;
    }

    function renderTasks(item, entry) {
      return `
        <div class="check-list">
          ${entry.tasks.map((task, index) => {
            const key = taskKey(entry, index);
            const checked = !!state[item.id].checks[key];
            return `
              <label class="check ${checked ? 'done' : ''}">
                <input type="checkbox" data-check="${key}" ${checked ? 'checked' : ''} />
                <span>
                  <strong>${interpolate(task[0], item)}</strong>
                  <span>${interpolate(task[1], item)}</span>
                </span>
              </label>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderCalendar(item, entryList) {
      const itemState = state[item.id];
      const active = activeEntry(item);
      if (!itemState.selectedDate) itemState.selectedDate = active.date;
      if (!itemState.month) itemState.month = monthKey(active.date);
      const [year, month] = itemState.month.split('-').map(Number);
      const first = new Date(year, month - 1, 1);
      const last = new Date(year, month, 0);
      const cells = [];
      for (let i = 0; i < first.getDay(); i += 1) cells.push({ empty: true });
      for (let day = 1; day <= last.getDate(); day += 1) {
        const date = `${year}-${pad(month)}-${pad(day)}`;
        cells.push({ day, date, entries: entryList.filter((entry) => entry.date === date) });
      }
      while (cells.length % 7 !== 0) cells.push({ empty: true });
      return `
        <section class="calendar">
          <div class="calendar-top">
            <div>
              <p class="label">캘린더 미리보기</p>
              <h3>${year}년 ${month}월</h3>
            </div>
            <div class="month-nav">
              <button type="button" data-month="-1">이전</button>
              <button type="button" data-month="1">다음</button>
            </div>
          </div>
          <div class="calendar-grid">
            ${dayNames.map((day) => `<div class="weekday">${day}</div>`).join('')}
            ${cells.map((cell) => {
              if (cell.empty) return '<div class="day empty"></div>';
              const hasEvent = cell.entries.length > 0;
              const activeDay = cell.date === itemState.selectedDate;
              return `
                <button class="day ${hasEvent ? 'has-event' : ''} ${activeDay ? 'active' : ''}" type="button" ${hasEvent ? `data-date="${cell.date}"` : ''}>
                  ${cell.day}
                  ${cell.entries.map((entry) => `<span class="event-chip">${entry.label}</span>`).join('')}
                </button>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function bindBody(item) {
      document.querySelectorAll('[data-check]').forEach((input) => {
        input.addEventListener('change', () => {
          state[item.id].checks[input.dataset.check] = input.checked;
          render();
        });
      });
      document.querySelectorAll('[data-memo]').forEach((memo) => {
        memo.addEventListener('input', () => {
          state[item.id].memos[memo.dataset.memo] = memo.value;
        });
      });
      document.querySelectorAll('[data-entry]').forEach((button) => {
        button.addEventListener('click', () => {
          state[item.id].selected = button.dataset.entry;
          const selected = activeEntry(item);
          if (item.calendar) {
            state[item.id].selectedDate = selected.date;
            state[item.id].month = monthKey(selected.date);
          }
          render();
        });
      });
      document.querySelectorAll('[data-date]').forEach((button) => {
        button.addEventListener('click', () => {
          const match = entries(item).find((entry) => entry.date === button.dataset.date);
          state[item.id].selectedDate = button.dataset.date;
          if (match) state[item.id].selected = match.id;
          render();
        });
      });
      document.querySelectorAll('[data-month]').forEach((button) => {
        button.addEventListener('click', () => {
          state[item.id].month = shiftMonth(state[item.id].month, Number(button.dataset.month));
          render();
        });
      });
    }

    function renderBody(item) {
      const entryList = entries(item);
      const active = activeEntry(item);
      const itemState = state[item.id];
      const dateText = item.calendar ? `${formatDate(active.date)} · ` : '';
      document.querySelector('#flow-body').innerHTML = `
        <section class="action-card">
          <p class="label">현재 실행</p>
          <h3>${item.calendar ? `${active.label} · ` : ''}${active.title}</h3>
          <p class="desc">${dateText}${interpolate(active.detail, item)}</p>
          <div class="status-grid">
            <div class="status-box"><b>오늘 볼 것</b><span>${active.short}</span></div>
            <div class="status-box"><b>완료</b><span>${doneCount(item)}/${allTasks(item).length}</span></div>
            <div class="status-box"><b>저장 위치</b><span>${item.destination}</span></div>
          </div>
          ${renderTasks(item, active)}
          <div class="field" style="margin-top:12px">
            <label for="${item.id}-memo-${active.id}">메모</label>
            <textarea id="${item.id}-memo-${active.id}" data-memo="${active.id}" placeholder="다시 볼 링크, 보류 이유, 연락처처럼 실행에 필요한 내용만 짧게 남기기">${itemState.memos[active.id] || ''}</textarea>
          </div>
        </section>
        ${item.calendar ? renderCalendar(item, entryList) : ''}
        <section class="panel">
          <p class="label">${item.calendar ? '전체 일정' : '볼 순서'}</p>
          <div class="item-list">
            ${entryList.map((entry) => `
              <button class="item-button ${entry.id === active.id ? 'active' : ''}" type="button" data-entry="${entry.id}">
                <b>${entry.label}${entry.date ? ` · ${shortDate(entry.date)}` : ''}</b>
                <span>${entry.title}</span>
              </button>
            `).join('')}
          </div>
        </section>
      `;
      bindBody(item);
    }

    function render() {
      const item = currentFlow();
      renderNav();
      renderHeader(item);
      renderSetup(item);
      renderBody(item);
    }

    document.querySelector('#reset').addEventListener('click', () => {
      const item = currentFlow();
      state[item.id].checks = {};
      state[item.id].memos = {};
      state[item.id].toast = '현재 Flow를 초기화했습니다.';
      render();
    });

    render();
  </script>
</body>
</html>
