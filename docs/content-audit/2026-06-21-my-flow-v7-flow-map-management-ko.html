<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>내 Flow</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --soft: #f8fafc;
      --line: #d8e2ef;
      --line-strong: #b8c7da;
      --text: #101827;
      --muted: #536274;
      --faint: #7b8798;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #0f766e;
      --green-soft: #ecfdf5;
      --amber: #b45309;
      --amber-soft: #fffbeb;
      --radius: 18px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 56px; }
    .top, .surface {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      padding: 24px;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 850;
    }
    h1, h2, h3, p { margin-top: 0; letter-spacing: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(28px, 4vw, 44px); line-height: 1.08; }
    h2 { margin-bottom: 8px; font-size: 21px; line-height: 1.25; }
    h3 { margin-bottom: 6px; font-size: 18px; }
    p { color: var(--muted); }
    .summary {
      min-width: 220px;
      border-radius: 16px;
      background: var(--soft);
      padding: 18px;
    }
    .summary b, .summary span { display: block; }
    .summary b { font-size: 22px; }
    .summary span { color: var(--muted); font-size: 14px; }
    .nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 14px 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      padding: 6px;
    }
    .nav button {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-weight: 850;
    }
    .nav button.active { background: var(--blue-soft); color: var(--blue); box-shadow: inset 0 0 0 1px #bfdbfe; }
    .view { display: none; }
    .view.active { display: block; }
    .surface { padding: 22px; }
    .head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .head p { margin-bottom: 0; }
    .count {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border-radius: 999px;
      background: var(--soft);
      padding: 5px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 390px) minmax(0, 1fr);
      gap: 18px;
      padding-top: 18px;
    }
    .stack { display: grid; gap: 10px; align-content: start; }
    .row, .flow-row, .map-row, .child-row, .step-row {
      width: 100%;
      min-height: 72px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--card);
      padding: 14px;
      text-align: left;
    }
    .row.active, .flow-row.active, .map-row.active, .child-row.active, .step-row.active {
      border-color: #93c5fd;
      background: var(--blue-soft);
    }
    .row b, .flow-row b, .map-row b, .child-row b, .step-row b { display: block; color: var(--text); font-size: 15px; }
    .row span, .flow-row span, .map-row span, .child-row span, .step-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px;
      gap: 10px;
      align-items: center;
    }
    .quick {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--card);
      color: transparent;
      font-weight: 900;
    }
    .quick.done { border-color: #99f6e4; background: var(--green); color: #fff; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      width: fit-content;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      padding: 4px 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }
    .chip.blue { border-color: #bfdbfe; background: var(--blue-soft); color: var(--blue); }
    .chip.green { border-color: #99f6e4; background: var(--green-soft); color: var(--green); }
    .chip.amber { border-color: #fed7aa; background: var(--amber-soft); color: var(--amber); }
    .detail {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfdff;
      padding: 18px;
    }
    .detail-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .items { display: grid; gap: 10px; margin-top: 14px; }
    .section-label { color: var(--muted); font-size: 12px; font-weight: 900; }
    .item, .basis {
      display: grid;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--card);
      padding: 13px;
    }
    .item {
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
    }
    .item.done { border-color: #99f6e4; background: var(--green-soft); }
    .item input { width: 24px; height: 24px; margin-top: 1px; accent-color: var(--blue); }
    .item b, .basis b { color: var(--text); font-size: 14px; }
    .item span span, .basis span { color: var(--muted); font-size: 13px; font-weight: 550; }
    .memo { display: grid; gap: 8px; margin-top: 14px; }
    .memo label { color: var(--text); font-size: 13px; font-weight: 850; }
    textarea {
      width: 100%;
      min-height: 96px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: #fff;
      padding: 11px 12px;
      color: var(--text);
      resize: vertical;
    }
    textarea::placeholder { color: var(--faint); }
    .save-state {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      margin-top: 10px;
      border-radius: 999px;
      background: var(--soft);
      padding: 4px 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    details {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--card);
      padding: 12px;
    }
    summary { cursor: pointer; font-weight: 850; }
    pre { white-space: pre-wrap; word-break: keep-all; color: var(--muted); font-size: 13px; }
    .flow-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding-top: 18px;
    }
    .flow-row { min-height: 120px; }
    .meter {
      height: 8px;
      margin: 12px 0 0;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .meter span { display: block; height: 100%; border-radius: 999px; background: var(--blue); }
    .flow-layout, .map-layout {
      display: grid;
      grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
      gap: 18px;
      padding-top: 18px;
    }
    .step-list { display: grid; gap: 8px; margin-top: 12px; }
    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      gap: 14px;
    }
    .map-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--soft);
      padding: 12px;
    }
    .metric b, .metric span { display: block; }
    .metric b { font-size: 18px; }
    .metric span { color: var(--muted); font-size: 12px; font-weight: 750; }
    .hidden { display: none !important; }
    @media (max-width: 860px) {
      .top, .layout, .flow-layout, .map-layout, .split { grid-template-columns: 1fr; }
      .summary { min-width: 0; }
      .flow-grid { grid-template-columns: 1fr; }
      .detail { padding: 16px; }
    }
    @media (max-width: 520px) {
      .app { width: min(100% - 20px, 430px); padding-top: 18px; }
      .top, .surface { padding: 16px; border-radius: 16px; }
      .head { display: grid; }
      .map-summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow">내 실행 공간</p>
        <h1>내 Flow</h1>
        <p>오늘 할 일을 먼저 보고, 필요할 때 저장한 Flow와 큰 지도를 엽니다.</p>
      </div>
      <aside class="summary" aria-live="polite">
        <b id="summaryTitle">오늘 6개</b>
        <span id="summaryMeta">저장한 Flow 11개 · 큰 지도 2개</span>
      </aside>
    </header>

    <nav class="nav" aria-label="내 Flow 보기">
      <button type="button" class="active" data-view="today">오늘</button>
      <button type="button" data-view="flows">저장한 Flow</button>
      <button type="button" data-view="maps">큰 지도</button>
    </nav>

    <section class="view active surface" id="todayView" aria-labelledby="todayTitle">
      <div class="head">
        <div>
          <p class="eyebrow">오늘</p>
          <h2 id="todayTitle">먼저 할 일</h2>
          <p>여러 Flow에서 오늘 처리할 항목만 모았습니다.</p>
        </div>
        <span class="count" id="todayCount">6개</span>
      </div>
      <div class="layout">
        <div class="stack" id="todayList"></div>
        <article class="detail" id="todayDetail"></article>
      </div>
    </section>

    <section class="view surface" id="flowsView" aria-labelledby="flowsTitle">
      <div class="head">
        <div>
          <p class="eyebrow">저장한 Flow</p>
          <h2 id="flowsTitle">Flow별로 보기</h2>
          <p>Flow마다 Step 수가 달라도 같은 방식으로 이어봅니다.</p>
        </div>
        <span class="count" id="flowsCount">11개</span>
      </div>
      <div class="flow-layout">
        <div class="stack" id="flowCards"></div>
        <div class="split">
          <article class="detail" id="flowDetail"></article>
          <article class="detail" id="flowStepDetail"></article>
        </div>
      </div>
    </section>

    <section class="view surface" id="mapsView" aria-labelledby="mapsTitle">
      <div class="head">
        <div>
          <p class="eyebrow">큰 지도</p>
          <h2 id="mapsTitle">큰 지도 보기</h2>
          <p>큰 지도 안의 하위 Flow와 현재 이어볼 항목을 함께 봅니다.</p>
        </div>
        <span class="count" id="mapsCount">2개</span>
      </div>
      <div class="map-layout">
        <div class="stack" id="mapCards"></div>
        <div class="split">
          <article class="detail" id="mapDetail"></article>
          <article class="detail" id="mapStepDetail"></article>
        </div>
      </div>
    </section>
  </main>

            <span class="chip ${map ? 'amber' : 'blue'}">${map ? '지도 안 Flow' : flow.type}</span>
            <b>${flow.name}</b>
            <span>${map ? `${map.name} · ` : ''}${progress.done}/${progress.total}개 완료</span>
            <div class="meter"><span style="width:${progress.pct}%"></span></div>
          </button>
        `;
      }).join('');
      renderFlowDetail();
    }

    function renderFlowDetail() {
      const flow = flowById(state.selectedFlowId);
      const progress = progressForFlow(flow);
      const map = flow.mapId ? mapById(flow.mapId) : null;
      const steps = stepsForFlow(flow.id);
      if (!steps.some((step) => step.id === state.selectedStepId)) state.selectedStepId = steps.find((step) => !isStepDone(step))?.id || steps[0].id;
      $('flowDetail').innerHTML = `
        <p class="eyebrow">${map ? map.name : '저장한 Flow'}</p>
        <h3>${flow.name}</h3>
        <p>${flow.source}</p>
        <div class="map-summary">
          <div class="metric"><b>${steps.length}</b><span>전체 항목</span></div>
          <div class="metric"><b>${progress.done}</b><span>완료</span></div>
          <div class="metric"><b>${progress.pct}%</b><span>진행</span></div>
        </div>
        <div class="step-list">
          ${steps.map((step) => `
            <button class="step-row ${step.id === state.selectedStepId ? 'active' : ''}" type="button" data-open-step-in-flow="${step.id}">
              <span class="chip ${isStepDone(step) ? 'green' : isToday(step) ? 'blue' : 'amber'}">${isStepDone(step) ? '완료' : step.date}</span>
              <b>${step.title}</b>
              <span>${stepItems(step).length ? `${stepItems(step).length}개 세부 항목` : '완료 표시 + 메모'}</span>
            </button>
          `).join('')}
        </div>
      `;
      renderStepDetail($('flowStepDetail'), state.selectedStepId);
    }

    function renderMaps() {
      $('mapCards').innerHTML = maps.map((map) => {
        const progress = progressForMap(map.id);
        return `
          <button class="map-row ${map.id === state.selectedMapId ? 'active' : ''}" type="button" data-open-map="${map.id}">
            <span class="chip amber">${map.kind}</span>
            <b>${map.name}</b>
            <span>${progress.flows}개 Flow · ${progress.done}/${progress.total}개 항목 완료</span>
            <div class="meter"><span style="width:${progress.pct}%"></span></div>
          </button>
        `;
      }).join('');
      renderMapDetail();
    }

    function renderMapDetail() {
      const map = mapById(state.selectedMapId);
      const mapFlows = flowsForMap(map.id);
      const progress = progressForMap(map.id);
      if (!mapFlows.some((flow) => flow.id === state.selectedMapFlowId)) state.selectedMapFlowId = mapFlows[0].id;
      const selectedFlow = flowById(state.selectedMapFlowId);
      if (!selectedFlow.steps.some((step) => step.id === state.selectedMapStepId)) {
        state.selectedMapStepId = selectedFlow.steps.find((step) => !isStepDone({ ...step, flowId: selectedFlow.id, mapId: map.id }))?.id || selectedFlow.steps[0].id;
      }
      $('mapDetail').innerHTML = `
        <p class="eyebrow">큰 지도</p>
        <h3>${map.name}</h3>
        <p>${map.sub} · ${map.source}</p>
        <div class="map-summary">
          <div class="metric"><b>${progress.flows}</b><span>Flow</span></div>
          <div class="metric"><b>${progress.total}</b><span>전체 항목</span></div>
          <div class="metric"><b>${progress.pct}%</b><span>진행</span></div>
        </div>
        <div class="step-list">
          ${mapFlows.map((flow) => {
            const flowProgress = progressForFlow(flow);
            const next = stepsForFlow(flow.id).find((step) => !isStepDone(step)) || stepsForFlow(flow.id)[0];
            return `
              <button class="child-row ${flow.id === state.selectedMapFlowId ? 'active' : ''}" type="button" data-open-map-flow="${flow.id}">
                <span class="chip blue">${flow.type}</span>
                <b>${flow.name}</b>
                <span>${flowProgress.done}/${flowProgress.total}개 완료 · 다음: ${next.title}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
      const selectedStep = stepById(state.selectedMapStepId);
      renderStepDetail($('mapStepDetail'), selectedStep.id);
    }

    function toggleStep(stepId) {
      const step = stepById(stepId);
      const items = stepItems(step);
      const next = !isStepDone(step);
      if (!items.length) {
        state.done[step.id] = next;
      } else {
        items.forEach((_, index) => {
          state.checks[checkKey(step, index)] = next;
        });
      }
      render();
    }

    function bind() {
      const bindOnce = (selector, eventName, handler) => {
        all(selector).forEach((element) => {
          if (element.dataset.bound) return;
          element.dataset.bound = 'true';
          element.addEventListener(eventName, handler);
        });
      };
      bindOnce('[data-view]', 'click', (event) => {
        state.view = event.currentTarget.dataset.view;
        render();
      });
      bindOnce('[data-open-step]', 'click', (event) => {
        state.selectedStepId = event.currentTarget.dataset.openStep;
        render();
      });
      bindOnce('[data-toggle-step]', 'click', (event) => toggleStep(event.currentTarget.dataset.toggleStep));
      bindOnce('[data-open-flow]', 'click', (event) => {
        state.selectedFlowId = event.currentTarget.dataset.openFlow;
        state.selectedStepId = stepsForFlow(state.selectedFlowId).find((step) => !isStepDone(step))?.id || stepsForFlow(state.selectedFlowId)[0].id;
        render();
      });
      bindOnce('[data-open-step-in-flow]', 'click', (event) => {
        state.selectedStepId = event.currentTarget.dataset.openStepInFlow;
        render();
      });
      bindOnce('[data-open-map]', 'click', (event) => {
        state.selectedMapId = event.currentTarget.dataset.openMap;
        const firstFlow = flowsForMap(state.selectedMapId)[0];
        state.selectedMapFlowId = firstFlow.id;
        state.selectedMapStepId = firstFlow.steps.find((step) => !isStepDone({ ...step, flowId: firstFlow.id, mapId: state.selectedMapId }))?.id || firstFlow.steps[0].id;
        render();
      });
      bindOnce('[data-open-map-flow]', 'click', (event) => {
        state.selectedMapFlowId = event.currentTarget.dataset.openMapFlow;
        const flow = flowById(state.selectedMapFlowId);
        state.selectedMapStepId = flow.steps.find((step) => !isStepDone({ ...step, flowId: flow.id, mapId: state.selectedMapId }))?.id || flow.steps[0].id;
        render();
      });
      bindOnce('[data-check]', 'change', (event) => {
        state.checks[event.currentTarget.dataset.check] = event.currentTarget.checked;
        render();
      });
      bindOnce('[data-step]', 'change', (event) => {
        state.done[event.currentTarget.dataset.step] = event.currentTarget.checked;
        render();
      });
      bindOnce('[data-memo]', 'input', (event) => {
        state.memos[event.currentTarget.dataset.memo] = event.currentTarget.value;
        renderSummary();
      });
    }

    function render() {
      renderSummary();
      renderNav();
      renderToday();
      renderFlows();
      renderMaps();
      bind();
    }

    render();
  </script>
</body>
</html>
