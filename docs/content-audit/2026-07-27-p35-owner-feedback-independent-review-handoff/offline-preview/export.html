<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가져가기 범위와 결과 · FlowMe P35</title>
  <style>
  :root {
    color-scheme: light;
    --ink: #161616;
    --muted: #5f625e;
    --line: #d9ddd7;
    --surface: #ffffff;
    --soft: #f4f6f2;
    --accent: #1e5b42;
    --accent-soft: #e7f2ec;
    --warning: #8a4f08;
    --warning-soft: #fff4dc;
    --nav: #20241f;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: #eef1ec;
    color: var(--ink);
    font-family: Arial, "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.55;
    letter-spacing: 0;
  }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible {
    outline: 3px solid #d38515;
    outline-offset: 3px;
  }
  .shell {
    display: grid;
    grid-template-columns: minmax(190px, 240px) minmax(0, 1fr);
    min-height: 100vh;
  }
  nav {
    position: sticky;
    top: 0;
    align-self: start;
    min-height: 100vh;
    padding: 24px 18px;
    background: var(--nav);
    color: #fff;
  }
  nav strong { display: block; font-size: 18px; margin-bottom: 4px; }
  nav p { color: #cdd4cb; font-size: 13px; margin: 0 0 22px; }
  nav a {
    display: block;
    padding: 10px 8px;
    border-bottom: 1px solid #3b4139;
    color: #f8faf7;
    text-decoration: none;
  }
  nav a[aria-current="page"] {
    background: #f5f7f3;
    color: #131513;
    font-weight: 700;
  }
  main { min-width: 0; padding: 36px clamp(18px, 4vw, 56px) 72px; }
  .page-head {
    max-width: 980px;
    margin-bottom: 34px;
  }
  .eyebrow {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }
  h1 { margin: 0 0 10px; font-size: 32px; line-height: 1.2; }
  h2 { margin: 44px 0 14px; font-size: 23px; line-height: 1.3; }
  h3 { margin: 0; font-size: 18px; line-height: 1.35; }
  .lede { max-width: 780px; margin: 0; color: var(--muted); font-size: 17px; }
  .notice {
    max-width: 980px;
    margin: 22px 0;
    padding: 14px 16px;
    border-left: 4px solid var(--warning);
    background: var(--warning-soft);
  }
  .facts {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    max-width: 980px;
    margin: 24px 0 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .fact { padding: 14px 12px; border-right: 1px solid var(--line); }
  .fact:last-child { border-right: 0; }
  .fact span { display: block; color: var(--muted); font-size: 12px; }
  .fact strong { display: block; margin-top: 3px; font-size: 18px; }
  .journey-links {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    max-width: 980px;
    margin-top: 20px;
  }
  .journey-link {
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    text-decoration: none;
  }
  .journey-link strong { display: block; margin-bottom: 4px; }
  .journey-link span { color: var(--muted); font-size: 13px; }
  .capture-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
    max-width: 1120px;
  }
  figure {
    margin: 0;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
  }
  figure.wide { grid-column: 1 / -1; }
  figure img {
    display: block;
    width: auto;
    max-width: 100%;
    max-height: 780px;
    margin: 14px auto;
    border: 1px solid #e7e9e5;
    background: #fff;
    object-fit: contain;
  }
  .capture-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0 0;
  }
  .tag {
    display: inline-block;
    padding: 3px 7px;
    border: 1px solid #cdd4cb;
    border-radius: 4px;
    background: var(--soft);
    color: #3e443d;
    font-size: 12px;
  }
  .questions { margin: 12px 0 0; padding-left: 20px; color: #424640; }
  .state-link { display: inline-block; margin-top: 10px; font-size: 13px; }
  .reference-groups { max-width: 1120px; }
  .reference-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }
  .reference-grid figure { padding: 10px; }
  .reference-grid figure img { margin: 8px auto; max-height: 480px; }
  .reference-grid figcaption { font-size: 12px; overflow-wrap: anywhere; }
  .footer {
    max-width: 980px;
    margin-top: 54px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
  }
  @media (max-width: 760px) {
    .shell { display: block; }
    nav {
      position: static;
      min-height: 0;
      padding: 14px 16px;
    }
    nav strong, nav p { display: none; }
    nav .links { display: flex; gap: 4px; overflow-x: auto; }
    nav a {
      flex: 0 0 auto;
      padding: 8px 10px;
      border: 0;
      border-radius: 4px;
      font-size: 13px;
    }
    main { padding: 24px 14px 52px; }
    h1 { font-size: 26px; }
    .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fact:nth-child(2) { border-right: 0; }
    .fact:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .journey-links, .capture-list, .reference-grid { grid-template-columns: 1fr; }
    figure.wide { grid-column: auto; }
  }
</style>
</head>
