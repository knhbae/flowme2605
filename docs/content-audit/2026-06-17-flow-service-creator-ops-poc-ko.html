<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlowMe 제작자 운영판</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --paper: #fff;
        --ink: #111827;
        --muted: #647084;
        --line: #dbe3ef;
        --blue: #1f5fbf;
        --green: #0f7a4a;
        --amber: #986400;
        --red: #b42318;
        --soft-blue: #edf4ff;
        --soft-green: #ebf8f0;
        --soft-amber: #fff8e6;
        --soft-red: #fff1ef;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.55; }
      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }
      a { color: var(--blue); text-underline-offset: 3px; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 5px; font-size: clamp(28px, 4vw, 42px); line-height: 1.12; letter-spacing: 0; }
      h2 { margin-bottom: 8px; font-size: 22px; line-height: 1.2; letter-spacing: 0; }
      h3 { margin-bottom: 5px; font-size: 18px; line-height: 1.24; letter-spacing: 0; }
      .app { width: min(1240px, calc(100% - 28px)); margin: 0 auto; padding: 16px 0 68px; }
      .topbar, .hero, .panel, .card, .flow-row, .group-card, .preview-row {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 54px;
        padding: 10px 12px;
        box-shadow: 0 14px 34px rgba(15, 23, 42, .07);
      }
      .brand { color: var(--ink); text-decoration: none; font-weight: 950; font-size: 18px; }
      .hero { margin-top: 12px; padding: 18px; }
      .desc, .small { color: var(--muted); }
      .small { font-size: 13px; }
      .btn {
        min-height: 38px;
        padding: 8px 12px;
        border: 1px solid var(--blue);
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
        font-weight: 850;
      }
      .btn.secondary { background: #fff; color: var(--blue); }
      .btn.green { border-color: var(--green); background: var(--green); }
      .btn.ghost { border-color: var(--line); background: #fff; color: var(--ink); }
      .actions, .chips, .top-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .top-actions { justify-content: flex-end; }
      .chips { margin-top: 10px; }
      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: #334155;
        font-size: 13px;
        font-weight: 850;
        white-space: nowrap;
      }
      .blue { border-color: #bfdbfe; background: var(--soft-blue); color: var(--blue); }
      .green { border-color: #bde7cb; background: var(--soft-green); color: var(--green); }
      .amber { border-color: #f4d58d; background: var(--soft-amber); color: var(--amber); }
      .red { border-color: #f4b3ad; background: var(--soft-red); color: var(--red); }
      .layout {
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr) 330px;
        gap: 12px;
        margin-top: 12px;
        align-items: start;
      }
      .panel, .card { padding: 14px; }
      .flow-list, .group-list, .preview-list, .checks { display: grid; gap: 8px; }
      .flow-row, .group-card, .preview-row {
        width: 100%;
        padding: 11px;
        text-align: left;
      }
      .flow-row.active, .group-card.active { border-color: var(--blue); background: var(--soft-blue); }
      .row-title { display: block; font-weight: 950; color: var(--ink); }
      .row-meta { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
      .row-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; align-items: center; }
      .main-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      label { display: block; margin-bottom: 4px; color: #334155; font-size: 13px; font-weight: 850; }
      input, textarea, select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fff;
      }
      textarea { min-height: 96px; resize: vertical; }
      .field + .field { margin-top: 10px; }
      .check {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 8px;
        align-items: start;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcff;
      }
      input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--blue); }
      .toast {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #bde7cb;
        border-radius: 8px;
        background: var(--soft-green);
        color: var(--green);
        font-weight: 850;
      }
      .preview-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
      .sortable { display: grid; gap: 8px; margin-top: 8px; }
      @media (max-width: 1040px) {
        .layout { grid-template-columns: 1fr; }
        .main-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 760px) {
        .app { width: min(100% - 18px, 1240px); padding-top: 10px; }
        .topbar { align-items: flex-start; flex-direction: column; }
        .flow-list, .group-list { display: grid; overflow: visible; padding-bottom: 0; }
        .flow-row, .group-card { min-width: 0; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <a class="brand" href="#">FlowMe Creator</a>
        <div class="top-actions">
          <button class="btn secondary" type="button" id="showQueue">점검 필요한 Flow</button>
          <button class="btn green" type="button" id="publishGroup">묶음 공개 준비</button>
        </div>
      </header>

      <section class="hero">
        <p class="small" style="font-weight:900;color:var(--blue);margin-bottom:6px">제작자 운영판</p>
        <h1>원문을 Flow로 만들고, 공개한 Flow들을 묶어서 운영한다</h1>
        <p class="desc">제작자는 매번 새 폼을 채우는 것이 아니라, 자기 콘텐츠에서 만든 Flow들을 공개 상태와 묶음 구조로 관리한다.</p>
        <div class="chips">
          <span class="chip blue">단일 Flow 관리</span>
          <span class="chip green">사용자 결과 미리보기</span>
          <span class="chip amber">컬렉션/커리큘럼 분리</span>
          <span class="chip red">자동 발행 아님</span>
        </div>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>내 Flow</h2>
          <p class="desc">원문에서 변환한 작은 Flow 단위입니다.</p>
          <div class="flow-list" id="flowList"></div>
        </aside>

        <section class="panel" id="flowEditor"></section>

        <aside class="panel">
          <h2>묶음 관리</h2>
          <p class="desc">같은 Flow라도 묶음 타입에 따라 사용자 경험이 달라집니다.</p>
          <div class="group-list" id="groupList"></div>
          <div class="card" style="margin-top:12px">
            <h3 id="groupTitle">묶음 미리보기</h3>
            <p class="desc" id="groupDesc"></p>
            <div class="preview-list" id="groupPreview"></div>
          </div>
        </aside>
      </section>
    </main>

    <script>
      const flows = [
        {
          id: "moving",
          title: "이사할 때 체크리스트",
          source: "아정당 이사 체크리스트",
          url: "https://www.ajd.co.kr/contents/basic-tip/detail/%EC%9D%B4%EC%82%AC%ED%95%A0_%EB%95%8C_%EC%B2%B4%ED%81%AC%EB%A6%AC%EC%8A%A4%ED%8A%B8_%EC%83%81%EC%84%B8_%EC%A0%95%EB%A6%AC-47214",
          artifact: "캘린더 + 날짜별 체크",
          status: "공개",
          input: "이사일",
          risk: "낮음",
          maturity: "대표 가능",
          group: "collection",
          userPreview: ["이사일 입력", "D-30/D-10/D-Day 일정 생성", "업체 연락처와 보류 메모"]
        },
        {
          id: "usedcar",
          title: "중고차 방문 당일 체크",
          source: "겟차 차량 상태 체크리스트",
          url: "https://web.getcha.kr/blog/used-car-condition-checklist-guide",
          artifact: "방문일 + 현장 체크",
          status: "공개",
          input: "방문일",
          risk: "중간",
          maturity: "대표 가능",
          group: "channel",
          userPreview: ["방문일 저장", "성능기록부/외관/시운전 순서 체크", "계약 전 질문 메모"]
        },
        {
          id: "school",
          title: "초등학교 입학 준비물",
          source: "웰로/동작구 입학준비물",
          url: "https://www.welfarehello.com/community/hometownNews/%EC%9A%B0%EB%A6%AC%EC%95%84%EC%9D%B4-%EC%84%A4%EB%A0%88%EB%8A%94-%EC%B2%AB-%EC%B6%9C%EB%B0%9C-%EC%B4%88%EB%93%B1%ED%95%99%EA%B5%90-%EC%9E%85%ED%95%99%EC%A4%80%EB%B9%84%EB%AC%BC-%EC%B2%B4%ED%81%AC%EB%A6%AC%EC%8A%A4%ED%8A%B8--fdcb3d95-44e4-48eb-9ce8-67bed2640c48",
          artifact: "준비물 체크리스트",
          status: "수정 필요",
          input: "없음",
          risk: "낮음",
          maturity: "보강 후 공개",
          group: "collection",
          userPreview: ["준비물 체크", "학교 공지 메모", "필요하면 날짜 추가"]
        },
        {
          id: "workout",
          title: "초보 홈트 영상 실행",
          source: "YouTube 초보 전신운동 영상",
          url: "https://www.youtube.com/watch?v=W4SpM2gxGdE",
          artifact: "반복 운동 일정",
          status: "점검 필요",
          input: "시작일, 요일, 시간",
          risk: "건강 주의",
          maturity: "조건부",
          group: "channel",
          userPreview: ["운동 요일 선택", "반복 일정 생성", "영상 열기와 중단 조건"]
        },
        {
          id: "craft",
          title: "루돌프 스퀴시 만들기",
          source: "SEOSWEET CRAFT 무료 도안 영상",
          url: "https://www.youtube.com/watch?v=REurKhkEKz4",
          artifact: "버킷 항목 + 준비물",
          status: "공개",
          input: "놀이 날짜 optional",
          risk: "낮음",
          maturity: "가벼운 저장 자료",
          group: "channel",
          userPreview: ["버킷에 담기", "준비물 확인", "나중에 놀이 날짜 추가"]
        },
        {
          id: "stuckyi",
          title: "스투키 물주기",
          source: "에픽플랜츠 스투키 관리법",
          url: "https://epicplants.tistory.com/entry/dracaena-stuckyi-care",
          artifact: "반복 일정 + 관리 메모",
          status: "공개",
          input: "첫 물주기 날짜",
          risk: "낮음",
          maturity: "대표 가능",
          group: "channel",
          userPreview: ["첫 물주기일 입력", "2~3주 후보 생성", "속 흙과 과습 상태 체크"]
        },
        {
          id: "math",
          title: "중1 수학 단원별 공부",
          source: "수학방 중1 수학 목차",
          url: "https://mathbang.net/13",
          artifact: "단원별 진도표 + 오답표",
          status: "초안",
          input: "시작일, 공부 요일, 시험범위",
          risk: "낮음",
          maturity: "Flow of Flow 후보",
          group: "flowof",
          userPreview: ["단원 선택", "개념/문제/오답 패턴 반복", "단원별 일부 저장"]
        }
      ];

      const groups = [
        {
          id: "channel",
          title: "제작자 채널",
          desc: "서로 다른 단일 Flow를 제작자 홈에 모읍니다. 하위 Flow 성격은 달라도 됩니다.",
          includes: ["usedcar", "workout", "craft", "stuckyi"]
        },
        {
          id: "collection",
          title: "생활 전환 컬렉션",
          desc: "이사, 입학처럼 생활 전환 시점에 필요한 Flow를 주제별로 모읍니다. 사용자는 필요한 것만 저장합니다.",
          includes: ["moving", "school"]
        },
        {
          id: "program",
          title: "커리큘럼/프로그램",
          desc: "큰 목표를 단계로 나누고 각 단계에 서로 다른 Flow를 붙입니다. 전체 저장과 단계 저장이 모두 필요합니다.",
          includes: ["math", "workout"]
        },
        {
          id: "flowof",
          title: "진짜 Flow of Flow",
          desc: "같은 실행 패턴이 하위 Flow에 반복됩니다. 현재는 중1 수학 단원별 공부만 후보로 둡니다.",
          includes: ["math"]
        }
      ];

      const state = {
        active: "moving",
        group: "channel",
        toast: "",
        checks: {
          source: true,
          artifact: true,
          input: true,
          safety: false,
          preview: true
        }
      };

      const $ = (id) => document.getElementById(id);
      const activeFlow = () => flows.find((flow) => flow.id === state.active) || flows[0];
      const activeGroup = () => groups.find((group) => group.id === state.group) || groups[0];

      function statusClass(status) {
        if (status === "공개") return "green";
        if (status === "초안") return "blue";
        if (status.includes("점검") || status.includes("수정")) return "amber";
        return "red";
      }

      function renderFlowList() {
        $("flowList").innerHTML = flows.map((flow) => `
          <button class="flow-row ${flow.id === state.active ? "active" : ""}" type="button" data-flow="${flow.id}">
            <span class="row-title">${flow.title}</span>
            <span class="row-meta">${flow.artifact}</span>
            <span class="row-foot">
              <span class="small">${flow.source}</span>
              <span class="chip ${statusClass(flow.status)}">${flow.status}</span>
            </span>
          </button>
        `).join("");
      }

      function renderGroupList() {
        $("groupList").innerHTML = groups.map((group) => `
          <button class="group-card ${group.id === state.group ? "active" : ""}" type="button" data-group="${group.id}">
            <span class="row-title">${group.title}</span>
            <span class="row-meta">${group.includes.length}개 Flow</span>
          </button>
        `).join("");
      }

      function renderEditor() {
        const flow = activeFlow();
        $("flowEditor").innerHTML = `
          <h2>${flow.title}</h2>
          <p class="desc">${flow.source}에서 만든 실행 단위입니다.</p>
          <div class="chips">
            <span class="chip ${statusClass(flow.status)}">${flow.status}</span>
            <span class="chip blue">${flow.artifact}</span>
            <span class="chip amber">${flow.risk}</span>
          </div>

          <div class="main-grid" style="margin-top:12px">
            <article class="card">
              <h3>Flow 설정</h3>
              <div class="field">
                <label for="titleInput">사용자에게 보일 이름</label>
                <input id="titleInput" value="${flow.title}">
              </div>
              <div class="field">
                <label for="artifactInput">생성되는 결과물</label>
                <input id="artifactInput" value="${flow.artifact}">
              </div>
              <div class="field">
                <label for="inputInput">사용자 입력</label>
                <input id="inputInput" value="${flow.input}">
              </div>
              <div class="field">
                <label for="sourceInput">원문 URL</label>
                <input id="sourceInput" value="${flow.url}">
              </div>
            </article>

            <article class="card">
              <h3>공개 전 점검</h3>
              <div class="checks">
                ${[
                  ["source", "원문에서 온 순서/조건/간격이 남아 있음"],
                  ["artifact", "캘린더/체크리스트/표/버킷 중 결과물이 분명함"],
                  ["input", "사용자 입력이 캘린더/리마인더 수준을 넘지 않음"],
                  ["safety", "공식 정보, 경험, 주의 문구가 분리됨"],
                  ["preview", "사용자 저장 결과를 눌러볼 수 있음"]
                ].map(([key, label]) => `
                  <label class="check">
                    <input type="checkbox" data-check="${key}" ${state.checks[key] ? "checked" : ""}>
                    <span>${label}</span>
                  </label>
                `).join("")}
              </div>
            </article>
          </div>

          <article class="card" style="margin-top:12px">
            <h3>사용자 저장 결과</h3>
            <div class="preview-list">
              ${flow.userPreview.map((item, index) => `
                <div class="preview-row">
                  <span><strong>${index + 1}. ${item}</strong><span class="small">사용자가 저장 후 실제로 보게 될 실행 cue</span></span>
                  <span class="chip blue">보임</span>
                </div>
              `).join("")}
            </div>
          </article>

          <div class="actions" style="margin-top:12px">
            <button class="btn" type="button" id="updateFlow">Flow 수정 저장</button>
            <button class="btn secondary" type="button" id="addToGroup">현재 묶음에 추가</button>
            <button class="btn green" type="button" id="publishFlow">공개 상태 바꾸기</button>
          </div>
          ${state.toast ? `<div class="toast">${state.toast}</div>` : ""}
        `;
      }

      function renderGroupPreview() {
        const group = activeGroup();
        $("groupTitle").textContent = group.title;
        $("groupDesc").textContent = group.desc;
        $("groupPreview").innerHTML = group.includes.map((id) => {
          const flow = flows.find((item) => item.id === id);
          if (!flow) return "";
          return `
            <div class="preview-row">
              <span>
                <strong>${flow.title}</strong>
                <span class="small">${flow.artifact} · ${flow.input}</span>
              </span>
              <span class="chip ${statusClass(flow.status)}">${flow.status}</span>
            </div>
          `;
        }).join("");
      }

      function render() {
        renderFlowList();
        renderGroupList();
        renderEditor();
        renderGroupPreview();
      }

      document.addEventListener("click", (event) => {
        const flowButton = event.target.closest("[data-flow]");
        if (flowButton) {
          state.active = flowButton.dataset.flow;
          state.toast = "";
          render();
          return;
        }
        const groupButton = event.target.closest("[data-group]");
        if (groupButton) {
          state.group = groupButton.dataset.group;
          state.toast = "";
          render();
          return;
        }
        const check = event.target.closest("[data-check]");
        if (check) {
          state.checks[check.dataset.check] = check.checked;
          return;
        }
        if (event.target.id === "updateFlow") {
          state.toast = "사용자 이름, 결과물, 입력값을 저장했습니다. 공개 중인 사용자는 기존 버전으로 남습니다.";
          render();
          return;
        }
        if (event.target.id === "addToGroup") {
          const group = activeGroup();
          if (!group.includes.includes(state.active)) group.includes.push(state.active);
          state.toast = `${activeFlow().title}을 ${group.title}에 추가했습니다.`;
          render();
          return;
        }
        if (event.target.id === "publishFlow") {
          const flow = activeFlow();
          flow.status = flow.status === "공개" ? "초안" : "공개";
          state.toast = `${flow.title} 공개 상태를 ${flow.status}(으)로 바꿨습니다.`;
          render();
          return;
        }
        if (event.target.id === "showQueue") {
          const target = flows.find((flow) => flow.status !== "공개") || flows[0];
          state.active = target.id;
          state.toast = "점검이 필요한 Flow를 열었습니다.";
          render();
          return;
        }
        if (event.target.id === "publishGroup") {
          state.toast = `${activeGroup().title} 공개 전 점검 화면을 열었습니다.`;
          render();
        }
      });

      render();
    </script>
  </body>
</html>
