<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowMe 실행형 지도 Top 5</title>
    <style>
      :root {
        --bg: #eef3f8;
        --panel: #ffffff;
        --line: #d7e0ea;
        --line-strong: #b7c6d8;
        --text: #111827;
        --muted: #566273;
        --soft: #f6f9fc;
        --blue: #2563eb;
        --blue-soft: #eaf1ff;
        --green: #0f766e;
        --green-soft: #e8f6f3;
        --amber: #b45309;
        --amber-soft: #fff5df;
        --shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      a {
        color: var(--blue);
        font-weight: 800;
      }

      .page {
        width: min(1120px, 100%);
        margin: 0 auto;
        padding: 16px;
      }

      .topbar,
      .hero,
      .panel,
      .surface {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        margin-bottom: 12px;
      }

      .brand {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .top-note {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .hero {
        padding: 18px;
        margin-bottom: 12px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 900;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 10px;
        font-size: clamp(28px, 4vw, 46px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      h2 {
        margin-bottom: 10px;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      h3 {
        margin-bottom: 6px;
        font-size: 17px;
        letter-spacing: 0;
      }

      .desc {
        margin-bottom: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .chips,
      .button-row,
      .selector,
      .mode-tabs,
      .artifact-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 6px 10px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--soft);
        color: var(--text);
        font-size: 13px;
        font-weight: 850;
        line-height: 1.2;
      }

      .chip.blue {
        border-color: #b8cdfb;
        background: var(--blue-soft);
        color: #1d4ed8;
      }

      .chip.green {
        border-color: #b9ded8;
        background: var(--green-soft);
        color: var(--green);
      }

      .chip.amber {
        border-color: #f5d393;
        background: var(--amber-soft);
        color: var(--amber);
      }

      .selector {
        margin: 14px 0 12px;
      }

      .selector button,
      .mode-tabs button,
      .unit-button,
      .saved-button,
      .btn {
        border: 1px solid var(--line-strong);
        background: #fff;
        color: var(--text);
        cursor: pointer;
      }

      .selector button {
        flex: 1 1 160px;
        min-height: 56px;
        padding: 10px 12px;
        border-radius: 12px;
        font-weight: 900;
        text-align: left;
      }

      .selector button.active {
        border-color: var(--blue);
        background: var(--blue-soft);
        color: #1d4ed8;
      }

      .mode-tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #e7edf5;
        margin-bottom: 12px;
      }

      .mode-tabs button {
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #334155;
        font-weight: 900;
      }

      .mode-tabs button.active {
        background: #fff;
        color: var(--blue);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      }

      .view { display: none; }
      .view.active { display: block; }

      .grid {
        display: grid;
        grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1.3fr);
        gap: 12px;
        align-items: start;
      }

      .panel,
      .surface {
        padding: 16px;
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label,
      .label {
        color: #344256;
        font-size: 13px;
        font-weight: 900;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        padding: 11px 12px;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
        line-height: 1.5;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 11px 14px;
        border-radius: 12px;
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
        font-weight: 950;
      }

      .btn.secondary {
        background: #fff;
        color: var(--blue);
      }

      .btn.ghost {
        background: var(--soft);
        color: var(--text);
        border-color: var(--line);
      }

      .btn:focus-visible,
      .selector button:focus-visible,
      .mode-tabs button:focus-visible,
      .unit-button:focus-visible,
      .saved-button:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.28);
        outline-offset: 2px;
      }

      .source-box,
      .note {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--soft);
        padding: 12px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .unit-button,
      .saved-button,
      .check-row,
      .artifact-card {
        width: 100%;
        border-radius: 12px;
        padding: 12px;
      }

      .unit-button,
      .saved-button,
      .artifact-card {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        text-align: left;
      }

      .unit-button.active,
      .saved-button.active {
        border-color: var(--blue);
        background: var(--blue-soft);
      }

      .num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #e2e8f0;
        color: #334155;
        font-size: 13px;
        font-weight: 950;
      }

      .item-title {
        margin: 0;
        font-size: 15px;
        line-height: 1.35;
        font-weight: 950;
      }

      .small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .progress {
        height: 8px;
        border-radius: 999px;
        background: #e7edf5;
        overflow: hidden;
      }

      .progress span {
        display: block;
        width: var(--value, 0%);
        height: 100%;
        border-radius: inherit;
        background: var(--blue);
      }

      .check-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        border: 1px solid var(--line);
        background: #fff;
      }

      .check-row input {
        width: 22px;
        height: 22px;
        margin-top: 2px;
        accent-color: var(--blue);
      }

      .check-row.done {
        background: #f0fdf4;
        border-color: #bbf7d0;
      }

      .surface {
        border-style: dashed;
        background: #fbfdff;
      }

      .empty {
        border: 1px dashed var(--line-strong);
        border-radius: 14px;
        padding: 18px;
        background: var(--soft);
      }

      .toast {
        border: 1px solid #b9ded8;
        border-radius: 12px;
        padding: 12px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 14px;
        font-weight: 850;
        line-height: 1.5;
      }

      .split {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .split .artifact-card {
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
      }

      .split .artifact-card .chip {
        grid-column: 2;
        justify-self: start;
      }

      @media (max-width: 760px) {
        .page {
          padding: 10px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .hero,
        .panel,
        .surface {
          padding: 14px;
        }

        h1 {
          font-size: 30px;
        }

        .grid,
        .field-grid,
        .split {
          grid-template-columns: 1fr;
        }

        .selector button,
        .unit-button,
        .saved-button,
        .artifact-card {
          grid-template-columns: auto minmax(0, 1fr);
        }

        .unit-button .chip,
        .saved-button .chip,
        .artifact-card .chip {
          grid-column: 2;
          justify-self: start;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">FlowMe</div>
        <p class="top-note">원문 콘텐츠를 전체 지도와 오늘 실행 카드로 나눠 저장하는 화면</p>
      </header>

      <section class="hero">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 id="heroTitle"></h1>
        <p class="desc" id="heroDesc"></p>
        <div class="chips" id="heroChips" style="margin-top:14px"></div>
      </section>

      <nav class="selector" id="flowSelector" aria-label="콘텐츠 예시"></nav>

      <nav class="mode-tabs" aria-label="화면 선택">
        <button class="active" type="button" data-view="content">콘텐츠</button>
        <button type="button" data-view="app">내 앱 실행</button>
        <button type="button" data-view="creator">제작자</button>
      </nav>

      <section class="view active" id="content-view">
        <div class="grid">
          <section class="panel">
            <p class="eyebrow">저장 전</p>
            <h2 id="contentTitle"></h2>
            <p class="desc" id="contentSummary"></p>
            <div class="field-grid" id="inputFields" style="margin-top:14px"></div>
            <div class="button-row" style="margin-top:14px">
              <button class="btn" type="button" id="saveAll"></button>
              <button class="btn secondary" type="button" id="saveOne"></button>
            </div>
            <div id="contentToast" class="toast" hidden style="margin-top:12px"></div>
            <div class="source-box" id="contentSource" style="margin-top:12px"></div>
          </section>

          <section class="panel">
            <p class="eyebrow">생성될 결과</p>
            <h2>전체 지도와 오늘 실행이 분리됩니다</h2>
            <div class="split" id="artifactCards"></div>
            <div class="surface" style="margin-top:12px">
              <div class="button-row" style="justify-content:space-between; align-items:center">
                <h3 style="margin-bottom:0">반복 실행 단위</h3>
                <span class="chip blue" id="unitCount"></span>
              </div>
              <div class="stack" id="contentUnits" style="margin-top:10px"></div>
            </div>
          </section>
        </div>
      </section>

      <section class="view" id="app-view">
        <div class="grid">
          <aside class="panel">
            <p class="eyebrow">내 앱</p>
            <h2>저장한 실행 지도</h2>
            <p class="desc">저장한 콘텐츠만 내 앱에 남고, 오늘 볼 항목은 한 카드로 줄어듭니다.</p>
            <div class="stack" id="savedList" style="margin-top:12px"></div>
          </aside>

          <section class="panel" id="appMain"></section>
        </div>
      </section>

      <section class="view" id="creator-view">
        <div class="grid">
          <section class="panel">
            <p class="eyebrow">제작자 운영</p>
            <h2>원문에서 반복 단위를 가져옵니다</h2>
            <p class="desc">제작자는 큰 카테고리를 먼저 만들기보다, 원문 안에 반복되는 단위를 선택해 사용자 저장 화면을 만듭니다.</p>
            <div class="field" style="margin-top:14px">
              <label for="sourceUrl">원문 URL</label>
              <input id="sourceUrl" type="url" readonly />
            </div>
            <div class="button-row" style="margin-top:14px">
              <button class="btn" type="button" id="importUnits">반복 단위 가져오기</button>
              <button class="btn secondary" type="button" id="previewContent">사용자 화면 보기</button>
            </div>
            <div id="creatorToast" class="toast" hidden style="margin-top:12px"></div>
            <div class="source-box" id="creatorBoundary" style="margin-top:12px"></div>
          </section>

          <section class="panel">
            <p class="eyebrow">운영판 미리보기</p>
            <h2 id="creatorTitle"></h2>
            <div class="source-box" id="creatorPattern"></div>
            <div class="surface" style="margin-top:12px">
              <h3>반복 단위</h3>
              <div class="stack" id="creatorUnits" style="margin-top:10px"></div>
            </div>
            <div class="surface" style="margin-top:12px">
              <h3>사용자에게 보일 결과</h3>
              <div class="stack" id="creatorPreview" style="margin-top:10px"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script>
      const flows = [
        {

        {

          chips: ["작물별", "표 + 캘린더", "필요 작물만 저장", "시즌형"],
          inputs: [

          ],
          saveAll: "작물 재배표 저장하기",

      const state = {
        flow: "run",
        view: "content",
        unit: 0,
        saved: {},
        checked: {},
        notes: {}
      };

      const $ = (id) => document.getElementById(id);
      const flow = () => flows.find((item) => item.id === state.flow);
      const unit = () => flow().units[state.unit] || flow().units[0];
      const sourceLink = (item) => `<a href="${item.sourceUrl}" target="_blank" rel="noreferrer">${item.sourceName}</a>`;
      const checkKey = (index) => `${state.flow}:${state.unit}:${index}`;
      const doneCount = (item = flow(), unitIndex = state.unit) =>
        item.units[unitIndex].checks.filter((_, index) => state.checked[`${item.id}:${unitIndex}:${index}`]).length;

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function setView(nextView) {
        state.view = nextView;
        render();
      }

      function saveCurrent(partial = false) {
        state.saved[state.flow] = {
          partial,
          unit: state.unit,
          savedAt: new Date().toISOString()
        };
        state.view = "app";
        render();
      }

      function renderShell() {
        const item = flow();
        $("heroEyebrow").textContent = `${item.creator} 원문 기반`;
        $("heroTitle").textContent = item.hero;
        $("heroDesc").textContent = item.userJob;
        $("heroChips").innerHTML = item.chips.map((chip, index) => `<span class="chip ${index === 0 ? "blue" : index === 1 ? "green" : ""}">${chip}</span>`).join("");
        $("flowSelector").innerHTML = flows.map((entry) => `
          <button class="${entry.id === state.flow ? "active" : ""}" type="button" data-flow="${entry.id}">
            ${entry.short}
            <span class="small">${entry.saved ? "저장됨" : entry.creator}</span>
          </button>
        `).join("");
        document.querySelectorAll("[data-view]").forEach((button) => {
          button.classList.toggle("active", button.dataset.view === state.view);
        });
      }

      function unitButton(item, entry, index) {
        const complete = doneCount(item, index);
        const total = entry.checks.length;
        const pct = Math.max(complete ? Math.round((complete / total) * 100) : 6, 6);
        return `
          <button class="unit-button ${index === state.unit ? "active" : ""}" type="button" data-unit="${index}">
            <span class="num">${index + 1}</span>
            <span>
              <p class="item-title">${entry.name}</p>
              <span class="small">${entry.sub}</span>
              <span class="progress" style="display:block; margin-top:8px"><span style="--value:${pct}%"></span></span>
            </span>
            <span class="chip ${complete ? "green" : "amber"}">${complete}/${total}</span>
          </button>
        `;
      }

      function renderContent() {
        const item = flow();
        const selected = unit();
        $("contentTitle").textContent = item.hero;
        $("contentSummary").textContent = item.summary;
        $("inputFields").innerHTML = item.inputs.map(([id, label, type, value]) => `
          <div class="field">
            <label for="${item.id}-${id}">${label}</label>
            <input id="${item.id}-${id}" type="${type}" value="${escapeHtml(value)}" />
          </div>
        `).join("");
        $("saveAll").textContent = item.saveAll;
        $("saveOne").textContent = `${selected.name}만 저장`;
        $("contentToast").hidden = true;
        $("contentSource").innerHTML = `원문: ${sourceLink(item)}<br>${escapeHtml(item.boundary)}`;
        $("artifactCards").innerHTML = item.artifact.map(([title, body, meta], index) => `
          <div class="artifact-card">
            <span class="num">${index + 1}</span>
            <span>
              <p class="item-title">${title}</p>
              <span class="small">${body}</span>
            </span>
            <span class="chip ${index === 0 ? "blue" : "green"}">${meta}</span>
          </div>
        `).join("");
        $("unitCount").textContent = `${item.units.length}개 단위`;
        $("contentUnits").innerHTML = item.units.map((entry, index) => unitButton(item, entry, index)).join("");
      }

      function renderSavedList() {
        const savedIds = Object.keys(state.saved);
        if (!savedIds.length) {
          $("savedList").innerHTML = `
            <div class="empty">
              <h3>아직 저장한 콘텐츠가 없습니다</h3>
              <p class="desc">콘텐츠 페이지에서 일정을 만들면 이곳에 오늘 실행 카드가 생깁니다.</p>
              <button class="btn" type="button" data-view="content" style="margin-top:12px">콘텐츠 페이지로 가기</button>
            </div>
          `;
          return;
        }
        $("savedList").innerHTML = savedIds.map((id) => {
          const entry = flows.find((item) => item.id === id);
          const saved = state.saved[id];
          const visibleUnit = saved.partial ? entry.units[saved.unit].name : "전체 저장";
          return `
            <button class="saved-button ${entry.id === state.flow ? "active" : ""}" type="button" data-flow="${entry.id}">
              <span class="num">${flows.indexOf(entry) + 1}</span>
              <span>
                <p class="item-title">${entry.short}</p>
                <span class="small">${visibleUnit}</span>
              </span>
              <span class="chip green">내 앱</span>
            </button>
          `;
        }).join("");
      }

      function renderCheckRows() {
        return unit().checks.map((label, index) => {
          const key = checkKey(index);
          const done = Boolean(state.checked[key]);
          return `
            <label class="check-row ${done ? "done" : ""}">
              <input type="checkbox" data-check="${index}" ${done ? "checked" : ""} />
              <span>
                <p class="item-title">${label}</p>
                <span class="small">${index === 0 ? "원문 또는 영상으로 돌아가기" : index === unit().checks.length - 1 ? "다음 방문 때 다시 볼 기록" : "오늘 실행"}</span>
              </span>
            </label>
          `;
        }).join("");
      }

      function renderApp() {
        renderSavedList();
        const item = flow();
        if (!state.saved[item.id]) {
          $("appMain").innerHTML = `
            <p class="eyebrow">저장 전</p>
            <h2>${item.short}은 아직 내 앱에 없습니다</h2>
            <p class="desc">${item.saveAll}를 누르면 오늘 실행 카드와 전체 진행 지도가 이곳에 생깁니다.</p>
            <div class="button-row" style="margin-top:14px">
              <button class="btn" type="button" data-view="content">저장 설정 보기</button>
            </div>
          `;
          return;
        }
        const selected = unit();
        const complete = doneCount(item, state.unit);
        const pct = Math.round((complete / selected.checks.length) * 100);
        $("appMain").innerHTML = `
          <p class="eyebrow">오늘 실행</p>
          <h2>${item.short} · ${selected.name}</h2>
          <p class="desc">${selected.detail}</p>
          <div class="chips" style="margin:12px 0">
            <span class="chip blue">${complete}/${selected.checks.length} 완료</span>
            <span class="chip green">${item.artifact[0][0]}</span>
            <span class="chip">${item.creator}</span>
          </div>
          <div class="progress" style="margin-bottom:12px"><span style="--value:${Math.max(pct, 6)}%"></span></div>
          <div class="stack">${renderCheckRows()}</div>
          <div class="field" style="margin-top:12px">
            <label for="note-${item.id}">짧은 메모</label>
            <textarea id="note-${item.id}" data-note="${item.id}" placeholder="다음에 다시 볼 내용만 짧게 남기기">${escapeHtml(state.notes[item.id] || "")}</textarea>
          </div>
          <div class="source-box" style="margin-top:12px">원문: ${sourceLink(item)}<br>${escapeHtml(item.boundary)}</div>
          <div class="surface" style="margin-top:12px">
            <div class="button-row" style="justify-content:space-between; align-items:center">
              <h3 style="margin-bottom:0">전체 지도</h3>
              <span class="chip blue">${item.units.length}개 단위</span>
            </div>
            <div class="stack" style="margin-top:10px">${item.units.map((entry, index) => unitButton(item, entry, index)).join("")}</div>
          </div>
        `;
      }

      function renderCreator() {
        const item = flow();
        $("sourceUrl").value = item.sourceUrl;
        $("creatorTitle").textContent = `${item.short} 운영판`;
        $("creatorPattern").textContent = item.pattern;
        $("creatorBoundary").innerHTML = `출처와 주의 경계: ${escapeHtml(item.boundary)}`;
        $("creatorToast").hidden = true;
        $("creatorUnits").innerHTML = item.units.map((entry, index) => unitButton(item, entry, index)).join("");
        $("creatorPreview").innerHTML = [
          ["사용자 저장 화면", item.saveAll, "버튼"],
          ["내 앱 실행 화면", `${item.units[0].name} 오늘 카드`, "체크"],
          ["원문 연결", item.sourceName, "링크"]
        ].map(([title, body, chip], index) => `
          <div class="artifact-card">
            <span class="num">${index + 1}</span>
            <span>
              <p class="item-title">${title}</p>
              <span class="small">${body}</span>
            </span>
            <span class="chip ${index === 0 ? "blue" : "green"}">${chip}</span>
          </div>
        `).join("");
      }

      function render() {
        if (state.unit >= flow().units.length) state.unit = 0;
        renderShell();
        renderContent();
        renderApp();
        renderCreator();
        document.querySelectorAll(".view").forEach((view) => view.classList.remove("active"));
        $(`${state.view}-view`).classList.add("active");
        document.querySelectorAll("[data-view]").forEach((button) => {
          button.classList.toggle("active", button.dataset.view === state.view);
        });
      }

      document.addEventListener("click", (event) => {
        const flowButton = event.target.closest("[data-flow]");
        if (flowButton) {
          state.flow = flowButton.dataset.flow;
          state.unit = 0;
          render();
          return;
        }

        const viewButton = event.target.closest("[data-view]");
        if (viewButton) {
          setView(viewButton.dataset.view);
          return;
        }

        const unitButton = event.target.closest("[data-unit]");
        if (unitButton) {
          state.unit = Number(unitButton.dataset.unit);
          render();
          return;
        }

        if (event.target.id === "saveAll") {
          saveCurrent(false);
          return;
        }

        if (event.target.id === "saveOne") {
          saveCurrent(true);
          return;
        }

        if (event.target.id === "importUnits") {
          $("creatorToast").hidden = false;
          $("creatorToast").textContent = `${flow().units.length}개 반복 단위를 원문 구조에서 가져왔습니다.`;
          return;
        }

        if (event.target.id === "previewContent") {
          setView("content");
        }
      });

      document.addEventListener("change", (event) => {
        if (event.target.matches("[data-check]")) {
          state.checked[checkKey(Number(event.target.dataset.check))] = event.target.checked;
          render();
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.matches("[data-note]")) {
          state.notes[event.target.dataset.note] = event.target.value;
        }
      });

      render();
    </script>
  </body>
</html>
