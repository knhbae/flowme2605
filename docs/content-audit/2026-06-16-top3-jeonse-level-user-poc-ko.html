<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlowMe 생활 실행 Flow 3개</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #fff;
      --soft: #f8fafc;
      --soft-2: #eef4fb;
      --line: #d8e2ef;
      --line-strong: #bac8da;
      --text: #101827;
      --muted: #5d697b;
      --blue: #1f5fbf;
      --blue-soft: #eaf2ff;
      --green: #0f7a4a;
      --green-soft: #e8f7ef;
      --amber: #9a6100;
      --amber-soft: #fff6df;
      --red: #b42318;
      --red-soft: #fff1ef;
      --shadow: 0 14px 32px rgba(16, 24, 39, .08);
      --radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #fbfdff 0, var(--bg) 420px);
      font-size: 16px;
      line-height: 1.56;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 8px;
      font-size: clamp(23px, 3vw, 34px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    h3 {
      margin-bottom: 6px;
      font-size: 20px;
      line-height: 1.28;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 850;
    }

    a { color: var(--blue); text-underline-offset: 3px; }

    .page {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 16px 0 64px;
    }

    .topbar, .hero, .nav, .surface, .panel, .calendar, .notice, .event-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 12px 16px;
      box-shadow: 0 1px 2px rgba(16, 24, 39, .04);
    }

    .brand {
      color: var(--blue);
      font-size: 24px;
      font-weight: 950;
      text-decoration: none;
    }

    .hero {
      margin-top: 12px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin-bottom: 6px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .desc { color: var(--muted); }

    .chips, .button-row, .source-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chips { margin-top: 12px; }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      color: #334155;
      font-size: 13px;
      font-weight: 800;
    }

    .chip.blue { border-color: #bfdbfe; background: var(--blue-soft); color: #174ea6; }
    .chip.green { border-color: #bde7cb; background: var(--green-soft); color: var(--green); }
    .chip.warn { border-color: #efd08f; background: var(--amber-soft); color: var(--amber); }

    .app {
      display: grid;
      grid-template-columns: 244px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      margin-top: 14px;
    }

    .nav {
      position: sticky;
      top: 12px;
      display: grid;
      gap: 8px;
      padding: 10px;
      box-shadow: var(--shadow);
    }

    .nav button {
      min-height: 74px;
      padding: 11px;
      border: 1px solid transparent;
      background: transparent;
      color: #334155;
      text-align: left;
    }

    .nav b, .nav span { display: block; }
    .nav span { margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 750; }

    .nav button.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: #174ea6;
      box-shadow: inset 0 0 0 1px var(--blue);
    }

    .surface {
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .surface-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff 0, #f8fafc 100%);
    }

    .score {
      align-self: start;
      min-width: 112px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #334155;
      text-align: center;
      font-size: 13px;
      font-weight: 900;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(320px, .88fr) minmax(0, 1.12fr);
      gap: 0;
    }

    .left {
      padding: 16px;
      border-right: 1px solid var(--line);
      background: #f1f5f9;
    }

    .right {
      display: grid;
      gap: 12px;
      padding: 16px;
      background: #fff;
    }

    .panel {
      padding: 14px;
    }

    .panel + .panel { margin-top: 12px; }

    .label {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .field-grid {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: #334155;
      font-size: 13px;
      font-weight: 850;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }

    input, select {
      min-height: 44px;
      padding: 8px 10px;
    }

    textarea {
      min-height: 86px;
      padding: 10px;
      resize: vertical;
    }

    .primary {
      background: var(--blue);
      color: #fff;
      padding: 0 14px;
    }

    .secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      padding: 0 12px;
    }

    .toast {
      display: none;
      margin-top: 10px;
      padding: 9px 10px;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      background: var(--blue-soft);
      color: #174ea6;
      font-size: 13px;
      font-weight: 800;
    }

    .toast.show { display: block; }

    .source-row { margin-top: 8px; }

    .source-row a {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .hero-action {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--soft);
    }

    .big-status {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .status-box {
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .status-box b, .status-box span { display: block; }
    .status-box span { margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 750; }

    .check-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .check {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .check input {
      width: 18px;
      height: 18px;
      min-height: 18px;
      margin-top: 3px;
    }

    .check strong, .check span { display: block; }
    .check span span { margin-top: 2px; color: var(--muted); font-size: 13px; }
    .check.done strong { color: #94a3b8; text-decoration: line-through; }

    .event-list {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .event-item {
      min-height: 48px;
      padding: 9px 10px;
      color: #334155;
      text-align: left;
    }

    .event-item b, .event-item span { display: block; }
    .event-item span { margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 750; }

    .event-item.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: #174ea6;
      box-shadow: inset 0 0 0 1px var(--blue);
    }

    .calendar { overflow: hidden; }

    .calendar-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 0;
    }

    .month-nav {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .month-nav button {
      min-height: 36px;
      padding: 0 9px;
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      font-size: 13px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      margin: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .weekday, .day {
      min-height: 58px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 6px;
      font-size: 12px;
    }

    .weekday {
      min-height: auto;
      background: #eef3f8;
      text-align: center;
      font-weight: 900;
    }

    .day {
      background: #fff;
      color: var(--text);
      text-align: left;
      border-radius: 0;
      font-weight: 750;
    }

    .weekday:nth-child(7n), .day:nth-child(7n) { border-right: 0; }
    .day.empty { background: #f8fafc; color: #cbd5e1; }
    .day.has-event { color: #174ea6; }
    .day.active { background: var(--blue-soft); box-shadow: inset 0 0 0 2px var(--blue); }

    .event-chip {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin-top: 4px;
      padding: 2px 4px;
      overflow: hidden;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      background: var(--blue-soft);
      color: #174ea6;
      font-size: 11px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .notice {
      padding: 10px;
      background: var(--amber-soft);
      color: #795100;
      font-size: 14px;
      font-weight: 750;
    }

    .danger {
      border-color: #f4b4ad;
      background: var(--red-soft);
      color: var(--red);
    }

    .hidden { display: none; }

    @media (max-width: 980px) {
      .app, .workspace { grid-template-columns: 1fr; }
      .nav { position: static; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .left { border-right: 0; border-bottom: 1px solid var(--line); }
    }

    @media (max-width: 660px) {
      .page { width: min(100% - 20px, 1180px); padding-top: 10px; }
      .hero, .surface-head, .left, .right { padding: 14px; }
      .surface-head { grid-template-columns: 1fr; }
      .score { width: 100%; }
      .nav { grid-template-columns: 1fr; }
      .big-status { grid-template-columns: 1fr; }
      .day { min-height: 68px; padding: 5px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="topbar" aria-label="FLOW">
      <a class="brand" href="#">FLOW</a>
      <button class="secondary" type="button" id="reset">현재 Flow 초기화</button>
    </nav>

    <header class="hero">
      <p class="eyebrow">내 Flow</p>
      <h1>저장한 원문을 바로 실행하기</h1>
      <p class="desc">이사, 중고차 방문, 초등 입학 준비를 날짜와 체크 항목으로 정리해 다시 볼 수 있습니다.</p>
      <div class="chips">
        <span class="chip blue">첫 action 우선</span>
        <span class="chip green">사용자 화면만</span>
        <span class="chip warn">캘린더/현장체크/현재단계 분리</span>
      </div>
    </header>

    <section class="app" aria-label="생활 실행 Flow">
      <nav class="nav" id="flow-nav" aria-label="Flow 선택"></nav>
      <article class="surface">
        <header class="surface-head">
          <div>
            <div class="chips" id="flow-tags" style="margin-top:0"></div>
            <h2 id="flow-title"></h2>
            <p class="desc" id="flow-summary"></p>
          </div>
          <span class="score" id="flow-progress">0/0 완료</span>
        </header>
        <div class="workspace">
          <aside class="left">
            <section class="panel" id="setup-panel"></section>
            <section class="panel" id="source-panel"></section>
          </aside>
          <section class="right" id="flow-body"></section>
        </div>
      </article>
    </section>
  </main>

  <script>

      },
      {

    const state = {};
    let currentId = 'moving';

    flows.forEach((flow) => {
      const inputs = {};
      flow.inputs.forEach((input) => inputs[input.key] = input.value || '');
      state[flow.id] = {
        saved: false,
        inputs,
        selected: flow.type === 'timeline' ? flow.events[0].id : flow.sections[0].id,
        selectedDate: '',
        month: '',
        checks: {},
        memos: {},
        toast: ''
      };
    });

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function parseDate(value) {
      return value ? new Date(`${value}T00:00:00`) : null;
    }

    function dateKey(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function shiftDate(value, offset) {
      const date = parseDate(value);
      if (!date) return '';
      date.setDate(date.getDate() + offset);
      return dateKey(date);
    }

    function monthKey(value) {
      const date = parseDate(value);
      return date ? `${date.getFullYear()}-${pad(date.getMonth() + 1)}` : '';
    }

    function shiftMonth(value, amount) {
      const date = parseDate(`${value}-01`);
      date.setMonth(date.getMonth() + amount);
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}`;
    }

    function formatDate(value) {
      const date = parseDate(value);
      if (!date) return '날짜 없음';
      return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 ${dayNames[date.getDay()]}요일`;
    }

    function shortDate(value) {
      const date = parseDate(value);
      if (!date) return '날짜 없음';
      return `${date.getMonth() + 1}/${date.getDate()} ${dayNames[date.getDay()]}`;
    }

    function interpolate(text, flow) {
      return String(text || '').replace(/\{([a-zA-Z0-9_]+)\}/g, (_, key) => state[flow.id].inputs[key] || '미입력');
    }

    function flow() {
      return flows.find((item) => item.id === currentId);
    }

    function timelineEntries(item) {
      return item.events.map((event) => ({
        ...event,
        date: shiftDate(state[item.id].inputs[item.anchor], event.offset)
      })).sort((a, b) => a.date.localeCompare(b.date));
    }

    function activeItem(item) {
      if (item.type === 'timeline') {
        return timelineEntries(item).find((entry) => entry.id === state[item.id].selected) || timelineEntries(item)[0];
      }
      return item.sections.find((section) => section.id === state[item.id].selected) || item.sections[0];
    }

    function allTasks(item) {
      return item.type === 'timeline'
        ? item.events.flatMap((event) => event.tasks.map((task, index) => `${event.id}:${index}`))
        : item.sections.flatMap((section) => section.tasks.map((task, index) => `${section.id}:${index}`));
    }

    function doneCount(item) {
      return allTasks(item).filter((key) => state[item.id].checks[key]).length;
    }

    function taskKey(group, index) {
      return `${group.id}:${index}`;
    }

    function renderNav() {
      document.querySelector('#flow-nav').innerHTML = flows.map((item) => `
        <button type="button" class="${item.id === currentId ? 'active' : ''}" data-flow="${item.id}">
          <b>${item.nav}</b>
          <span>${item.navSub}</span>
        </button>
      `).join('');
      document.querySelectorAll('[data-flow]').forEach((button) => {
        button.addEventListener('click', () => {
          currentId = button.dataset.flow;
          render();
        });
      });
    }

    function inputControl(item, input) {
      const value = state[item.id].inputs[input.key] || '';
      if (input.type === 'select') {
        return `
          <div class="field">
            <label for="${item.id}-${input.key}">${input.label}</label>
            <select id="${item.id}-${input.key}" data-input="${input.key}">
              ${input.options.map((option) => `<option value="${option}" ${option === value ? 'selected' : ''}>${option}</option>`).join('')}
            </select>
          </div>
        `;
      }
      return `
        <div class="field">
          <label for="${item.id}-${input.key}">${input.label}</label>
          <input id="${item.id}-${input.key}" data-input="${input.key}" type="${input.type}" value="${value}" />
        </div>
      `;
    }

    function renderSetup(item) {
      const itemState = state[item.id];
      document.querySelector('#setup-panel').innerHTML = `
        <p class="label">저장 설정</p>
        <h3>${item.setupTitle}</h3>
        <p class="desc">${item.setupText}</p>
        <div class="field-grid">${item.inputs.map((input) => inputControl(item, input)).join('')}</div>
        <div class="button-row" style="margin-top:12px">
          <button class="primary" type="button" id="save-flow">${item.primary}</button>
        </div>
        <p class="toast ${itemState.toast ? 'show' : ''}" role="status">${itemState.toast}</p>
      `;
      document.querySelectorAll('[data-input]').forEach((input) => {
        input.addEventListener('input', () => {
          itemState.inputs[input.dataset.input] = input.value;
          if (item.type === 'timeline') {
            const active = activeItem(item);
            itemState.selectedDate = active.date;
            itemState.month = monthKey(active.date);
          }
          render();
        });
      });
      document.querySelector('#save-flow').addEventListener('click', () => {
        itemState.saved = true;
        itemState.toast = `${item.primary.replace(' 만들기', '')}가 저장되었습니다.`;
        if (item.type === 'timeline') {
          const active = activeItem(item);
          itemState.selectedDate = active.date;
          itemState.month = monthKey(active.date);
        }
        render();
      });

      document.querySelector('#source-panel').innerHTML = `
        <p class="label">원문 / 실행 링크</p>
        <div class="source-row">
          ${item.sources.map(([label, url, kind]) => `<a href="${url}" target="_blank" rel="noreferrer">${kind} · ${label}</a>`).join('')}
        </div>
        <div class="notice ${item.id === 'usedcar' ? 'danger' : ''}" style="margin-top:12px">${item.warning}</div>
      `;
    }

    function renderHeader(item) {
      document.querySelector('#flow-tags').innerHTML = item.tags.map((tag, index) => `<span class="chip ${index === 0 ? 'blue' : index === 1 ? 'green' : 'warn'}">${tag}</span>`).join('');
      document.querySelector('#flow-title').textContent = item.title;
      document.querySelector('#flow-summary').textContent = item.summary;
      document.querySelector('#flow-progress').textContent = `${doneCount(item)}/${allTasks(item).length} 완료`;
    }

    function renderTaskList(item, group) {
      return `
        <div class="check-list">
          ${group.tasks.map((task, index) => {
            const key = taskKey(group, index);
            const checked = !!state[item.id].checks[key];
            return `
              <label class="check ${checked ? 'done' : ''}">
                <input type="checkbox" data-check="${key}" ${checked ? 'checked' : ''} />
                <span>
                  <strong>${interpolate(task[0], item)}</strong>
                  <span>${interpolate(task[1], item)}</span>
                </span>
              </label>
            `;
          }).join('')}
        </div>
      `;
    }

    function bindTaskControls(item) {
      document.querySelectorAll('[data-check]').forEach((input) => {
        input.addEventListener('change', () => {
          state[item.id].checks[input.dataset.check] = input.checked;
          render();
        });
      });
      document.querySelectorAll('[data-memo]').forEach((memo) => {
        memo.addEventListener('input', () => {
          state[item.id].memos[memo.dataset.memo] = memo.value;
        });
      });
    }

    function renderCalendar(item, entries) {
      const itemState = state[item.id];
      const active = activeItem(item);
      if (!itemState.selectedDate) itemState.selectedDate = active.date;
      if (!itemState.month) itemState.month = monthKey(active.date);
      const [year, month] = itemState.month.split('-').map(Number);
      const first = new Date(year, month - 1, 1);
      const last = new Date(year, month, 0);
      const cells = [];
      for (let i = 0; i < first.getDay(); i += 1) cells.push({ empty: true });
      for (let day = 1; day <= last.getDate(); day += 1) {
        const date = `${year}-${pad(month)}-${pad(day)}`;
        cells.push({ day, date, entries: entries.filter((entry) => entry.date === date) });
      }
      while (cells.length % 7 !== 0) cells.push({ empty: true });
      return `
        <section class="calendar">
          <div class="calendar-top">
            <div>
              <p class="label">캘린더 미리보기</p>
              <h3>${year}년 ${month}월</h3>
            </div>
            <div class="month-nav">
              <button type="button" data-month="-1">이전</button>
              <button type="button" data-month="1">다음</button>
            </div>
          </div>
          <div class="calendar-grid">
            ${dayNames.map((day) => `<div class="weekday">${day}</div>`).join('')}
            ${cells.map((cell) => {
              if (cell.empty) return '<div class="day empty"></div>';
              const hasEvent = cell.entries.length > 0;
              const activeDay = cell.date === itemState.selectedDate;
              return `
                <button class="day ${hasEvent ? 'has-event' : ''} ${activeDay ? 'active' : ''}" type="button" ${hasEvent ? `data-date="${cell.date}"` : ''}>
                  ${cell.day}
                  ${cell.entries.map((entry) => `<span class="event-chip">${entry.label}</span>`).join('')}
                </button>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function renderTimeline(item) {
      const entries = timelineEntries(item);
      const active = activeItem(item);
      const itemState = state[item.id];
      document.querySelector('#flow-body').innerHTML = `
        <section class="hero-action">
          <p class="label">현재 실행</p>
          <h3>${active.label} · ${active.title}</h3>
          <p class="desc">${formatDate(active.date)} · ${interpolate(active.detail, item)}</p>
          <div class="big-status">
            <div class="status-box"><b>오늘 볼 것</b><span>${active.short}</span></div>
            <div class="status-box"><b>완료</b><span>${doneCount(item)}/${allTasks(item).length}</span></div>
            <div class="status-box"><b>다음</b><span>${nextLabel(item, active.id)}</span></div>
          </div>
          ${renderTaskList(item, active)}
          <div class="field" style="margin-top:12px">
            <label for="${item.id}-memo-${active.id}">메모</label>
            <textarea id="${item.id}-memo-${active.id}" data-memo="${active.id}" placeholder="업체명, 안내문, 보류 이유처럼 다시 볼 내용만 짧게 남기기">${itemState.memos[active.id] || ''}</textarea>
          </div>
        </section>
        ${renderCalendar(item, entries)}
        <section class="panel">
          <p class="label">전체 일정</p>
          <div class="event-list">
            ${entries.map((entry) => `
              <button class="event-item ${entry.id === active.id ? 'active' : ''}" type="button" data-event="${entry.id}">
                <b>${entry.label} · ${shortDate(entry.date)}</b>
                <span>${entry.title}</span>
              </button>
            `).join('')}
          </div>
        </section>
      `;
      bindTaskControls(item);
      document.querySelectorAll('[data-event]').forEach((button) => {
        button.addEventListener('click', () => {
          itemState.selected = button.dataset.event;
          const selected = entries.find((entry) => entry.id === itemState.selected);
          itemState.selectedDate = selected.date;
          itemState.month = monthKey(selected.date);
          render();
        });
      });
      document.querySelectorAll('[data-date]').forEach((button) => {
        button.addEventListener('click', () => {
          const dateEntries = entries.filter((entry) => entry.date === button.dataset.date);
          itemState.selectedDate = button.dataset.date;
          if (dateEntries.length === 1) itemState.selected = dateEntries[0].id;
          render();
        });
      });
      document.querySelectorAll('[data-month]').forEach((button) => {
        button.addEventListener('click', () => {
          itemState.month = shiftMonth(itemState.month, Number(button.dataset.month));
          render();
        });
      });
    }

    function nextLabel(item, id) {
      if (item.type !== 'timeline') return '다음 섹션';
      const entries = timelineEntries(item);
      const index = entries.findIndex((entry) => entry.id === id);
      return entries[Math.min(index + 1, entries.length - 1)].label;
    }

    function renderField(item) {
      const active = activeItem(item);
      const itemState = state[item.id];
      document.querySelector('#flow-body').innerHTML = `
        <section class="hero-action">
          <p class="label">현장 체크</p>
          <h3>${active.title}</h3>
          <p class="desc">${formatDate(itemState.inputs.visitDate)} 방문 · ${interpolate(active.detail, item)}</p>
          <div class="big-status">
            <div class="status-box"><b>현재 섹션</b><span>${active.short}</span></div>
            <div class="status-box"><b>완료</b><span>${doneCount(item)}/${allTasks(item).length}</span></div>
            <div class="status-box"><b>매물</b><span>${itemState.inputs.listing || '아직 없음'}</span></div>
          </div>
          ${renderTaskList(item, active)}
          <div class="field" style="margin-top:12px">
            <label for="${item.id}-memo-${active.id}">보류 메모</label>
            <textarea id="${item.id}-memo-${active.id}" data-memo="${active.id}" placeholder="확신이 안 드는 항목과 다시 확인할 이유만 적기">${itemState.memos[active.id] || ''}</textarea>
          </div>
        </section>
        <section class="panel">
          <p class="label">현장에서 볼 순서</p>
          <div class="event-list">
            ${item.sections.map((section) => `
              <button class="event-item ${section.id === active.id ? 'active' : ''}" type="button" data-section="${section.id}">
                <b>${section.label}. ${section.title}</b>
                <span>${section.short}</span>
              </button>
            `).join('')}
          </div>
        </section>
        <section class="notice danger">확신이 안 들면 계약 전 다시 볼 항목으로 남기고, 판매자에게 확인할 질문으로 정리합니다.</section>
      `;
      bindTaskControls(item);
      document.querySelectorAll('[data-section]').forEach((button) => {
        button.addEventListener('click', () => {
          itemState.selected = button.dataset.section;
          render();
        });
      });
    }

    function render() {
      const item = flow();
      renderNav();
      renderHeader(item);
      renderSetup(item);
      if (item.type === 'timeline') renderTimeline(item);
      if (item.type === 'field') renderField(item);
    }

    document.querySelector('#reset').addEventListener('click', () => {
      const item = flow();
      state[item.id].saved = false;
      state[item.id].checks = {};
      state[item.id].memos = {};
      state[item.id].toast = '현재 Flow를 초기화했습니다.';
      render();
    });

    render();
  </script>
</body>
</html>
