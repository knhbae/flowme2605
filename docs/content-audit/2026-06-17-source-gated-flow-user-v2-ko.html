<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowMe 저장한 원문 실행 화면</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --surface: #ffffff;
        --soft: #f8fafc;
        --soft-blue: #eef5ff;
        --line: #d9e2ef;
        --line-strong: #b8c5d6;
        --text: #101827;
        --muted: #5e6b7d;
        --blue: #1f5fbf;
        --green: #0f7a4a;
        --amber: #9a6100;
        --red: #b42318;
        --shadow: 0 14px 34px rgba(16, 24, 39, 0.08);
        --radius: 8px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: linear-gradient(180deg, #fbfdff 0, var(--bg) 460px);
        color: var(--text);
        font-size: 16px;
        line-height: 1.56;
      }
      button, input, textarea { font: inherit; }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 850;
      }
      input[type="date"], textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: white;
        color: var(--text);
      }
      input[type="date"] { min-height: 44px; padding: 8px 10px; }
      textarea { min-height: 92px; padding: 10px; resize: vertical; }
      a { color: var(--blue); text-underline-offset: 3px; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 8px; font-size: clamp(28px, 5vw, 42px); line-height: 1.1; letter-spacing: 0; }
      h2 { margin-bottom: 8px; font-size: clamp(22px, 3vw, 32px); line-height: 1.2; letter-spacing: 0; }
      h3 { margin-bottom: 6px; font-size: 19px; line-height: 1.3; letter-spacing: 0; }
      ul { margin: 0; padding-left: 20px; }
      li + li { margin-top: 5px; }

      .page { width: min(1240px, calc(100% - 28px)); margin: 0 auto; padding: 16px 0 64px; }
      .topbar, .hero, .panel, .card, .flow-button, .calendar, .entry, .setup-box, .detail-box {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .topbar {
        min-height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        box-shadow: 0 1px 2px rgba(16, 24, 39, .04);
      }
      .brand { color: var(--blue); font-size: 24px; font-weight: 950; text-decoration: none; }
      .top-note { margin: 0; color: var(--muted); font-size: 14px; font-weight: 700; }
      .hero { margin-top: 12px; padding: 18px; box-shadow: var(--shadow); }
      .eyebrow { margin-bottom: 6px; color: var(--blue); font-size: 13px; font-weight: 900; text-transform: uppercase; }
      .desc { color: var(--muted); }
      .chips, .source-row, .button-row, .switch-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .chips { margin-top: 12px; }
      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--soft);
        color: #334155;
        font-size: 13px;
        font-weight: 850;
      }
      .chip.strong { border-color: #b7cdf5; background: var(--soft-blue); color: #174ea6; }

      .layout {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 14px;
        margin-top: 14px;
      }
      .layout > *, .panel, .content { min-width: 0; }
      .panel { padding: 14px; }
      .flow-list { display: grid; gap: 8px; width: 100%; max-width: 100%; margin-top: 10px; }
      .flow-button {
        width: 100%;
        min-height: 74px;
        padding: 12px;
        background: white;
        text-align: left;
      }
      .flow-button.active {
        border-color: #9bbbf0;
        background: #f3f8ff;
        box-shadow: inset 4px 0 0 var(--blue);
      }
      .flow-button span { display: block; }
      .flow-title { font-weight: 950; color: var(--text); }
      .flow-meta { margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 700; }

      .content {
        display: grid;
        gap: 14px;
      }
      .card, .artifact-grid > *, .table-wrap { min-width: 0; max-width: 100%; }
      .card { padding: 16px; }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }
      .source-row { margin-top: 12px; align-items: center; }
      .source-link {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        color: var(--blue);
        font-weight: 850;
        text-decoration: none;
      }
      .setup-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: end;
        margin-top: 12px;
      }
      .setup-box { padding: 14px; background: #fbfdff; }
      .setup-box label { display: block; margin-bottom: 7px; font-weight: 900; }
      .routine-options {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 132px minmax(156px, .45fr);
        gap: 10px;
        margin-top: 10px;
        align-items: end;
      }
      .weekday-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .weekday-button {
        min-height: 36px;
        min-width: 42px;
        border: 1px solid var(--line);
        background: white;
        color: #334155;
        padding: 0 10px;
      }
      .weekday-button.active {
        border-color: #9bbbf0;
        background: var(--soft-blue);
        color: #174ea6;
      }
      input[type="time"] {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: white;
        padding: 8px 10px;
      }
      .primary {
        background: var(--blue);
        color: white;
        padding: 0 16px;
      }
      .secondary {
        border: 1px solid var(--line);
        background: white;
        color: #334155;
        padding: 0 12px;
      }
      .secondary.active {
        border-color: #9bbbf0;
        background: var(--soft-blue);
        color: #174ea6;
      }
      .saved {
        display: none;
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid #c3e6d1;
        border-radius: 6px;
        background: #effaf3;
        color: var(--green);
        font-weight: 850;
      }
      .saved.show { display: block; }

      .artifact-grid {
        display: grid;
        grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
        gap: 12px;
        align-items: start;
      }
      .calendar { padding: 12px; }
      .cal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .cal-title { margin: 0; font-size: 20px; font-weight: 950; }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }
      .dow {
        padding: 4px 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
        text-align: center;
      }
      .day {
        min-height: 56px;
        border: 1px solid #edf2f7;
        border-radius: 6px;
        background: #fbfdff;
        padding: 5px;
        text-align: left;
        font-weight: 850;
      }
      .day.out { color: #aab4c1; background: #f8fafc; }
      .day.has {
        border-color: #9bbbf0;
        background: #edf5ff;
        color: #123f86;
      }
      .day.selected {
        outline: 2px solid var(--blue);
        outline-offset: 1px;
      }
      .dot-row { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
      .entry-list { display: grid; gap: 10px; }
      .entry {
        padding: 13px;
        background: white;
      }
      .entry.active { border-color: #9bbbf0; background: #fbfdff; }
      .entry-button {
        display: block;
        width: 100%;
        min-height: 0;
        padding: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        border-radius: 0;
      }
      .entry-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }
      .entry-date { color: var(--blue); font-size: 13px; font-weight: 950; }
      .entry-state { color: var(--muted); font-size: 13px; font-weight: 850; white-space: nowrap; }
      .check-list { display: grid; gap: 8px; margin-top: 12px; }
      .check-row {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 8px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fbfdff;
      }
      .check-row input {
        width: 20px;
        height: 20px;
        margin: 2px 0 0;
      }
      .check-title { font-weight: 900; }
      .check-hint { margin-top: 3px; color: var(--muted); font-size: 14px; }
      .detail-box {
        margin-top: 12px;
        padding: 12px;
        background: #fbfdff;
      }
      .detail-box h3 { font-size: 17px; }
      .memo-label { display: block; margin-top: 12px; font-weight: 900; }
      .progress-wrap { margin-top: 10px; }
      .progress-line {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8eef6;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2563eb, #16a34a);
      }
      .progress-text { margin-top: 5px; color: var(--muted); font-size: 13px; font-weight: 850; }
      .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
      table { width: 100%; border-collapse: collapse; min-width: 680px; background: white; }
      th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
      th { background: #f5f8fc; color: #334155; font-size: 13px; }
      tr:last-child td { border-bottom: 0; }
      .notice {
        margin-top: 12px;
        padding: 11px 12px;
        border: 1px solid #f1d58b;
        border-radius: 6px;
        background: #fff9e8;
        color: #7a4a00;
        font-weight: 750;
      }
      .muted-list { color: var(--muted); font-size: 14px; }
      .range-list { display: grid; gap: 10px; margin-top: 12px; }
      .range-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfdff;
        padding: 10px;
      }
      .range-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
      }
      .range-bar {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8eef6;
        margin-top: 8px;
      }
      .range-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #1f5fbf, #16a34a);
      }
      .schedule-list { display: grid; gap: 10px; }
      .schedule-card {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfdff;
        padding: 11px;
      }
      .schedule-card input {
        width: 20px;
        height: 20px;
        margin-top: 3px;
      }
      .schedule-meta {
        margin: 4px 0 0;
        color: var(--blue);
        font-size: 13px;
        font-weight: 900;
      }

      @media (max-width: 920px) {
        .layout, .artifact-grid { grid-template-columns: 1fr; }
        .flow-list {
          display: flex;
          overflow-x: auto;
          width: 100%;
          max-width: 100%;
          padding-bottom: 4px;
          scroll-snap-type: x mandatory;
        }
        .flow-button {
          min-width: 226px;
          scroll-snap-align: start;
        }
        .card-header, .setup-grid { display: block; }
        .setup-grid .primary { width: 100%; margin-top: 10px; }
        .routine-options { grid-template-columns: 1fr; }
      }

      @media (max-width: 520px) {
        .page { width: min(100% - 18px, 1240px); padding-top: 10px; }
        .topbar { align-items: flex-start; flex-direction: column; }
        .hero, .panel, .card { padding: 13px; }
        .day { min-height: 48px; padding: 4px; font-size: 13px; }
        .entry-top { display: block; }
        .entry-state { display: block; margin-top: 4px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="#">FlowMe</a>
        <p class="top-note">원문 하나를 캘린더, 체크리스트, 표, 버킷으로 옮긴 화면</p>
      </header>

      <section class="hero">
        <p class="eyebrow">저장한 원문을 실행 도구로 보기</p>
        <h1>읽고 끝내지 않고 바로 체크할 수 있게</h1>
        <p class="desc">날짜가 필요한 원문은 일정으로, 한 번 확인하면 되는 원문은 체크리스트로, 보관해두고 꺼내 쓸 자료는 버킷 항목으로 보여줍니다.</p>
        <div class="chips" aria-label="화면 종류">
          <span class="chip strong">날짜형</span>
          <span class="chip strong">현장 체크</span>
          <span class="chip strong">표 일정</span>
          <span class="chip strong">버킷 항목</span>
        </div>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>저장한 원문</h2>
          <p class="desc">항목을 선택하면 그 원문에 맞는 실행 화면이 열립니다.</p>
          <div class="flow-list" id="flow-list"></div>
        </aside>
        <section class="content" id="flow-content" aria-live="polite"></section>
      </section>
    </main>

    <script>
      const sourceUrls = {
        moving: 'https://www.ajd.co.kr/contents/basic-tip/detail/%EC%9D%B4%EC%82%AC%ED%95%A0_%EB%95%8C_%EC%B2%B4%ED%81%AC%EB%A6%AC%EC%8A%A4%ED%8A%B8_%EC%83%81%EC%84%B8_%EC%A0%95%EB%A6%AC-47214',
        usedcar: 'https://web.getcha.kr/blog/used-car-condition-checklist-guide',
        school: 'https://www.welfarehello.com/community/hometownNews/%EC%9A%B0%EB%A6%AC%EC%95%84%EC%9D%B4-%EC%84%A4%EB%A0%88%EB%8A%94-%EC%B2%AB-%EC%B6%9C%EB%B0%9C-%EC%B4%88%EB%93%B1%ED%95%99%EA%B5%90-%EC%9E%85%ED%95%99%EC%A4%80%EB%B9%84%EB%AC%BC-%EC%B2%B4%ED%81%AC%EB%A6%AC%EC%8A%A4%ED%8A%B8--fdcb3d95-44e4-48eb-9ce8-67bed2640c48',
        baby: 'https://www.guro.go.kr/health/contents.do?key=1357',
        passport: 'https://www.passport.go.kr/home/kor/contents.do?menuPos=11',
        workout: 'https://www.youtube.com/watch?v=W4SpM2gxGdE',
        craft: 'https://www.youtube.com/watch?v=REurKhkEKz4',
        stuckyi: 'https://epicplants.tistory.com/entry/dracaena-stuckyi-care',
        esim: 'https://docs.channel.io/usimsa-cx-guide/ko/articles/esim_activating_local_ios-a647373b',
        dorm: 'https://dorm.skku.edu/dorm_suwon/notice/notice_all.jsp?article_no=80076&mode=view'
      };

      const flows = [
        {
          id: 'moving',
          kind: 'timeline',
          title: '이사할 때 체크리스트',
          meta: '이사일 기준 일정',
          source: '아정당 · 이사할 때 체크리스트 상세 정리',
          output: '캘린더 + 체크리스트',
          summary: '이사일 하나만 넣으면 D-30, D-10, D-3, D-1, 당일 할 일이 날짜별로 놓입니다.',
          inputLabel: '이사일',
          inputKey: 'moveDate',
          defaultDate: '2026-07-18',
          primary: '이사 일정 만들기',
          entries: [
            {
              id: 'move-30',
              timing: 'D-30',
              offset: -30,
              title: '이사 방식 확인과 집 점검',
              memo: '업체, 관리사무소, 학교, 위탁시설처럼 연락할 곳이 여러 개라 한 달 전 일정으로 분리합니다.',
              rows: [
                ['이사 방식 확인', '포장이사와 반포장이사 중 필요한 범위를 정합니다.'],
                ['이사할 집 점검 및 하자 수리 의뢰', '수리업체, 인테리어 업체, 관리사무소에 문의할 내용을 남깁니다.'],
                ['필요 없는 물건 정리', '짐 양을 줄일 품목을 먼저 빼둡니다.'],
                ['전학 수속 확인', '해당 가정이면 학교에 필요한 절차를 확인합니다.'],
                ['유아, 노약자, 반려동물 위탁시설 예약', '이사 당일 돌봄이 필요한 가족 또는 반려동물 일정을 분리합니다.'],
                ['이사와 청소 견적 확인 및 예약', '후보 업체와 청소 업체 연락처를 메모합니다.']
              ]
            },
            {
              id: 'move-10',
              timing: 'D-10',
              offset: -10,
              title: '주소 변경과 설치 예약',
              memo: '주소, 배달, 전출, 엘리베이터, 폐기물, 인터넷처럼 누락되기 쉬운 예약 항목을 모읍니다.',
              rows: [
                ['통장, 카드, 우편물 주소 변경', '금융기관과 우체국 주소 변경을 확인합니다.'],
                ['정기 배달 중지 요청', '신문, 우유 등 반복 배달을 중지합니다.'],
                ['전출 신고 확인', '필요한 경우 주민센터 또는 온라인 절차를 확인합니다.'],
                ['엘리베이터와 사다리차 주차공간 예약', '관리사무소와 사다리차 공간을 확인합니다.'],
                ['냉장고 비우기와 폐가전 신고', '식재료 소진, 폐가전 또는 대형폐기물 예약을 진행합니다.'],
                ['인터넷, 정수기 이전 설치 예약', '통신사와 정수기 업체에 이전 설치 일정을 잡습니다.']
              ]
            },
            {
              id: 'move-3',
              timing: 'D-3',
              offset: -3,
              title: '가스, 자동이체, 서류 준비',
              memo: '이사 전날 몰리면 위험한 철거, 해지, 서류 항목을 먼저 처리합니다.',
              rows: [
                ['도시가스 철거와 설치 예약', '출발지와 도착지의 가스 일정을 따로 확인합니다.'],
                ['자동이체 해지 신청', '관리비와 공과금 자동이체 해지 여부를 확인합니다.'],
                ['세탁기 물 빼기', '운반 전 세탁기 물을 빼둡니다.'],
                ['전세권 설정에 필요한 서류 준비', '해당되는 경우 등기소 제출 서류를 확인합니다.'],
                ['이사 당일 사용할 물건 따로 포장', '당일 바로 쓸 물건은 별도 박스로 분리합니다.']
              ]
            },
            {
              id: 'move-1',
              timing: 'D-1',
              offset: -1,
              title: '일정과 결제 준비 최종 확인',

          title: '기숙사 입사 준비',
          meta: '입사일 기준 준비',
          source: '성균관대 봉룡학사 · 기숙사 입사 준비물 안내',
          output: '입사 일정 + 준비물',
          summary: '입사일 하나를 넣고 택배 발송, 입사 당일 절차, 준비물과 반입 금지 품목을 같이 확인합니다.',
          inputLabel: '입사일',
          inputKey: 'dormDate',
          defaultDate: '2026-08-25',
          primary: '입사 준비 일정 만들기',
          entries: [
            {
              id: 'dorm-ship',
              timing: 'D-3',
              offset: -3,
              title: '택배 보낼 짐 정리',
              memo: '원문은 2~3일 전 택배 발송을 안내합니다. 방 번호가 없어도 받을 수 있게 표기 내용을 확인합니다.',
              rows: [
                ['택배 보낼 짐과 직접 들고 갈 짐 나누기', '바로 쓸 물건은 직접 들고 갈 가방으로 분리합니다.'],
                ['받는 사람 정보를 크게 표시', '도착 후 찾기 쉽도록 이름과 연락처를 눈에 띄게 적습니다.'],
                ['도착 예상일 확인', '입사 전 너무 일찍 도착하지 않도록 발송일을 맞춥니다.']
              ]
            },
            {
              id: 'dorm-day',
              timing: 'D-Day',
              offset: 0,
              title: '입사 절차와 짐 정리',
              memo: '지정 입사일에 도착해 입사 절차를 마치고, 방 안에서 필요한 물건만 먼저 정리합니다.',
              rows: [
                ['호실과 입사 가능 시간 확인', '기숙사 공지에서 배정일과 가능 시간을 확인합니다.'],
                ['필수 서류와 본인 확인 준비', '공지에서 요구한 확인서나 제출물을 준비합니다.'],
                ['출입카드와 열쇠 수령', '안내 데스크에서 필요한 물품을 수령합니다.'],
                ['주차권과 카트 사용 확인', '가족 차량으로 이동하면 주차권과 카트 사용 가능 여부를 확인합니다.'],
                ['개별 준비 필수품 정리', '비상약, 침구, 책상용 스탠드, 수건, 노트북, 목욕 바구니, 빨래 바구니 등을 확인합니다.'],
                ['반입 금지 품목 빼기', '전열 제품, 취사 도구, 향초, 주류, 동물과 식물, 전동킥보드 등은 가져가지 않습니다.']
              ]
            }
          ]
        }
      ];

      const state = {
        active: 'moving',
        selectedEntry: {},
        checked: {},
        saved: {},
        notes: {},
        inputs: Object.fromEntries(flows.map(flow => [flow.id, flow.defaultDate || ''])),
        days: Object.fromEntries(flows.filter(flow => flow.scheduleDays).map(flow => [flow.id, flow.scheduleDays])),
        times: Object.fromEntries(flows.filter(flow => flow.scheduleTime).map(flow => [flow.id, flow.scheduleTime])),
        repeatEnds: Object.fromEntries(flows.filter(flow => flow.repeatEndDate).map(flow => [flow.id, flow.repeatEndDate]))
      };

      function pad(num) { return String(num).padStart(2, '0'); }
      function parseDate(value) {
        const date = value ? new Date(`${value}T00:00:00`) : new Date('2026-06-17T00:00:00');
        return Number.isNaN(date.getTime()) ? new Date('2026-06-17T00:00:00') : date;
      }
      function toIso(date) { return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`; }
      function addDays(value, days) {
        const date = parseDate(value);
        date.setDate(date.getDate() + days);
        return toIso(date);
      }
      function addMonths(value, months) {
        const date = parseDate(value);
        const targetDay = date.getDate();
        date.setMonth(date.getMonth() + months);
        if (date.getDate() < targetDay) date.setDate(0);
        return toIso(date);
      }
      function dateLabel(value) {
        const date = parseDate(value);
        const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
        return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 ${weekdays[date.getDay()]}요일`;
      }
      function monthTitle(value) {
        const date = parseDate(value);
        return `${date.getFullYear()}년 ${date.getMonth() + 1}월`;
      }
      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char]);
      }
      function progressFor(ids) {
        const total = ids.length;
        const done = ids.filter(id => state.checked[id]).length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        return { total, done, pct };
      }
      function getFlow() { return flows.find(flow => flow.id === state.active) || flows[0]; }

      function timelineEntries(flow) {
        const anchor = state.inputs[flow.id] || flow.defaultDate;
        return flow.entries.map(entry => ({
          ...entry,
          date: addDays(anchor, entry.offset),
          rowIds: entry.rows.map((_, index) => `${flow.id}-${entry.id}-${index}`)
        }));
      }
      function singleEntry(flow) {
        const date = state.inputs[flow.id] || flow.defaultDate || toIso(new Date());
        return {
          id: `${flow.id}-single`,
          title: flow.entryTitle || flow.title,
          date,
          timing: '오늘 할 일',
          memo: flow.entryMemo || '',
          rows: flow.rows,
          rowIds: flow.rows.map((_, index) => `${flow.id}-single-${index}`)
        };
      }
      function routineEntries(flow) {
        const first = state.inputs[flow.id] || flow.defaultDate || toIso(new Date());
        if (flow.kind === 'care') {
          return [0, 21, 42].map((offset, index) => ({
            id: `${flow.id}-${index}`,
            title: index === 0 ? flow.entryTitle : `다음 ${flow.entryTitle}`,
            date: addDays(first, offset),
            timing: index === 0 ? '첫 일정' : `+${offset}일`,
            memo: flow.entryMemo,
            rows: flow.rows,
            rowIds: flow.rows.map((_, rowIndex) => `${flow.id}-${index}-${rowIndex}`)
          }));
        }
        if (flow.scheduleDays) {
          const selectedDays = state.days[flow.id] || flow.scheduleDays;
          const time = state.times[flow.id] || flow.scheduleTime || '';
          const endDate = state.repeatEnds[flow.id] || flow.repeatEndDate || addDays(first, 28);
          const start = parseDate(first);
          const end = parseDate(endDate);
          const safeEnd = end >= start ? end : start;
          const maxDays = Math.min(180, Math.max(0, Math.ceil((safeEnd - start) / 86400000)));
          const result = [];
          for (let i = 0; i <= maxDays && result.length < 24; i += 1) {
            const candidate = new Date(start);
            candidate.setDate(start.getDate() + i);
            if (selectedDays.includes(candidate.getDay())) {
              const date = toIso(candidate);
              result.push({
                id: `${flow.id}-${date}`,
                title: flow.entryTitle,
                date,
                timing: time ? `${time} 운동` : '운동 일정',
                memo: flow.entryMemo,
                rows: flow.rows,
                rowIds: flow.rows.map((_, index) => `${flow.id}-${date}-${index}`)
              });
            }
          }
          return result.length ? result : [{
            id: `${flow.id}-first`,
            title: flow.entryTitle,
            date: first,
            timing: time ? `${time} 운동` : '운동 일정',
            memo: flow.entryMemo,
            rows: flow.rows,
            rowIds: flow.rows.map((_, index) => `${flow.id}-first-${index}`)
          }];
        }
        return [{
          id: `${flow.id}-first`,
          title: flow.entryTitle,
          date: first,
          timing: '첫 일정',
          memo: flow.entryMemo,
          rows: flow.rows,
          rowIds: flow.rows.map((_, index) => `${flow.id}-first-${index}`)
        }];
      }
      function bucketEntries(flow) {
        const date = state.inputs[flow.id];
        return [{
          id: `${flow.id}-bucket`,
          title: flow.entryTitle,
          date: date || '',
          timing: date ? (flow.id === 'esim' ? '확인 일정' : '놀이 일정') : '날짜 없이 보관',
          memo: flow.entryMemo,
          rows: flow.rows,
          rowIds: flow.rows.map((_, index) => `${flow.id}-bucket-${index}`)
        }];
      }
      function scheduleRows(flow) {
        const birth = state.inputs[flow.id] || flow.defaultDate;
        return flow.rows.map((row, index) => {
          const start = row.startDays !== undefined ? addDays(birth, row.startDays) : addMonths(birth, row.startMonths);
          const end = row.endDays !== undefined ? addDays(birth, row.endDays) : addMonths(birth, row.endMonths);
          return { ...row, id: `${flow.id}-schedule-${index}`, start, end };
        });
      }

      function renderFlowList() {
        const list = document.querySelector('#flow-list');
        list.innerHTML = flows.map(flow => `
          <button class="flow-button ${flow.id === state.active ? 'active' : ''}" type="button" data-flow="${flow.id}">
            <span class="flow-title">${escapeHtml(flow.title)}</span>
            <span class="flow-meta">${escapeHtml(flow.meta)} · ${escapeHtml(flow.output)}</span>
          </button>
        `).join('');
      }

      function renderHeader(flow) {
        const needsInput = flow.inputLabel !== undefined;
        const inputValue = state.inputs[flow.id] || '';
        const optional = flow.optionalDate ? '<span class="desc">선택 사항입니다. 비워두면 날짜 없이 보관됩니다.</span>' : '';
        const weekLabels = ['일', '월', '화', '수', '목', '금', '토'];
        const scheduleControls = flow.scheduleDays ? `
          <div class="routine-options">
            <div>
              <label>운동 요일</label>
              <div class="weekday-row" aria-label="운동 요일 선택">
                ${weekLabels.map((label, index) => `
                  <button class="weekday-button ${(state.days[flow.id] || flow.scheduleDays).includes(index) ? 'active' : ''}" type="button" data-day="${flow.id}:${index}">${label}</button>
                `).join('')}
              </div>
            </div>
            <div>
              <label for="time-${flow.id}">시간</label>
              <input id="time-${flow.id}" type="time" value="${escapeHtml(state.times[flow.id] || flow.scheduleTime || '20:00')}" data-time="${flow.id}" />
            </div>
            <div>
              <label for="repeat-end-${flow.id}">반복 종료일</label>
              <input id="repeat-end-${flow.id}" type="date" value="${escapeHtml(state.repeatEnds[flow.id] || flow.repeatEndDate || addDays(inputValue || flow.defaultDate, 28))}" data-repeat-end="${flow.id}" />
            </div>
          </div>
        ` : '';
        return `
          <article class="card">
            <div class="card-header">
              <div>
                <p class="eyebrow">${escapeHtml(flow.output)}</p>
                <h2>${escapeHtml(flow.title)}</h2>
                <p class="desc">${escapeHtml(flow.summary)}</p>
                <div class="source-row">
                  <span class="chip">출처: ${escapeHtml(flow.source)}</span>
                  <a class="source-link" href="${sourceUrls[flow.id]}" target="_blank" rel="noreferrer">원문 열기</a>
                </div>
              </div>
            </div>
            <div class="setup-grid">
              ${needsInput ? `
                <div class="setup-box">
                  <label for="input-${flow.id}">${escapeHtml(flow.inputLabel)}</label>
                  <input id="input-${flow.id}" type="date" value="${escapeHtml(inputValue)}" data-input="${flow.id}" />
                  ${optional}
                  ${scheduleControls}
                </div>
              ` : `
                <div class="setup-box">
                  <strong>추가 입력 없음</strong>
                  <p class="desc">원문에 있는 항목만 실행 화면으로 옮깁니다.</p>
                </div>
              `}
              <button class="primary" type="button" data-save="${flow.id}">${escapeHtml(flow.primary)}</button>
            </div>
            <p class="saved ${state.saved[flow.id] ? 'show' : ''}">내 실행 화면에 저장되었습니다. 아래에서 날짜, 항목, 메모를 바로 확인할 수 있습니다.</p>
          </article>
        `;
      }

      function renderCalendar(entries, monthDate) {
        const base = parseDate(monthDate);
        const year = base.getFullYear();
        const month = base.getMonth();
        const first = new Date(year, month, 1);
        const start = new Date(first);
        start.setDate(start.getDate() - first.getDay());
        const byDate = entries.reduce((acc, entry) => {
          if (!entry.date) return acc;
          acc[entry.date] = acc[entry.date] || [];
          acc[entry.date].push(entry);
          return acc;
        }, {});
        const selected = state.selectedEntry[state.active] || (entries[0] && entries[0].id);
        const selectedEntry = entries.find(entry => entry.id === selected) || entries[0];
        let cells = '';
        for (let i = 0; i < 42; i += 1) {
          const current = new Date(start);
          current.setDate(start.getDate() + i);
          const iso = toIso(current);
          const list = byDate[iso] || [];
          const out = current.getMonth() !== month;
          const isSelected = selectedEntry && selectedEntry.date === iso;
          cells += `
            <button class="day ${out ? 'out' : ''} ${list.length ? 'has' : ''} ${isSelected ? 'selected' : ''}" type="button" data-datepick="${iso}" ${list.length ? '' : 'aria-disabled="true"'}>
              <span>${current.getDate()}</span>
              ${list.length ? `<span class="dot-row">${list.map(() => '<i class="dot"></i>').join('')}</span>` : ''}
            </button>
          `;
        }
        return `
          <section class="calendar">
            <div class="cal-head">
              <p class="cal-title">${monthTitle(monthDate)}</p>
              <span class="chip">${entries.length}개 일정</span>
            </div>
            <div class="cal-grid" aria-label="월간 달력">
              ${['일','월','화','수','목','금','토'].map(day => `<div class="dow">${day}</div>`).join('')}
              ${cells}
            </div>
          </section>
        `;
      }

      function renderCheckRows(entry) {
        return `
          <div class="check-list">
            ${entry.rows.map((row, index) => {
              const id = entry.rowIds[index];
              return `
                <label class="check-row">
                  <input type="checkbox" data-check="${id}" ${state.checked[id] ? 'checked' : ''} />
                  <span>
                    <span class="check-title">${escapeHtml(row[0])}</span>
                    <span class="check-hint">${escapeHtml(row[1])}</span>
                    ${row[2] && sourceUrls[row[2]] ? `<a class="source-link" style="margin-top:8px" href="${sourceUrls[row[2]]}" target="_blank" rel="noreferrer">${row[2] === 'workout' ? '영상 열기' : '원문 문서 열기'}</a>` : ''}
                  </span>
                </label>
              `;
            }).join('')}
          </div>
        `;
      }

      function renderEntryDetail(entry, noteTitle) {
        const progress = progressFor(entry.rowIds);
        const noteKey = `${state.active}-${entry.id}`;
        return `
          <article class="entry active">
            <div class="entry-top">
              <div>
                <p class="entry-date">${entry.date ? dateLabel(entry.date) : entry.timing}</p>
                <h3>${escapeHtml(entry.title)}</h3>
              </div>
              <span class="entry-state">${progress.done}/${progress.total} 완료</span>
            </div>
            <div class="progress-wrap">
              <div class="progress-line"><div class="progress-bar" style="width:${progress.pct}%"></div></div>
              <p class="progress-text">체크한 항목만 완료로 남습니다.</p>
            </div>
            ${renderCheckRows(entry)}
            ${entry.memo ? `<div class="detail-box"><h3>메모</h3><p class="desc">${escapeHtml(entry.memo)}</p></div>` : ''}
            <label class="memo-label" for="memo-${entry.id}">${escapeHtml(noteTitle || '내 메모')}</label>
            <textarea id="memo-${entry.id}" data-note="${noteKey}" placeholder="통화 내용, 예약 번호, 확인할 내용을 짧게 남기기">${escapeHtml(state.notes[noteKey] || '')}</textarea>
          </article>
        `;
      }

      function renderEntryList(entries) {
        const selected = state.selectedEntry[state.active] || (entries[0] && entries[0].id);
        return `
          <div class="entry-list">
            ${entries.map(entry => {
              const progress = progressFor(entry.rowIds);
              return `
                <article class="entry ${entry.id === selected ? 'active' : ''}">
                  <button class="entry-button" type="button" data-entry="${entry.id}">
                    <div class="entry-top">
                      <div>
                        <p class="entry-date">${entry.date ? `${dateLabel(entry.date)} · ${entry.timing}` : entry.timing}</p>
                        <h3>${escapeHtml(entry.title)}</h3>
                      </div>
                      <span class="entry-state">${progress.done}/${progress.total} 완료</span>
                    </div>
                  </button>
                </article>
              `;
            }).join('')}
          </div>
        `;
      }

      function renderTimeline(flow) {
        const entries = timelineEntries(flow);
        if (!state.selectedEntry[flow.id]) state.selectedEntry[flow.id] = entries[0].id;
        const selected = entries.find(entry => entry.id === state.selectedEntry[flow.id]) || entries[0];
        const monthDate = selected.date || (state.inputs[flow.id] || flow.defaultDate);
        return `
          ${renderHeader(flow)}
          <article class="card">
            <div class="artifact-grid">
              ${renderCalendar(entries, monthDate)}
              <div>
                <h2>선택한 날짜</h2>
                ${renderEntryDetail(selected, '예약, 연락처, 확인할 내용')}
              </div>
            </div>
          </article>
          <article class="card">
            <h2>전체 일정</h2>
            <p class="desc">달력에 보이지 않는 이전 달 항목까지 날짜순으로 확인합니다.</p>
            ${renderEntryList(entries)}
          </article>
        `;
      }

      function renderVisit(flow) {
        const entry = singleEntry(flow);
        return `
          ${renderHeader(flow)}
          <article class="card">
            <div class="artifact-grid">
              ${renderCalendar([entry], entry.date)}
              <div>
                <h2>방문일 체크</h2>
                ${renderEntryDetail(entry, '걸리는 항목과 판매자 답변')}
              </div>
            </div>
          </article>
        `;
      }

      function renderChecklist(flow) {
        const entry = {
          id: `${flow.id}-checklist`,
          title: flow.title,
          timing: '체크리스트',
          memo: '',
          rows: flow.rows,
          rowIds: flow.rows.map((_, index) => `${flow.id}-checklist-${index}`)
        };
        return `
          ${renderHeader(flow)}
          <article class="card">
            <h2>${escapeHtml(flow.title)}</h2>
            ${renderEntryDetail(entry, flow.memoTitle || '추가로 확인할 내용')}
          </article>
        `;
      }

      function renderSchedule(flow) {
        const rows = scheduleRows(flow);
        const nextRow = rows.find(row => parseDate(row.end) >= new Date('2026-06-17T00:00:00')) || rows[0];
        const maxDay = Math.max(...rows.map(row => Math.ceil((parseDate(row.end) - parseDate(state.inputs[flow.id] || flow.defaultDate)) / 86400000)));
        return `
          ${renderHeader(flow)}
          <article class="card">
            <h2>가까운 일정</h2>
            <article class="entry active">
              <p class="entry-date">${dateLabel(nextRow.start)} ~ ${dateLabel(nextRow.end)}</p>
              <h3>${escapeHtml(nextRow.name)}</h3>
              <p class="desc">${escapeHtml(nextRow.items)}</p>
              <label class="memo-label" for="memo-${nextRow.id}">예약 기관, 문의 내용</label>
              <textarea id="memo-${nextRow.id}" data-note="${nextRow.id}" placeholder="검진기관, 예약일, 문의할 내용을 짧게 남기기">${escapeHtml(state.notes[nextRow.id] || '')}</textarea>
            </article>
          </article>
          <article class="card">
            <h2>검진 기간 타임라인</h2>
            <p class="desc">월간 달력보다 기간표가 더 잘 맞습니다. 각 차수가 몇 개월 구간에 걸쳐 있는지 먼저 보고, 가까운 차수만 메모에 남깁니다.</p>
            <div class="range-list">
              ${rows.map(row => {
                const birth = state.inputs[flow.id] || flow.defaultDate;
                const startDay = Math.max(0, Math.ceil((parseDate(row.start) - parseDate(birth)) / 86400000));
                const endDay = Math.max(startDay + 1, Math.ceil((parseDate(row.end) - parseDate(birth)) / 86400000));
                const left = Math.max(0, Math.min(96, Math.round((startDay / maxDay) * 100)));
                const width = Math.max(4, Math.min(100 - left, Math.round(((endDay - startDay) / maxDay) * 100)));
                return `
                  <div class="range-card">
                    <div class="range-top">
                      <strong>${escapeHtml(row.name)}</strong>
                      <span class="desc">${dateLabel(row.start)} ~ ${dateLabel(row.end)}</span>
                    </div>
                    <div class="range-bar"><div class="range-fill" style="margin-left:${left}%;width:${width}%"></div></div>
                  </div>
                `;
              }).join('')}
            </div>
          </article>
          <article class="card">
            <h2>전체 검진 기간</h2>
            <div class="schedule-list">
              ${rows.map(row => {
                const id = row.id;
                return `
                  <label class="schedule-card">
                    <input type="checkbox" data-check="${id}" ${state.checked[id] ? 'checked' : ''} />
                    <span>
                      <strong>${escapeHtml(row.name)}</strong>
                      <span class="schedule-meta">${dateLabel(row.start)} ~ ${dateLabel(row.end)}</span>
                      <span class="check-hint">${escapeHtml(row.items)}</span>
                    </span>
                  </label>
                `;
              }).join('')}
            </div>
            <p class="notice">문진표와 검진기관은 원문에서 안내한 국민건강보험공단 경로로 확인합니다. 의료 판단은 검진기관과 상담합니다.</p>
          </article>
        `;
      }

      function renderRoutine(flow) {
        const entries = routineEntries(flow);
        if (!state.selectedEntry[flow.id]) state.selectedEntry[flow.id] = entries[0].id;
        const selected = entries.find(entry => entry.id === state.selectedEntry[flow.id]) || entries[0];
        return `
          ${renderHeader(flow)}
          <article class="card">
            <div class="artifact-grid">
              ${renderCalendar(entries, selected.date)}
              <div>
                <h2>${flow.kind === 'care' ? '물주기 일정' : '선택한 운동 일정'}</h2>
                ${renderEntryDetail(selected, flow.kind === 'care' ? '잎 상태와 물 준 날짜' : '운동 후 상태')}
              </div>
            </div>
          </article>
          ${flow.kind === 'care' ? `
            <article class="card">
              <h2>다음 물주기 후보</h2>
              <p class="desc">여름 기준 2~3주 간격으로만 먼저 보여줍니다. 겨울에는 더 늦게 잡습니다.</p>
              ${renderEntryList(entries)}
            </article>
          ` : `
            <article class="card">
              <h2>예정된 운동 일정</h2>
              <p class="desc">요일, 시간, 종료일을 바꾸면 반복 일정이 다시 계산됩니다. 긴 기간은 화면에서 최대 24개까지만 보여줍니다.</p>
              ${renderEntryList(entries)}
            </article>
          `}
        `;
      }

      function renderBucket(flow) {
        const entry = bucketEntries(flow)[0];
        return `
          ${renderHeader(flow)}
          <article class="card">
            <div class="artifact-grid">
              <section class="detail-box">
                <p class="eyebrow">${entry.date ? dateLabel(entry.date) : '날짜 없이 저장됨'}</p>
                <h2>${escapeHtml(entry.title)}</h2>
                <p class="desc">${escapeHtml(entry.memo)}</p>
                <div class="source-row">
                  <a class="source-link" href="${sourceUrls[flow.id]}" target="_blank" rel="noreferrer">${flow.id === 'esim' ? '원문 문서 열기' : '영상 열기'}</a>
                </div>
              </section>
              ${renderEntryDetail(entry, flow.id === 'esim' ? '여행 전 확인할 내용' : '아이 반응과 다음에 챙길 것')}
            </div>
          </article>
        `;
      }

      function renderProcedure(flow) {
        const entry = {
          id: `${flow.id}-procedure`,
          title: flow.title,
          timing: '순서대로 확인',
          memo: '통신 설정은 구매한 상품과 현지 통신망에 따라 달라질 수 있습니다. 막히면 원문 이미지와 고객 지원을 확인합니다.',
          rows: flow.rows,
          rowIds: flow.rows.map((_, index) => `${flow.id}-procedure-${index}`)
        };
        return `
          ${renderHeader(flow)}
          <article class="card">
            <h2>도착 후 설정 순서</h2>
            ${renderEntryDetail(entry, '현지에서 막힌 화면이나 문의 내용')}
          </article>
        `;
      }

      function render() {
        renderFlowList();
        const flow = getFlow();
        const target = document.querySelector('#flow-content');
        if (flow.kind === 'timeline') target.innerHTML = renderTimeline(flow);
        if (flow.kind === 'visit') target.innerHTML = renderVisit(flow);
        if (flow.kind === 'checklist') target.innerHTML = renderChecklist(flow);
        if (flow.kind === 'schedule') target.innerHTML = renderSchedule(flow);
        if (flow.kind === 'routine' || flow.kind === 'care') target.innerHTML = renderRoutine(flow);
        if (flow.kind === 'bucket') target.innerHTML = renderBucket(flow);
        if (flow.kind === 'procedure') target.innerHTML = renderProcedure(flow);
      }

      document.addEventListener('click', event => {
        const flowButton = event.target.closest('[data-flow]');
        if (flowButton) {
          state.active = flowButton.dataset.flow;
          render();
          return;
        }
        const saveButton = event.target.closest('[data-save]');
        if (saveButton) {
          state.saved[saveButton.dataset.save] = true;
          render();
          return;
        }
        const entryButton = event.target.closest('[data-entry]');
        if (entryButton) {
          state.selectedEntry[state.active] = entryButton.dataset.entry;
          render();
          return;
        }
        const dayButton = event.target.closest('[data-datepick]');
        if (dayButton && !dayButton.hasAttribute('aria-disabled')) {
          const flow = getFlow();
          const entries = flow.kind === 'timeline' ? timelineEntries(flow) : flow.kind === 'care' || flow.kind === 'routine' ? routineEntries(flow) : [singleEntry(flow)];
          const entry = entries.find(item => item.date === dayButton.dataset.datepick);
          if (entry) {
            state.selectedEntry[flow.id] = entry.id;
            render();
          }
        }
        const weekdayButton = event.target.closest('[data-day]');
        if (weekdayButton) {
          const [flowId, dayValue] = weekdayButton.dataset.day.split(':');
          const day = Number(dayValue);
          const current = state.days[flowId] || [];
          const next = current.includes(day) ? current.filter(value => value !== day) : [...current, day].sort((a, b) => a - b);
          state.days[flowId] = next.length ? next : [day];
          state.selectedEntry[flowId] = '';
          render();
        }
      });

      document.addEventListener('change', event => {
        const input = event.target.closest('[data-input]');
        if (input) {
          state.inputs[input.dataset.input] = input.value;
          const flow = flows.find(item => item.id === input.dataset.input);
          if (flow && flow.scheduleDays) {
            const start = parseDate(input.value);
            const end = parseDate(state.repeatEnds[flow.id] || flow.repeatEndDate || addDays(input.value, 28));
            if (end < start) state.repeatEnds[flow.id] = addDays(input.value, 28);
          }
          state.selectedEntry[input.dataset.input] = '';
          render();
          return;
        }
        const repeatEnd = event.target.closest('[data-repeat-end]');
        if (repeatEnd) {
          state.repeatEnds[repeatEnd.dataset.repeatEnd] = repeatEnd.value;
          state.selectedEntry[repeatEnd.dataset.repeatEnd] = '';
          render();
          return;
        }
        const time = event.target.closest('[data-time]');
        if (time) {
          state.times[time.dataset.time] = time.value;
          state.selectedEntry[time.dataset.time] = '';
          render();
          return;
        }
        const checkbox = event.target.closest('[data-check]');
        if (checkbox) {
          state.checked[checkbox.dataset.check] = checkbox.checked;
          render();
        }
      });

      document.addEventListener('input', event => {
        const note = event.target.closest('[data-note]');
        if (note) state.notes[note.dataset.note] = note.value;
      });

      render();
    </script>
  </body>
</html>
