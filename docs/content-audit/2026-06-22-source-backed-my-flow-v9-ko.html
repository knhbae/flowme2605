<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>내 Flow v9 원문 기반</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --soft: #f8fafc;
      --line: #dbe4ef;
      --line-strong: #b8c7da;
      --text: #101827;
      --muted: #596779;
      --faint: #8290a2;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #0f766e;
      --green-soft: #ecfdf5;
      --amber: #b45309;
      --amber-soft: #fffbeb;
      --radius: 18px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(760px, calc(100% - 28px)); margin: 0 auto; padding: 24px 0 54px; }
    .top, .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .top { padding: 20px; }
    .top-row { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    h1, h2, h3, p { margin-top: 0; letter-spacing: 0; }
    h1 { margin-bottom: 4px; font-size: clamp(28px, 5vw, 38px); line-height: 1.08; }
    h2 { margin-bottom: 2px; font-size: 20px; }
    h3 { margin-bottom: 4px; font-size: 17px; }
    p { margin-bottom: 0; color: var(--muted); }
    .eyebrow { margin: 0 0 4px; color: var(--blue); font-size: 12px; font-weight: 900; }
    .stat {
      min-width: 108px;
      border-radius: 14px;
      background: var(--soft);
      padding: 12px;
      text-align: right;
    }
    .stat b, .stat span { display: block; }
    .stat b { font-size: 20px; }
    .stat span { color: var(--muted); font-size: 12px; font-weight: 750; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin: 12px 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      padding: 6px;
    }
    .tabs button {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-weight: 850;
    }
    .tabs button.active { background: var(--blue-soft); color: var(--blue); box-shadow: inset 0 0 0 1px #bfdbfe; }
    .panel { padding: 16px; }
    .view { display: none; }
    .view.active { display: block; }
    .head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .count {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border-radius: 999px;
      background: var(--soft);
      padding: 4px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .list { display: grid; gap: 10px; padding-top: 12px; }
    .step-block { display: grid; gap: 8px; }
    .row, .subrow {
      width: 100%;
      min-height: 68px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--card);
      text-align: left;
      padding: 13px;
    }
    .row.action-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }
    .row.flow-card { border-left: 4px solid var(--blue); background: #fff; }
    .row.map-card { border-left: 4px solid var(--amber); background: #fff; }
    .row.step-row { border-left: 4px solid #bfdbfe; background: #fff; }
    .row.step-row.nested { margin-left: 10px; width: calc(100% - 10px); background: #fbfdff; }
    .row.active, .subrow.active { border-color: #93c5fd; background: var(--blue-soft); }
    .row-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      border: 0;
      background: transparent;
      padding: 0;
      text-align: left;
    }
    .row-main b, .subrow b { display: block; color: var(--text); font-size: 15px; line-height: 1.35; }
    .row-main span, .subrow span { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .row-main .row-content { display: block; margin-top: 0; color: inherit; }
    .row-main .row-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .row-main .row-meta span,
    .row-main .row-meta strong {
      display: inline;
      margin: 0;
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: 1.25;
    }
    .row-main .row-meta strong {
      color: var(--text);
      font-weight: 900;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      max-width: 100%;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      padding: 3px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .chip.blue { border-color: #bfdbfe; background: var(--blue-soft); color: var(--blue); }
    .chip.green { border-color: #99f6e4; background: var(--green-soft); color: var(--green); }
    .chip.amber { border-color: #fed7aa; background: var(--amber-soft); color: var(--amber); }
    .quick {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--card);
      color: transparent;
      font-weight: 900;
    }
    .quick.done { border-color: #99f6e4; background: var(--green); color: #fff; }
    .mini-progress {
      display: block;
      height: 5px;
      width: min(148px, 100%);
      margin-top: 7px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .mini-progress i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
    }
    .progress {
      height: 7px;
      margin-top: 10px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .progress span { display: block; height: 100%; border-radius: 999px; background: var(--blue); }
    .expand {
      display: none;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .row.expanded .expand { display: grid; }
    .subrow {
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      background: #fbfdff;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      margin-top: 12px;
    }
    .weekday {
      min-height: 28px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }
    .day {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--muted);
      padding: 7px 6px;
      text-align: left;
      font-weight: 850;
    }
    .day.blank {
      border-color: transparent;
      background: transparent;
      pointer-events: none;
    }
    .day.has { color: var(--text); }
    .day.selected { border-color: #93c5fd; background: var(--blue-soft); color: var(--blue); }
    .day.today { box-shadow: inset 0 0 0 1px #bfdbfe; }
    .day span { display: block; color: var(--faint); font-size: 11px; font-weight: 850; }
    .day.has span { color: var(--blue); }
    .calendar-note {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--soft);
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .date-group {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .date-group + .date-group { margin-top: 12px; }
    .date-group-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--soft);
      padding: 8px 10px;
      color: var(--muted);
      font-weight: 850;
    }
    .date-group-head b { color: var(--text); font-size: 13px; }
    .date-group-head span { color: var(--muted); font-size: 12px; font-weight: 900; }
    .detail {
      display: none;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfdff;
      padding: 16px;
    }
    .detail.open { display: block; }
    .detail.inline {
      margin-top: 0;
      margin-left: 10px;
      border-left: 4px solid var(--green);
      background: #fff;
    }
    .detail-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .event-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .event-strip span {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--card);
      padding: 9px 10px;
    }
    .event-strip b,
    .event-strip em {
      display: block;
      font-style: normal;
      line-height: 1.25;
    }
    .event-strip b { color: var(--muted); font-size: 11px; font-weight: 900; }
    .event-strip em { margin-top: 4px; color: var(--text); font-size: 12px; font-weight: 900; }
    .source-link {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      margin-top: 10px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 850;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .items { display: grid; gap: 10px; margin-top: 12px; }
    .label { color: var(--muted); font-size: 12px; font-weight: 900; }
    .basis, .item {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--card);
      padding: 12px;
    }
    .basis b, .item b { display: block; color: var(--text); font-size: 14px; }
    .basis span, .item span span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 550; }
    .item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    .item.done { border-color: #99f6e4; background: var(--green-soft); }
    .item input { width: 36px; height: 36px; accent-color: var(--blue); }
    .memo { display: grid; gap: 7px; margin-top: 12px; }
    .memo label { color: var(--text); font-size: 13px; font-weight: 850; }
    textarea {
      width: 100%;
      min-height: 88px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: #fff;
      padding: 10px 12px;
      resize: vertical;
    }
    textarea::placeholder { color: var(--faint); }
    details {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--card);
      padding: 11px;
    }
    summary { min-height: 36px; display: flex; align-items: center; cursor: pointer; font-weight: 850; }
    pre { white-space: pre-wrap; word-break: keep-all; color: var(--muted); font-size: 13px; }
    .crumb {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--soft);
    }
    .crumb button {
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: #fff;
      padding: 5px 10px;
      color: var(--muted);
      font-weight: 850;
    }
    .crumb b { color: var(--text); }
    @media (max-width: 520px) {
      .app { width: min(100% - 20px, 430px); padding-top: 18px; }
      .top, .panel { border-radius: 16px; }
      .top { padding: 16px; }
      .top-row { display: grid; }
      .stat { width: 100%; text-align: left; }
      .head { align-items: flex-start; }
      .tabs { gap: 4px; padding: 5px; }
      .tabs button { min-height: 42px; border-radius: 10px; font-size: 14px; }
      .calendar { gap: 5px; }
      .day { min-height: 54px; padding: 6px 5px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="top-row">
        <div>
          <p class="eyebrow">실행 공간</p>
          <h1>내 Flow</h1>
        </div>
        <aside class="stat" aria-live="polite">
          <b id="todayStat">오늘 6개</b>
          <span id="savedStat">개별 Flow 6개 · 지도 2개</span>
        </aside>
      </div>
    </header>

    <nav class="tabs" aria-label="내 Flow 보기">
      <button type="button" class="active" data-view="today">오늘</button>
      <button type="button" data-view="calendar">일정</button>
      <button type="button" data-view="flows">Flow</button>
      <button type="button" data-view="maps">지도</button>
    </nav>

    <section class="view active panel" id="todayView" aria-labelledby="todayTitle">
      <div class="head">
        <div>
          <p class="eyebrow">오늘</p>
          <h2 id="todayTitle">먼저 할 일</h2>
        </div>
        <span class="count" id="todayCount">6개</span>
      </div>
      <div class="list" id="todayList"></div>
      <article class="detail" id="todayDetail"></article>
    </section>

    <section class="view panel" id="calendarView" aria-labelledby="calendarTitle">
      <div class="head">
        <div>
          <p class="eyebrow">일정</p>
          <h2 id="calendarTitle">2026년 6월</h2>
        </div>
        <span class="count" id="calendarCount">0개</span>
      </div>
      <div class="calendar" id="calendarGrid" aria-label="6월 일정"></div>
      <div class="calendar-note" id="calendarNote"></div>
      <div class="list" id="calendarList"></div>
      <article class="detail" id="calendarDetail"></article>
    </section>

    <section class="view panel" id="flowsView" aria-labelledby="flowsTitle">
      <div class="head">
        <div>
          <p class="eyebrow">개별 Flow</p>
          <h2 id="flowsTitle">저장한 Flow</h2>
        </div>
        <span class="count" id="flowsCount">6개</span>
      </div>
      <div class="list" id="flowList"></div>
      <article class="detail" id="flowDetail"></article>
    </section>

    <section class="view panel" id="mapsView" aria-labelledby="mapsTitle">
      <div class="head">
        <div>
          <p class="eyebrow">Flow 지도</p>
          <h2 id="mapsTitle">지도별 Flow</h2>
        </div>
        <span class="count" id="mapsCount">2개</span>
      </div>
      <div class="list" id="mapList"></div>
      <article class="detail" id="mapDetail"></article>
    </section>
  </main>

        ]
      },
      {
        id: 'move',
        name: '원룸 이사 D-30 준비',
        type: '일정',
        source: 'KB Think 원룸 이사 체크리스트',
        sourceUrl: 'https://kbthink.com/main/living-finance/consumption-life/single-consumption/one-room-move.html',
        steps: [
          {

            title: '이삿짐센터·입주청소 예약',

        state.selectedStep = null;
        render();
      });
      bindOnce('[data-check]', 'change', (event) => {
        state.checks[event.currentTarget.dataset.check] = event.currentTarget.checked;
        render();
      });
      bindOnce('[data-step]', 'change', (event) => {
        state.done[event.currentTarget.dataset.step] = event.currentTarget.checked;
        render();
      });
      bindOnce('[data-memo]', 'input', (event) => {
        state.memos[event.currentTarget.dataset.memo] = event.currentTarget.value;
      });
    }
    function render() {
      renderSummary();
      renderNav();
      renderToday();
      renderCalendar();
      renderFlows();
      renderMaps();
      bind();
    }
    render();
  </script>
</body>
</html>
